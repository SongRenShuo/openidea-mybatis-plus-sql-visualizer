repository = "https://github.com/SongRenShuo/openidea-mybatis-plus-sql-visualizer"
suggest = ["pom.xml"]

# 版本发版后回填：sha256 由 scripts/release-smoke.sh 第 6 步输出，包附件挂
# GitHub Release <version>（songrenshuo.mybatis-plus-sql-visualizer-<version>.oiplugin）。
# tag 即版本号原文，不带 `v` 前缀（2026-11-28 起，见 docs/规范/版本号规范-说明文档.md）；
# 0.1.0 那条是切换前的历史形态，原样保留——已装用户回滚要用它，
# 且索引按 id 分组选最新版，新旧混列由 semver 判大小，不会互相顶掉。
[[versions]]
version = "0.1.0"
package = "https://github.com/SongRenShuo/openidea-mybatis-plus-sql-visualizer/releases/download/v0.1.0/songrenshuo.mybatis-plus-sql-visualizer-0.1.0.oiplugin"
sha256 = "158e8d4737c48b95aa90761dc82fa2c05a41158ac3453737f836835a6ab94ab2"

# 2026.11.29 起：tag 段不带 `v`，与版本号原文一字不差。
[[versions]]
version = "2026.11.29"
package = "https://github.com/SongRenShuo/openidea-mybatis-plus-sql-visualizer/releases/download/2026.11.29/songrenshuo.mybatis-plus-sql-visualizer-2026.11.29.oiplugin"
sha256 = "acdec26f5ed0a31e9295a8ee13886da341e38de95d7fe6f098c48b5a58e6f4c8"
