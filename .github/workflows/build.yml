name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Rust as rust-toolchain.toml; keeping the number in both places is
      # deliberate — the tool file drives local/rustup, this drives the runner
      # before any cargo command runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
          components: clippy,rustfmt

      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Format
        run: cargo fmt --all --check

      # --all-targets is the superset of the plain gate: it also lints the unit
      # tests this repository keeps next to each command.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The CLI must be exactly 0.1.51: it pins the SDK tag (v0.1.51 → plugin
      # API 1.15) that `new` and `build` write into Cargo.toml. A CLI built from
      # `main` targets API 1.16, and no released IDE loads such a component.
      # TODO: the release only ships a linux-x86_64 asset; if it disappears or
      # the mirror is unreachable, fall back to
      # `cargo install --locked --git https://github.com/l0ng-ai/openidea ide-host
      #  --bin openidea-plugin --tag v0.1.51` (slow, ~10 min) and drop the
      # continue-on-error below. Until then a missing CLI is reported but does
      # not fail the run, so fmt/clippy/test stay authoritative in CI.
      - name: Install openidea-plugin 0.1.51
        id: cli
        continue-on-error: true
        run: |
          set -euo pipefail
          tag=v0.1.51
          curl -fsSL --retry 3 -o /tmp/openidea-plugin.gz \
            "https://github.com/l0ng-ai/openidea/releases/download/${tag}/openidea-plugin-linux-x86_64.gz"
          gunzip -c /tmp/openidea-plugin.gz > /usr/local/bin/openidea-plugin
          chmod +x /usr/local/bin/openidea-plugin
          openidea-plugin --version

      - name: Build component
        if: steps.cli.outcome == 'success'
        run: openidea-plugin build

      - name: Check package
        if: steps.cli.outcome == 'success'
        run: openidea-plugin check .

      - uses: actions/upload-artifact@v4
        if: steps.cli.outcome == 'success'
        with:
          name: plugin-wasm
          path: dist/plugin.wasm
          if-no-files-found: error