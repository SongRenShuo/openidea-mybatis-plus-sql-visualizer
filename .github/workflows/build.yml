name: gate

# The authoritative full gate runs here, not on developer machines: a public
# repository gets standard runners for free, and ten parallel lanes each
# compiling the wasm SDK locally is what exhausts memory and disk.
#
# Local work is deliberately narrower: `cargo fmt --check`, the tests of the
# module a lane touched, and (at merge time) one `cargo test` + one
# `openidea-plugin build && check`. Everything else is left to this workflow.
#
# `ci/**` exists so a merge candidate can be gated without pushing master:
#   git push github HEAD:refs/heads/ci/gate-<n> && gh run watch
on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CLI_TAG: v0.1.51

jobs:
  static:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # The manifest gate needs no toolchain: it is a shell check that a
      # contributes key does not need a newer plugin API than engines.openidea
      # allows. `openidea-plugin check` cannot stand in for it — the CLI only
      # knows its own release's extension points and downgrades an unknown key
      # to `not supported by this version of the IDE; skipped` with exit 0,
      # while the host rejects the whole package once it knows the key.
      - run: bash scripts/check-manifest-api.test.sh
      - run: bash scripts/check-manifest-api.sh
      # The panel's logic lives in web/*.js and in log-panel.html's inline
      # module script. A parse error there takes the whole tool window down —
      # no tab labels, no button handlers — while every cargo gate stays green,
      # because the Rust side never reads those files. Node ships on the runner.
      - run: bash scripts/check-web-syntax.test.sh
      - run: node scripts/check-web-syntax.mjs
      - run: cargo fmt --all --check
      # --all-targets is the superset gate: it also lints the unit tests.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  package:
    name: build + check + artifact
    needs: [static, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      # Exactly 0.1.51: the CLI pins the SDK tag (v0.1.51 → plugin API 1.15)
      # that `new` and `build` write into Cargo.toml. A CLI built from `main`
      # targets API 1.16, and no released IDE loads such a component.
      - name: Install openidea-plugin ${{ env.CLI_TAG }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/openidea-plugin.gz \
            "https://github.com/l0ng-ai/openidea/releases/download/${CLI_TAG}/openidea-plugin-linux-x86_64.gz"
          gunzip -c /tmp/openidea-plugin.gz > /usr/local/bin/openidea-plugin
          chmod +x /usr/local/bin/openidea-plugin
          openidea-plugin --version | tee /tmp/cli-version.txt
          grep -F "0.1.51" /tmp/cli-version.txt

      - name: Build component
        run: openidea-plugin build

      - name: Check package
        run: openidea-plugin check .

      # The jar is never committed (only the version + sha256 pin are), so the
      # gate checks the pin itself. A developer with the jar runs the full form.
      - name: Engine pin check
        run: bash scripts/verify-engine.sh --pin-only

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-wasm
          path: |
            dist/plugin.wasm
            Cargo.lock
          if-no-files-found: error

      # A failing job must not look like a skipped one: the CLI step is no
      # longer continue-on-error, so a missing asset fails the package gate
      # instead of silently dropping build+check.