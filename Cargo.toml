[package]
name = "openidea-plugin-mybatis-plus-sql-visualizer"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

# Pinned to the SDK shipped with openidea-plugin 0.1.51 (plugin API 1.15).
# Building against `main` targets API 1.16, which no released IDE loads.
[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.51" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"