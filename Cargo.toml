[package]
name = "openidea-plugin-mybatis-plus-sql-visualizer"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
# `cdylib` is the shipped component; `rlib` lets `tests/` link the crate so the
# parity harness (T1-12) and the ignored jar e2e test can call `core` directly.
crate-type = ["cdylib", "rlib"]

# Pinned to the SDK shipped with openidea-plugin 0.1.51 (plugin API 1.15).
# Building against `main` targets API 1.16, which no released IDE loads.
[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.54" }
# JSON for the engine protocol, MCP argument/result bodies and log records.
# Both are Apache-2.0/MIT and already in the SDK's tree, so the build cost is nil.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQL log panel search: the `.*` toggle is a real regular expression, including
# case-insensitive matching and `\b`/`\d`/`\w`. Built without the `perf` DFA
# tables (log search is small) so the wasm stays lean; an invalid pattern is
# reported per match attempt, never panics.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"