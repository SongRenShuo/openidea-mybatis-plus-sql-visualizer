# Diagnostics for big projects: what the Java/XML indexes hold and what indexing
# cost (documents, bytes, total and slowest document). No arguments.
[[contributes.commands]]
id = "index-stats"
title = "Index Stats"
category = "MyBatis SQL Visualizer"

# About-page actions (the reference's About page closes with two buttons).
# `cache-clear` empties the runtime indexes — the process-wide Java/XML method
# and statement indexes and their cost counters — plus the pending
# capture-start slot. Captured SQL files, the log panel's contents and SQL
# history are user data and are not touched (the reference's boundary: caches
# only, never history).
[[contributes.commands]]
id = "cache-clear"
title = "Clear caches"
category = "MyBatis SQL Visualizer"

# Prints the per-build MPV-Build stamp build.rs baked into the wasm (the same
# kind of number the reference shows on its About page), so same-day rebuilds
# of one version can be told apart in bug reports.
[[contributes.commands]]
id = "build-info"
title = "Build number"
category = "MyBatis SQL Visualizer"

# SQL preview (the plugin's main action): `<mapper.xml>#<id>`, a mapper file, a
# bare path, inline SQL, or — with no argument — the current editor's selection or
# whole document (`editor.read`, optional). Opens the preview tab on the right.
[[contributes.commands]]
id = "preview-sql"
title = "Preview SQL"
category = "MyBatis SQL Visualizer"

# The same render, opened in the diff viewer (original vs SQL): its tab has
# "open in a new window", which is how a plugin gets the preview into its own
# window without a dialog API.
[[contributes.commands]]
id = "preview-sql-diff"
title = "Preview SQL in Diff"
category = "MyBatis SQL Visualizer"

# The IntelliJ edition binds Alt+Shift+Q to its preview action; the same key here.
[[contributes.keymaps]]
command = "preview-sql"
key = "Alt+Shift+Q"

# Java agent (L7/L12): captures SQL from Application / Spring Boot / JAR
# Application run configurations. Declaring it derives the high-risk java.agent
# capability; refusing it leaves the log-file path. The transport switch is a
# JVM system property, so it must ride in vmOptions, not in args.
[[contributes.javaAgents]]
path = "agent/mps-sql-agent.jar"
args = "port=17890,stackFrames=24"
vmOptions = ["-Dmpsv.capture.transport=ws"]

# Agent skill: how to accept this plugin inside a real IDE (readings, defect
# ledger, package-page traps). Shows under Settings › Agents › Skills.
[[contributes.skills]]
path = "skills/openidea-ide-acceptance/SKILL.md"

