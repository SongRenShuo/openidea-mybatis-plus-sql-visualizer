id = "songrenshuo.mybatis-plus-sql-visualizer"
name = "MyBatis SQL Visualizer"
version = "0.1.0"
description = "Renders MyBatis mapper XML, annotation SQL, Wrapper chains and SQL logs into executable SQL, and checks a statement before it touches a database."
authors = ["songrenshuo"]
homepage = "https://gitee.com/songrenshuo/openidea-mybatis-plus-sql-visualizer"
license = "Apache-2.0"
categories = ["tools"]
# Package logo, the same 40×40 icon the IntelliJ plugin ships (Settings › Plugins
# and the marketplace). `icon-dark` is the real dark variant.
icon = "icons/pluginIcon.svg"
icon-dark = "icons/pluginIcon-dark.svg"
engines.openidea = "^1.15"
# Built by `openidea-plugin build`. The code is loaded the first time one of its
# commands runs; the commands below show in Find Action before that.
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-event:websocket-ready"]

# What the code may do. The user approves these when installing.
# - project.read: render and check statements against the project's mapper XML and
#   source files, which is the whole point of the plugin. It cannot write anything.
[capabilities]
required = ["project.read", "events"]
# clipboard: the log panel and the workbench copy/export SQL. Refusing it only
# disables those two buttons; rendering, navigation and checks keep working.
# process:java: starts the pinned engine jar (engine/ENGINE_VERSION) for Wrapper
# rendering and EXPLAIN statement wrapping, and lets the Java agent attach.
# Refusing it degrades to text mode; every other feature still works.
# net:127.0.0.1: connects as a client to the agent's loopback capture socket
# (the sandbox has no raw sockets). Refusing it leaves the log-file path.
# editor.read: the `preview-sql` command reads the current editor's selection (or
# the whole document) when it is invoked without arguments. Refusing it keeps the
# argument forms working.
# clipboard.read: the log→SQL tab can pull the log text from the clipboard. Its
# own medium-risk grant, separate from write-only `clipboard`; refusing it leaves
# the paste-into-the-box path.
optional = ["clipboard", "clipboard.read", "process:java", "net:127.0.0.1", "editor.read"]

[[contributes.commands]]
id = "render-xml"
title = "MyBatis SQL: Render Mapper XML"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "check-sql"
title = "MyBatis SQL: Check SQL"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "perf-advice"
title = "MyBatis SQL: Performance Advice"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "generate-crud"
title = "MyBatis SQL: Generate CRUD"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "rollback-plan"
title = "MyBatis SQL: Rollback Plan"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "render-log"
title = "MyBatis SQL: Render SQL Log"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "capture-start"
title = "MyBatis SQL: Start Capture"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "capture-stop"
title = "MyBatis SQL: Stop Capture"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "capture-status"
title = "MyBatis SQL: Capture Status"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "capture-poll"
title = "MyBatis SQL: Poll Capture"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "capture-open-log"
title = "MyBatis SQL: Open Capture Log"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "open-logs"
title = "MyBatis SQL: Open SQL Logs"
category = "MyBatis SQL Visualizer"

[[contributes.commands]]
id = "open-workbench"
title = "MyBatis SQL: Open Workbench"
category = "MyBatis SQL Visualizer"

# Diagnostics for big projects: what the Java/XML indexes hold and what indexing
# cost (documents, bytes, total and slowest document). No arguments.
[[contributes.commands]]
id = "index-stats"
title = "MyBatis SQL: Index Stats"
category = "MyBatis SQL Visualizer"

# SQL preview (the plugin's main action): `<mapper.xml>#<id>`, a mapper file, a
# bare path, inline SQL, or — with no argument — the current editor's selection or
# whole document (`editor.read`, optional). Opens the preview tab on the right.
[[contributes.commands]]
id = "preview-sql"
title = "MyBatis SQL: Preview SQL"
category = "MyBatis SQL Visualizer"

# The same render, opened in the diff viewer (original vs SQL): its tab has
# "open in a new window", which is how a plugin gets the preview into its own
# window without a dialog API.
[[contributes.commands]]
id = "preview-sql-diff"
title = "MyBatis SQL: Preview SQL in Diff"
category = "MyBatis SQL Visualizer"

# The IntelliJ edition binds Alt+Shift+Q to its preview action; the same key here.
[[contributes.keymaps]]
command = "preview-sql"
key = "Alt+Shift+Q"

# Java agent (L7/L12): captures SQL from Application / Spring Boot / JAR
# Application run configurations. Declaring it derives the high-risk java.agent
# capability; refusing it leaves the log-file path. The transport switch is a
# JVM system property, so it must ride in vmOptions, not in args.
[[contributes.javaAgents]]
path = "agent/mps-sql-agent.jar"
args = "port=17890,stackFrames=24"
vmOptions = ["-Dmpsv.capture.transport=ws"]

# Agent skill: how to accept this plugin inside a real IDE (readings, defect
# ledger, package-page traps). Shows under Settings › Agents › Skills.
[[contributes.skills]]
path = "skills/openidea-ide-acceptance/SKILL.md"

# Project view context menu: the first selected path becomes the command
# argument, so a log file opens without typing a path.
[[contributes.menus]]
menu = "projectView.context"
command = "capture-open-log"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "render-xml"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "check-sql"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "perf-advice"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "generate-crud"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "rollback-plan"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "render-log"
submenu = "SQL Visualizer"

[[contributes.menus]]
menu = "projectView.context"
command = "open-workbench"
submenu = "SQL Visualizer"

# The single plugin tool window: SQL Logs on the right rail, as the IntelliJ
# plugin's SQL Logs tool window. Its five tabs carry the workbench too
# (SQL logs / log to SQL / SQL to Java / history / SQL preview).
[[contributes.views]]
id = "sqlv-logs"
title = "SQL Logs"
icon = "icons/sqlLog.svg"
location = "right"
web = "web/log-panel.html"

# Settings: one node named after the plugin, split into pages like the IntelliJ
# edition's `Tools › SQL Visualizer` (UI and Actions / SQL Preview / SQL Log /
# Engine). Keys are unchanged; only the page they live on moved.
[contributes.settings]
title = "MyBatis SQL Visualizer"

[[contributes.settings.pages]]
id = "ui-actions"
title = "UI and Actions"
schema = "settings/ui-actions.json"

[[contributes.settings.pages]]
id = "sql-preview"
title = "SQL Preview"
schema = "settings/sql-preview.json"

[[contributes.settings.pages]]
id = "sql-log"
title = "SQL Log"
schema = "settings/sql-log.json"

[[contributes.settings.pages]]
id = "engine"
title = "Engine"
schema = "settings/engine.json"

# Gutter markers and the mapper XML file icon (L5).
[[contributes.markerIcons]]
id = "mapper"
icon = "icons/marker-mapper.svg"
iconDark = "icons/marker-mapper-dark.svg"

[[contributes.markerIcons]]
id = "statement"
icon = "icons/marker-statement.svg"
iconDark = "icons/marker-statement-dark.svg"

[[contributes.markerIcons]]
id = "resultmap"
icon = "icons/marker-resultmap.svg"
iconDark = "icons/marker-resultmap-dark.svg"

# The gutter preview button's icon (L35a): declared here so the package ships and
# validates it; the button itself is a `gutter-actions` entry.
[[contributes.markerIcons]]
id = "sql-preview"
icon = "icons/sqlGutter.svg"

[[contributes.fileIcons]]
id = "mapper-xml"
patterns = ["*Mapper.xml", "*mapper.xml"]
icon = "icons/mapper-xml.svg"
iconDark = "icons/mapper-xml-dark.svg"

# Background Mapper↔XML graph (L6): cross-file definitions and references.
[[contributes.documentIndexers]]
extensions = ["xml", "java"]

# Name-level navigation and gutter markers; off by default (`nav.enabled`).
[[contributes.providers]]
kinds = ["definition", "line-markers"]
languages = ["xml", "java"]

# The preview button beside each mapper statement (L35a); its click runs
# `preview-sql` with `<path>#<statementId>`.
[[contributes.providers]]
kinds = ["gutter-actions"]
languages = ["xml"]

# Hover card with the rendered SQL on a statement id, a fragment, a result map or
# a mapper method (L37): the in-place preview the platform can offer instead of a
# dialog.
[[contributes.providers]]
kinds = ["hover"]
languages = ["xml", "java"]

# SQL highlighting inside mapper XML; off by default (`injections.enabled`).
[[contributes.providers]]
kinds = ["injections"]
languages = ["xml"]

# INSERT target columns, only when a column source is supplied.
[[contributes.providers]]
kinds = ["inlay-hints"]
languages = ["xml", "java"]

# Unknown columns and dialect quote mismatches; never guesses without a schema.
[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["xml", "java"]

# MCP tools (L9). Every tool is pure text/JSON: none reads the project, starts a
# process, opens a connection or writes a database, so all are readOnly and
# none is destructive. Generated SQL is returned as text only.
[[contributes.mcpTools]]
name = "sqlv_render_sql"
description = "Render one MyBatis mapper statement to SQL with ? placeholders and bound parameters."
inputSchema = "src/mcp/schemas/sqlv_render_sql.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_render_logs"
description = "Parse MyBatis, p6spy, Hibernate or JdbcTemplate log text into statements, duplicates and N+1 groups."
inputSchema = "src/mcp/schemas/sqlv_render_logs.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_check_sql"
description = "Classify a SQL statement, flag unbounded UPDATE/DELETE and destructive DDL, and list performance findings."
inputSchema = "src/mcp/schemas/sqlv_check_sql.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_perf_advice"
description = "Run performance rules, a 0-100 complexity score and index advice on one SQL statement."
inputSchema = "src/mcp/schemas/sqlv_perf_advice.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_crud_sql"
description = "Generate select/insert/update/delete/batch-insert SQL for a table description."
inputSchema = "src/mcp/schemas/sqlv_crud_sql.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_rollback_plan"
description = "Build a rollback plan (snapshot plus reverse statements) for an UPDATE or DELETE; refused without a primary key."
inputSchema = "src/mcp/schemas/sqlv_rollback_plan.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_reverse_sql"
description = "Translate a single-table SELECT into a MyBatis-Plus LambdaQueryWrapper chain; unsupported shapes are reported as unresolved, never guessed."
inputSchema = "src/mcp/schemas/sqlv_reverse_sql.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_mapper_check"
description = "Load mapper XML documents and report duplicate ids, dangling includes, missing resultMaps and unparseable files."
inputSchema = "src/mcp/schemas/sqlv_mapper_check.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_history_search"
description = "Search the log text supplied in this call for lines containing a query; there is no IDE history access."
inputSchema = "src/mcp/schemas/sqlv_history_search.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_schema_context"
description = "Format a caller-supplied schema (tables, columns, indexes) as compact DDL-like text for an agent prompt."
inputSchema = "src/mcp/schemas/sqlv_schema_context.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_explain"
description = "Format an EXPLAIN result supplied by the caller as a tree or table; this tool never executes SQL."
inputSchema = "src/mcp/schemas/sqlv_explain.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "sqlv_index_stats"
description = "Report what the plugin's own Java/XML indexes hold and what indexing them cost (documents, bytes, total and slowest document)."
inputSchema = "src/mcp/schemas/sqlv_index_stats.schema.json"
readOnly = true
destructive = false