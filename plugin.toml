id = "songrenshuo.mybatis-plus-sql-visualizer"
name = "MyBatis SQL Visualizer"
version = "2026.11.29"
description = """写代码时不用启动应用：mapper XML、注解 SQL、iBatis 2.x sqlMap、MyBatis-Plus / MPJ 的 Wrapper 链（联表、联表更新与删除、子查询）直接还原成数据库真正会收到的那条 SQL，参数自动回填。｜ 运行后，SQL 日志页签实时看真实执行：Java agent 增强捕获（Application / Spring Boot / JAR 运行配置），或把 MyBatis / iBatis / Hibernate / JdbcTemplate 四族控制台日志粘进面板还原；真实参数与耗时放在一起，同结构聚类、去重、慢查询高亮、N+1 疑似检测，双击跳回源码。｜ 每条结果先过检查：方言写法、不安全的写操作、性能规则与回滚计划。｜ 判不出来就标 unresolved 并给原因，绝不猜——服务未启，SQL 先知。｜ 工具窗五页签：SQL 日志、日志转 SQL、SQL 转 Java、历史、SQL 预览。｜ 12 个只读 MCP 工具把同一引擎交给 AI 智能体。｜ 交流群二维码：SQL 日志面板工具栏的对话气泡图标。｜ 权限用途（设置 › 插件 › 已安装 › 本插件的 Permissions 可随时勾选或取消）：读项目是还原 SQL 的根基；增强捕获需 java.agent 与 net:127.0.0.1（拒绝时用「日志转 SQL」粘贴还原，无需权限）；process:java 只用于启动哈希校验过的本地引擎 jar（EXPLAIN 与预览执行）；剪贴板两项只服务复制与导入。"""
authors = ["songrenshuo"]
# 详情页「新功能」区块。一条一行，首版是功能范围而非增量（用户口径：发行说明
# 一条一行、一版 ≤8 条）。
change-notes = """2026.11.29 — 首个 OpenIDEA 版：mapper XML / 注解 / iBatis / Wrapper 链静态还原 SQL，参数自动回填
2026.11.29 — MyBatis-Plus 与 MPJ 全形态：联表、联表更新与删除、子查询
2026.11.29 — SQL 日志五页签：增强捕获、四族日志粘贴还原、聚类去重、慢查询、N+1
2026.11.29 — 检查面：方言写法、无界写操作、性能规则、回滚计划
2026.11.29 — 12 个只读 MCP 工具；Gutter 预览图标与 Mapper↔XML 导航
2026.11.29 — 权限可随时补授，缺失时各功能降级并在界面说明"""
homepage = "https://github.com/SongRenShuo/openidea-mybatis-plus-sql-visualizer"
license = "Apache-2.0"
categories = ["tools"]
# Package logo: the 40×40 icon the IntelliJ plugin ships (Settings › Plugins and
# the marketplace). Light only on purpose — the IntelliJ edition keeps
# `pluginIcon_dark.svg` as a spare and always shows the light artwork, so
# declaring `icon-dark` would swap it on a dark theme, which the original never
# does.
icon = "icons/pluginIcon.svg"
engines.openidea = "^1.18"
# Built by `openidea-plugin build`. The code is loaded the first time one of its
# commands runs; the commands below show in Find Action before that.
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-event:websocket-ready"]

# What the code may do. The user approves these when installing.
# - project.read: render and check statements against the project's mapper XML and
#   source files, which is the whole point of the plugin. It cannot write anything.
# - storage: the SQL history tab persists snapshots in the plugin's own key-value
#   store (per project, max 10 files / 512 KB each). No project files are touched.
[capabilities]
required = ["project.read", "events", "storage"]
# clipboard: the log panel and the workbench copy/export SQL. Refusing it only
# disables those two buttons; rendering, navigation and checks keep working.
# process:java: starts the pinned engine jar (engine/ENGINE_VERSION) for Wrapper
# rendering and EXPLAIN statement wrapping, and lets the Java agent attach.
# Refusing it degrades to text mode; every other feature still works.
# net:127.0.0.1: connects as a client to the agent's loopback capture socket
# (the sandbox has no raw sockets). Refusing it leaves the log-file path.
# editor.read: the `preview-sql` command reads the current editor's selection (or
# the whole document) when it is invoked without arguments. Refusing it keeps the
# argument forms working.
# clipboard.read: the log→SQL tab can pull the log text from the clipboard. Its
# own medium-risk grant, separate from write-only `clipboard`; refusing it leaves
# the paste-into-the-box path.
optional = ["clipboard", "clipboard.read", "process:java", "net:127.0.0.1", "editor.read"]

