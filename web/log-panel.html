<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Visualizer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font: var(--openidea-font-size, 13px)/1.4 var(--openidea-font-ui, sans-serif);
      color: var(--openidea-fg);
      background: var(--openidea-bg);
    }

    /* Action row (the host draws no toolbar for a packaged page). Icon buttons
       the way an IDE toolbar draws them: a 24×24 hit area around a 16×16
       inline SVG, hover showing a 3px-radius plate. The SVG paths are the
       Apache-2.0 icons under icons/toolbar/, recoloured with currentColor so
       the host theme decides the ink. */
    .actionbar {
      display: flex; align-items: center; gap: 2px; flex: 0 0 auto;
      padding: 3px 6px; border-bottom: 1px solid var(--openidea-border);
      /* Anchors the blocked-methods popup (L26), which drops from a button. */
      position: relative;
    }
    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; flex: 0 0 auto;
      background: transparent; border: 1px solid transparent; border-radius: 3px;
      color: var(--openidea-fg-muted); cursor: pointer;
    }
    .iconbtn:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .iconbtn:focus-visible { border-color: var(--openidea-accent); outline: none; }
    .iconbtn.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); }
    .iconbtn.run { color: var(--openidea-success); }
    /* A disabled action greys out like the platform's ActionToolbar: the ink
       drops to the muted grey and the glyph fades, but the button keeps its
       footprint so the row does not reflow. */
    .iconbtn[disabled], .iconbtn[aria-disabled="true"] {
      color: var(--openidea-fg-muted); opacity: 0.45; cursor: default;
    }
    .iconbtn[disabled]:hover, .iconbtn[aria-disabled="true"]:hover { background: none; }
    .iconbtn svg { width: 16px; height: 16px; display: block; fill: none; }
    /* Toolbar layout (L32): the icon actions on the left, then a spacer so the
       slow count, the SQL-type selector and the dedupe box keep their width at
       the right edge, the way the reference toolbar draws them. No `overflow`
       anywhere on this row: the popups drop out of it. */
    .actionbar .spacer { margin-left: auto; }
    .actionbar .rightgroup {
      display: flex; align-items: center; gap: 8px;
      position: relative; flex: 0 0 auto;
    }
    /* Sort entry (L2): the icon plus the current mode's name, so the list's order
       is readable without opening the popup. The button keeps the toolbar's
       footprint on the left and only grows for its label. */
    #sortBtn { width: auto; padding: 0 5px; gap: 3px; }
    #sortBtnText { font-size: 11px; color: var(--openidea-fg-muted); white-space: nowrap; }
    .iconbtn:hover #sortBtnText, .iconbtn.on #sortBtnText { color: inherit; }
    /* A popup drops from the button that opened it, not from the row's edge. */
    .menuanchor { position: relative; display: inline-flex; flex: 0 0 auto; }
    /* The type menu hangs off the right edge of the panel, so it never runs off
       a narrow window (the selector itself sits at the right edge). */
    #typeMenu { left: auto; right: 0; }
    /* Menu entries that are real buttons (the settings popup): a .menu-item
       reset onto a <button>. */
    button.menu-item {
      display: flex; width: 100%; align-items: center; gap: 6px;
      background: none; border: none; color: var(--openidea-fg);
      font: inherit; font-size: 12px; text-align: left; cursor: pointer;
    }
    button.menu-item svg {
      width: 14px; height: 14px; display: block; flex: 0 0 auto;
      color: var(--openidea-fg-muted);
    }
    button.menu-item.on { background: var(--openidea-bg-selected); }
    button.menu-item.on svg { color: var(--openidea-success); }

    /* Active-filter row (L32): the toolbar now owns the type selector and the
       dedupe box, so this row only carries what actually narrows the list —
       the focus chip and the muted-method counter. It hides itself when both
       are empty instead of leaving a bare 1px rule under the toolbar. */
    .filterbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
      flex: 0 0 auto;
    }
    /* Type selector: an IDE "chip" — small icon, current value, caret. */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px;
      background: transparent; color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 11px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .chip:hover { background: var(--openidea-bg-hover); }
    .chip[aria-expanded="true"] { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .chip svg { width: 12px; height: 12px; display: block; color: var(--openidea-fg-muted); fill: none; }
    /* Focus / muted chips in the filter row (lane L28). A focus chip is the
       active filter and carries an × that clears it; the muted counter does the
       same for the session's muted methods. Both stay in the left flow. */
    .chips { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
    .fchip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; max-width: 260px; padding: 0 4px 0 8px;
      background: var(--openidea-bg-selected); color: var(--openidea-fg-strong);
      border: 1px solid var(--openidea-accent); border-radius: 11px;
      font-size: 12px; white-space: nowrap;
    }
    .fchip .ftext { overflow: hidden; text-overflow: ellipsis; }
    .fchip .fclose {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; padding: 0; flex: 0 0 auto;
      background: none; border: none; border-radius: 8px;
      color: var(--openidea-fg-muted); cursor: pointer; font-size: 12px; line-height: 1;
    }
    .fchip .fclose:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    /* Text buttons follow an IDE toolbar button: flat, icon + label, one line.
       They used to be bordered form buttons, which read as a settings page
       rather than the reference's action bar. */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; color: var(--openidea-fg);
      border: 1px solid transparent; border-radius: 3px;
      padding: 2px 7px; min-height: 24px; cursor: pointer;
      font-size: 12px; white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; fill: none; }
    /* Icon-only, like the reference's ActionToolbar. The label stays in the DOM
       for setText but is not drawn; title/aria-label carry it on hover. */
    .btn [data-btnlabel] { display: none; }
    select.btn {
      background: var(--openidea-bg-input); border-color: var(--openidea-border);
      padding: 2px 4px;
    }
    .btn:hover { background: var(--openidea-bg-hover); }
    .btn.on { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .caret { color: var(--openidea-fg-muted); font-size: 9px; line-height: 1; }
    .chk {
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; user-select: none; white-space: nowrap; font-size: 12px;
    }

    /* Type popup */
    .menu {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 30;
      min-width: 210px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .menu-item {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .menu-item:hover { background: var(--openidea-bg-hover); }
    /* The sort popup is a radio list, the way the reference builds it
       (`JRadioButtonMenuItem`): the checked row carries a check mark and the
       popup keeps the widest label's width. */
    .radiolist { min-width: 160px; }
    .radiolist .menu-item { padding-left: 2px; }
    .radiolist .check {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; flex: 0 0 14px; font-size: 12px; line-height: 1;
      color: var(--openidea-link);
    }
    .radiolist .menu-item.on { background: var(--openidea-bg-selected); }
    .menu-sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    .menu-footer { display: flex; justify-content: space-between; padding: 2px 4px; }
    .linkbtn {
      background: none; border: none; color: var(--openidea-link);
      cursor: pointer; padding: 2px 4px; font-size: 12px;
    }
    .linkbtn:hover { text-decoration: underline; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; flex: 0 0 auto; }

    /* Search row */
    .searchrow {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
    }
    .kw {
      flex: 1 1 auto; min-width: 80px;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px; padding: 2px 6px;
    }
    .tog {
      background: var(--openidea-bg-input); color: var(--openidea-fg-muted);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 2px 6px; cursor: pointer; font-family: var(--openidea-font-mono, monospace);
    }
    .tog.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); border-color: var(--openidea-accent); }
    .muted { color: var(--openidea-fg-muted); }
    .danger { color: var(--openidea-danger); }
    /* Badge chips the way the IDE draws tags: a 8px-radius capsule at 10px
       whose fill is the semantic colour mixed 16% into the row background.
       color-mix keeps the host variable as the single colour source; the
       plain declaration above it is the fallback for engines without it. */
    .badge {
      display: inline-flex; align-items: center; height: 15px; padding: 0 6px;
      border-radius: 8px; font-size: 10px; line-height: 1;
      color: var(--openidea-fg); white-space: nowrap;
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-fg-muted) 16%, transparent);
    }
    .badge.group {
      color: var(--openidea-warning);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-warning) 16%, transparent);
    }
    .badge.n1 {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }
    /* The ⨉N / ×N badges are clickable buttons (lane L26): a button reset on
       the capsule, so the group expands / collapses on click. */
    button.badge {
      background: none; border: none; cursor: pointer; font: inherit;
    }
    button.badge:hover { filter: brightness(1.15); }
    /* A row that belongs to an expanded group (lane L26): indented under its
       head, each occurrence showing its own time and duration. */
    .row .content.member { padding-left: 22px; }
    .row .content.member .meta { color: var(--openidea-fg-muted); }
    /* Right-aligned counter capsule in the filter row. */
    .pill {
      display: inline-flex; align-items: center; height: 16px; padding: 0 8px;
      border-radius: 8px; font-size: 10px; line-height: 1; white-space: nowrap;
    }
    .pill.danger {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }

    /* List — one JBList-style row per statement: a 3px type bar, a muted
       metadata line and the statement itself, separated by 1px rules.

       No alternating row colours and no hover plate: the reference list paints
       one flat surface and only the selected row is filled. Vertical breathing
       room is 12px per cell (8px in single-line mode, where a row holds one
       statement line), and the 3px gap between the metadata line and the
       statement is the reference's `EmptyBorder` split. */
    .list { flex: 1 1 auto; overflow: auto; }
    .row {
      display: flex; align-items: stretch; min-height: 40px;
      border-bottom: 1px solid var(--openidea-border); cursor: default;
    }
    .row.sel { background: var(--openidea-bg-selected); }
    /* CRUD marker (`logs.crud.style`, default `bar`): the type colour arrives
       as the row's own `--row-type` custom property, so this stylesheet never
       names a colour value. DDL (CREATE/DROP) uses a 3px-solid / 3px-gap dash
       pattern in the same colour — the shape, not the hue, is what tells DDL
       from DML, exactly like the reference. */
    .row .bar {
      width: 3px; flex: 0 0 3px;
      background: var(--row-type, var(--openidea-fg-muted));
    }
    .row .bar.ddl {
      background: repeating-linear-gradient(
        to bottom,
        var(--row-type, var(--openidea-fg-muted)) 0 3px,
        transparent 3px 6px
      );
    }
    /* `background`: the whole row carries a 14% tint of its type colour. A
       selected row keeps the platform's selection fill instead. */
    .list[data-crud="background"] .row:not(.sel) {
      background: color-mix(in srgb, var(--row-type, var(--openidea-fg-muted)) 14%, var(--openidea-bg));
    }
    .list[data-crud="background"] .row .bar,
    .list[data-crud="off"] .row .bar { display: none; }
    .row .content { flex: 1 1 auto; min-width: 0; padding: 12px 9px 12px 5px; }
    .list[data-mode="single"] .row .content { padding-top: 8px; padding-bottom: 8px; }
    /* Selection paints the row's own ink over the syntax colours, exactly like
       the reference renderer: every fragment is re-projected with the selection
       foreground, so keyword/string/table colours disappear while the row is
       selected. The declaration is scoped to the row's content, not to the
       rest of the panel. */
    .row.sel .content span { color: inherit; }
    /* The metadata line is a plain left-to-right flow, the way the reference
       panel draws it: #seq, time, duration, [db], (rows), ⨉N, ×N, N+1,
       [file:line], [Class#method]. Nothing is pushed to the right — the only
       right-aligned element of the panel is the "slow" capsule in the filter
       row (`#slowBadge { margin-left: auto }`). */
    .meta {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 8px; font-size: 11px; color: var(--openidea-fg-muted);
    }
    /* The whole metadata line is the reference's `secondaryAttributes`
       (`MpvsUiColors.META_GRAY`, plain style) — including `#seq`, which the
       reference prints grey and unbolded. Only the duration, the database badge
       and the group badges carry their own ink. */
    .meta .seq { font-family: var(--openidea-font-mono, monospace); }
    .meta .time, .meta .dur { font-family: var(--openidea-font-mono, monospace); }
    /* Duration ink, four tiers against `log.slowThresholdMs` (T): `≥T` red,
       `≥T/2` orange, `<T/2` green, unknown grey. An approximated duration (a
       value the parser inferred from a neighbouring line) carries a `~`
       prefix; the tier decision is the page's single `durationTier` helper. */
    .meta .dur.slow { color: var(--openidea-danger); }
    .meta .dur.warn { color: var(--openidea-warning); }
    .meta .dur.ok { color: var(--openidea-success); }
    .meta .dur.none { color: var(--openidea-fg-muted); }
    /* Metadata ink (the reference's fragments): the database badge is cyan, an
       MCP-sourced row violet, the affected-row count blue-grey. */
    .meta .db { color: var(--openidea-info); }
    .meta .mcp { color: color-mix(in srgb, var(--openidea-link) 50%, var(--openidea-danger)); }
    .meta .rows { color: color-mix(in srgb, var(--openidea-link) 55%, var(--openidea-fg-muted)); }
    .meta .part { white-space: nowrap; }
    /* Provenance parts that filter on click (lane L28): the class#method and the
       request id behave like links without losing the row's own click. */
    .meta .focusable { cursor: pointer; }
    .meta .focusable:hover { color: var(--openidea-link); text-decoration: underline; }
    .meta .focusable.on { color: var(--openidea-link); font-weight: 600; }
    .sql {
      margin-top: 3px; font-family: var(--openidea-font-ui, sans-serif);
      font-size: 12px; line-height: 1.4;
      white-space: pre-wrap; word-break: break-word; color: var(--openidea-fg);
    }
    /* The folded-lines counter (`… (+N)`) is muted so it never competes with the
       statement itself (L32). */
    .sql .sqlTail { color: var(--openidea-fg-muted); }
    .err {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--openidea-danger);
    }
    /* Empty state: the platform draws a JList's `StatusText` as muted, plain,
       centred text; lane A matches that (grey ink, no italic, no bold) and keeps
       the reference's two lines — what to do, then the shorter guidance. */
    .empty {
      flex: 1 1 auto; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      color: var(--openidea-fg-muted); padding: 16px; text-align: center;
    }
    .empty .hint { font-size: 12px; opacity: 0.9; }

    /* Bottom status: one muted 11px line, segments separated by a middot. */
    .status {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0;
      padding: 3px 8px; border-top: 1px solid var(--openidea-border);
      font-size: 11px; color: var(--openidea-fg-muted);
      background: var(--openidea-bg-elevated);
    }
    .status #statusMid::before, .status #statusRight::before {
      content: '\00b7'; margin: 0 8px; opacity: 0.7;
    }
    /* An empty segment draws no separator (L32): the enhanced-channel state is
       only named while that channel is on. */
    .status #statusMid:empty::before, .status #statusRight:empty::before {
      content: none; margin: 0;
    }

    /* In-panel sheets (L2): a dimmed backdrop and a centred card inside the log
       panel. The platform has no API to open the settings page or a dialog from
       a packaged page, so these three entries explain themselves in place. */
    .sheet {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-backdrop {
      position: absolute; inset: 0;
      background: color-mix(in srgb, var(--openidea-fg) 25%, transparent);
    }
    .sheet-panel {
      position: relative; display: flex; flex-direction: column;
      width: min(460px, calc(100% - 32px)); max-height: calc(100% - 48px);
      background: var(--openidea-bg-elevated);
      border: 1px solid var(--openidea-border); border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .sheet-head {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--openidea-border);
    }
    .sheet-title { flex: 1 1 auto; font-weight: 600; font-size: 13px; }
    .sheet-close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; padding: 0; flex: 0 0 auto;
      background: none; border: 1px solid transparent; border-radius: 3px;
      color: var(--openidea-fg-muted); cursor: pointer; font-size: 14px; line-height: 1;
    }
    .sheet-close:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .sheet-body {
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px 12px 14px; overflow: auto; font-size: 12px;
    }
    .sheet-row { display: flex; align-items: baseline; gap: 12px; }
    .sheet-row .k { flex: 0 0 46%; color: var(--openidea-fg-muted); }
    .sheet-row .v { flex: 1 1 auto; min-width: 0; }
    .sheet-line { line-height: 1.55; }
    .sheet-hint {
      color: var(--openidea-fg-muted); line-height: 1.55;
      border-top: 1px dashed var(--openidea-border); padding-top: 8px;
    }
    .sheet-qr {
      width: 96px; height: 96px; align-self: center;
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed var(--openidea-border); border-radius: 4px;
      color: var(--openidea-fg-muted); font-size: 10px; text-align: center;
      padding: 6px;
    }

    /* Context menu */
    .ctxmenu {
      position: fixed; z-index: 50; min-width: 160px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .ctxmenu button {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--openidea-fg); padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    .ctxmenu button:hover { background: var(--openidea-bg-hover); }
    /* A row that does not state the dimension gets a disabled item, never a
       guessed target (lane L28). */
    .ctxmenu button[disabled] { color: var(--openidea-fg-muted); opacity: 0.55; cursor: default; }
    .ctxmenu button[disabled]:hover { background: none; }
    .ctxmenu .sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    /* Tab strip (L32): the new-UI **underline** tabs, not JBTabs cards. Every
       tab is a borderless label sitting on the strip's 1px rule; the selected
       one wears a 2px accent underline instead of a raised page. Tabs shrink
       until the labels stop being readable and only then overflow: a ~320px
       panel still shows all five, a narrower one scrolls and `selectTab`
       brings the active tab into view. */
    .tabstrip {
      display: flex; align-items: stretch; flex: 0 0 auto;
      min-height: 32px; padding: 0 4px;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      border-bottom: 1px solid var(--openidea-border);
      background: var(--openidea-bg);
    }
    .tab {
      flex: 0 1 auto; min-width: 60px; height: 32px; padding: 0 10px; margin-right: 2px;
      overflow: hidden; text-overflow: ellipsis;
      background: transparent; border: none; border-bottom: 2px solid transparent;
      font-size: 12px; color: var(--openidea-fg-muted); cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .tab.active {
      background: transparent;
      border-bottom-color: var(--openidea-accent);
      color: var(--openidea-fg-strong);
    }

    /* One panel per tab; only the selected one is visible */
    .panel {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; min-width: 0;
    }

    /* Tab body of the history tab; the two input tabs (L33) use the split
       layout further down. */
    .tabbody {
      flex: 1 1 auto; overflow: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px; min-height: 0;
    }
    .code {
      margin: 0; padding: 6px; border-radius: 3px;
      background: var(--openidea-bg-input); border: 1px solid var(--openidea-border);
      color: var(--openidea-fg); font-family: var(--openidea-font-mono, monospace);
      white-space: pre-wrap; word-break: break-word; font-size: 12px;
    }
    .tabactions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tabactions .spacer { margin-left: auto; }
    .tabempty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      color: var(--openidea-fg-muted); padding: 16px 8px; text-align: center;
    }
    .btn[disabled] { opacity: 0.5; cursor: default; }
    /* SQL history: the reference's two-level panel (file list, then the file's
       statements) with the toolbar above and the docked quick preview below. */
    #panelHistory { position: relative; }
    .histbody { overflow: hidden; }
    .histtoolbar { flex: 0 0 auto; flex-wrap: nowrap; gap: 2px; }
    .histtoolbar .kw { flex: 1 1 auto; min-width: 60px; }
    .histfiles, .histentries {
      flex: 1 1 auto; overflow: auto; min-height: 0;
      border-top: 1px solid var(--openidea-border);
    }
    .histfile {
      display: flex; align-items: baseline; gap: 8px;
      padding: 5px 8px; cursor: pointer;
      border-bottom: 1px solid var(--openidea-border);
    }
    .histfile:hover { background: var(--openidea-bg-hover); }
    .histfile.selected { background: var(--openidea-bg-selected); }
    .histfile .hname {
      flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .histfile .hmeta { flex: 0 0 auto; color: var(--openidea-fg-muted); font-size: 11px; }
    .histentry {
      padding: 5px 8px; cursor: pointer;
      border-bottom: 1px solid var(--openidea-border);
    }
    .histentry:hover { background: var(--openidea-bg-hover); }
    .histentry.selected { background: var(--openidea-bg-selected); }
    .histentry .hhead {
      display: flex; align-items: baseline; gap: 8px;
      color: var(--openidea-fg-muted); font-size: 11px;
      white-space: nowrap; overflow: hidden;
    }
    .histentry .hhead .loc {
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .histentry .hsql {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; color: var(--openidea-fg);
      white-space: pre-wrap; word-break: break-word;
    }
    .histentry .hsql mark {
      background: color-mix(in srgb, var(--openidea-warning) 35%, transparent);
      color: inherit;
    }
    .histpreview {
      flex: 0 0 32%; min-height: 0; overflow: auto;
      margin: 6px 8px 8px; background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
    }
    .histpreview pre {
      margin: 0; padding: 6px 8px;
      font-family: var(--openidea-font-mono, monospace); font-size: 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    .histmenu { position: absolute; right: 8px; top: 38px; z-index: 40; }

    /* L33: the two input tabs — a vertical editor split (input on top, result
       below), a toolbar per pane and one status line under both. Everything is
       scoped to the two panels so the log list's own rules stay untouched. */
    #panelLogToSql, #panelSqlToJava {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; min-width: 0;
    }
    #panelLogToSql .editorpane, #panelSqlToJava .editorpane {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    #panelLogToSql .editorpane.p-top, #panelSqlToJava .editorpane.p-top { flex: 0 0 50%; }
    #panelLogToSql .editorpane.p-bottom, #panelSqlToJava .editorpane.p-bottom { flex: 1 1 auto; }
    #panelLogToSql .editorbar, #panelSqlToJava .editorbar {
      display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 4px 8px 2px;
    }
    #panelLogToSql .tabhint, #panelSqlToJava .tabhint {
      padding: 0 8px 4px; color: var(--openidea-fg-muted); font-size: 11px;
    }
    #panelLogToSql .editorarea, #panelSqlToJava .editorarea {
      flex: 1 1 auto; min-height: 0; margin: 0 8px 8px; padding: 6px 8px; resize: none;
      color: var(--openidea-fg); background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-mono, monospace);
      white-space: pre; overflow: auto;
    }
    #panelLogToSql .editorsplit, #panelSqlToJava .editorsplit {
      flex: 0 0 6px; cursor: row-resize; background: var(--openidea-border); opacity: 0.6;
    }
    #panelLogToSql .editorsplit:hover, #panelLogToSql .editorsplit.dragging,
    #panelSqlToJava .editorsplit:hover, #panelSqlToJava .editorsplit.dragging {
      background: var(--openidea-accent); opacity: 1;
    }
    #panelLogToSql .statusline, #panelSqlToJava .statusline {
      flex: 0 0 auto; padding: 4px 8px; border-top: 1px solid var(--openidea-border);
      color: var(--openidea-fg-muted); font-size: 11px; white-space: pre-wrap;
    }
    #panelLogToSql .statusline.error, #panelSqlToJava .statusline.error {
      color: var(--openidea-danger);
    }
    /* Options row: the reference's GridBag layout — the form combo spans the
       row, then the entity field, then caller / result type half each. Labels
       live in placeholders (as the reference does), so no label eats width. */
    #panelSqlToJava .optionsrow {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px;
      padding: 0 8px 6px;
    }
    #panelSqlToJava .optionsrow .optlabel { display: none; }
    #panelSqlToJava .optselect, #panelSqlToJava .optinput {
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 3px 5px; font-size: 12px; min-width: 0;
    }
    #panelSqlToJava .optwide,
    #panelSqlToJava .optfull { grid-column: 1 / -1; width: 100%; }
    #panelSqlToJava .opthalf { width: 100%; }

    [hidden] { display: none !important; }
  </style>
</head>
