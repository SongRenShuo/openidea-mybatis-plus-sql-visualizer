<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Logs</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font: var(--openidea-font-size, 13px)/1.4 var(--openidea-font-ui, sans-serif);
      color: var(--openidea-fg);
      background: var(--openidea-bg);
    }

    /* Action row (the host draws no toolbar for a packaged page). Icon buttons
       the way an IDE toolbar draws them: a 24×24 hit area around a 16×16
       inline SVG, hover showing a 3px-radius plate. The SVG paths are the
       Apache-2.0 icons under icons/toolbar/, recoloured with currentColor so
       the host theme decides the ink. */
    .actionbar {
      display: flex; align-items: center; gap: 2px; flex: 0 0 auto;
      padding: 3px 6px; border-bottom: 1px solid var(--openidea-border);
    }
    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; flex: 0 0 auto;
      background: transparent; border: 1px solid transparent; border-radius: 3px;
      color: var(--openidea-fg-muted); cursor: pointer;
    }
    .iconbtn:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .iconbtn:focus-visible { border-color: var(--openidea-accent); outline: none; }
    .iconbtn.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); }
    .iconbtn.run { color: var(--openidea-success); }
    .iconbtn svg { width: 16px; height: 16px; display: block; }

    /* Filter row */
    .filterbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
      flex: 0 0 auto;
    }
    .filterleft {
      display: flex; align-items: center; gap: 6px;
      position: relative; flex: 1 1 auto; min-width: 0;
    }
    /* Type selector: an IDE "chip" — small icon, current value, caret. */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px;
      background: transparent; color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 11px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .chip:hover { background: var(--openidea-bg-hover); }
    .chip[aria-expanded="true"] { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .chip svg { width: 12px; height: 12px; display: block; color: var(--openidea-fg-muted); }
    /* Focus / muted chips in the filter row (lane L28). A focus chip is the
       active filter and carries an × that clears it; the muted counter does the
       same for the session's muted methods. Both stay in the left flow. */
    .chips { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
    .fchip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; max-width: 260px; padding: 0 4px 0 8px;
      background: var(--openidea-bg-selected); color: var(--openidea-fg-strong);
      border: 1px solid var(--openidea-accent); border-radius: 11px;
      font-size: 12px; white-space: nowrap;
    }
    .fchip .ftext { overflow: hidden; text-overflow: ellipsis; }
    .fchip .fclose {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; padding: 0; flex: 0 0 auto;
      background: none; border: none; border-radius: 8px;
      color: var(--openidea-fg-muted); cursor: pointer; font-size: 12px; line-height: 1;
    }
    .fchip .fclose:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 2px 8px; cursor: pointer;
    }
    .btn:hover { background: var(--openidea-bg-hover); }
    .btn.on { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .caret { color: var(--openidea-fg-muted); font-size: 9px; line-height: 1; }
    .chk {
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; user-select: none; white-space: nowrap; font-size: 12px;
    }

    /* Type popup */
    .menu {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 30;
      min-width: 210px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .menu-item {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .menu-item:hover { background: var(--openidea-bg-hover); }
    .menu-sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    .menu-footer { display: flex; justify-content: space-between; padding: 2px 4px; }
    .linkbtn {
      background: none; border: none; color: var(--openidea-link);
      cursor: pointer; padding: 2px 4px; font-size: 12px;
    }
    .linkbtn:hover { text-decoration: underline; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; flex: 0 0 auto; }

    /* Search row */
    .searchrow {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
    }
    .kw {
      flex: 1 1 auto; min-width: 80px;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px; padding: 2px 6px;
    }
    .tog {
      background: var(--openidea-bg-input); color: var(--openidea-fg-muted);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 2px 6px; cursor: pointer; font-family: var(--openidea-font-mono, monospace);
    }
    .tog.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); border-color: var(--openidea-accent); }
    .muted { color: var(--openidea-fg-muted); }
    .danger { color: var(--openidea-danger); }
    /* Badge chips the way the IDE draws tags: a 8px-radius capsule at 10px
       whose fill is the semantic colour mixed 16% into the row background.
       color-mix keeps the host variable as the single colour source; the
       plain declaration above it is the fallback for engines without it. */
    .badge {
      display: inline-flex; align-items: center; height: 15px; padding: 0 6px;
      border-radius: 8px; font-size: 10px; line-height: 1;
      color: var(--openidea-fg); white-space: nowrap;
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-fg-muted) 16%, transparent);
    }
    .badge.group {
      color: var(--openidea-warning);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-warning) 16%, transparent);
    }
    .badge.n1 {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }
    /* Right-aligned counter capsule in the filter row. */
    .pill {
      display: inline-flex; align-items: center; height: 16px; padding: 0 8px;
      border-radius: 8px; font-size: 10px; line-height: 1; white-space: nowrap;
    }
    .pill.danger {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }
    #slowBadge { margin-left: auto; }

    /* List — one JBList-style row per statement: a 3px type bar, a muted
       metadata line and the statement itself, separated by 1px rules. */
    .list { flex: 1 1 auto; overflow: auto; }
    .row {
      display: flex; align-items: stretch; min-height: 40px;
      border-bottom: 1px solid var(--openidea-border); cursor: default;
    }
    .row:hover { background: var(--openidea-bg-hover); }
    .row.sel { background: var(--openidea-bg-selected); }
    .row .bar { width: 3px; flex: 0 0 3px; }
    .row .content { flex: 1 1 auto; min-width: 0; padding: 5px 8px; }
    /* The metadata line is a plain left-to-right flow, the way the reference
       panel draws it: #seq, time, duration, [db], (rows), ⨉N, ×N, N+1,
       [file:line], [Class#method]. Nothing is pushed to the right — the only
       right-aligned element of the panel is the "slow" capsule in the filter
       row (`#slowBadge { margin-left: auto }`). */
    .meta {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 8px; font-size: 11px; color: var(--openidea-fg-muted);
    }
    .meta .seq { color: var(--openidea-fg-strong); font-weight: 600; font-family: var(--openidea-font-mono, monospace); }
    .meta .time, .meta .dur { font-family: var(--openidea-font-mono, monospace); }
    .meta .dur.hot { color: var(--openidea-warning); font-weight: 600; }
    .meta .part { white-space: nowrap; }
    /* Provenance parts that filter on click (lane L28): the class#method and the
       request id behave like links without losing the row's own click. */
    .meta .focusable { cursor: pointer; }
    .meta .focusable:hover { color: var(--openidea-link); text-decoration: underline; }
    .meta .focusable.on { color: var(--openidea-link); font-weight: 600; }
    .sql {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; line-height: 1.4;
      white-space: pre-wrap; word-break: break-word; color: var(--openidea-fg);
    }
    .err {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--openidea-danger);
    }
    .empty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      color: var(--openidea-fg-muted); padding: 16px;
    }

    /* Bottom status: one muted 11px line, segments separated by a middot. */
    .status {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0;
      padding: 3px 8px; border-top: 1px solid var(--openidea-border);
      font-size: 11px; color: var(--openidea-fg-muted);
      background: var(--openidea-bg-elevated);
    }
    .status #statusMid::before, .status #statusRight::before {
      content: '\00b7'; margin: 0 8px; opacity: 0.7;
    }

    /* Context menu */
    .ctxmenu {
      position: fixed; z-index: 50; min-width: 160px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .ctxmenu button {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--openidea-fg); padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    .ctxmenu button:hover { background: var(--openidea-bg-hover); }
    /* A row that does not state the dimension gets a disabled item, never a
       guessed target (lane L28). */
    .ctxmenu button[disabled] { color: var(--openidea-fg-muted); opacity: 0.55; cursor: default; }
    .ctxmenu button[disabled]:hover { background: none; }
    .ctxmenu .sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    /* Tab strip (L24): one row of JBTabs-style cards over a 1px rule. The
       active tab is a raised page — 1px border on top/left/right, 4px top
       radius, its bottom edge merging into the strip's rule. No underline.
       Tabs shrink until the labels stop being readable and only then
       overflow: a ~320px panel still shows all five, a narrower one scrolls
       and `selectTab` brings the active tab into view. */
    .tabstrip {
      display: flex; align-items: flex-end; flex: 0 0 auto;
      min-height: 30px; padding: 4px 4px 0;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      border-bottom: 1px solid var(--openidea-border);
      background: var(--openidea-bg);
    }
    .tab {
      flex: 0 1 auto; min-width: 60px; height: 26px; padding: 0 6px; margin-right: 2px;
      overflow: hidden; text-overflow: ellipsis;
      background: transparent; border: 1px solid transparent; border-bottom: none;
      border-radius: 4px 4px 0 0;
      font-size: 12px; color: var(--openidea-fg-muted); cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .tab.active {
      margin-bottom: -1px; height: 27px;
      background: var(--openidea-bg-elevated);
      border-color: var(--openidea-border);
      border-bottom-color: var(--openidea-bg-elevated);
      color: var(--openidea-fg-strong);
    }

    /* One panel per tab; only the selected one is visible */
    .panel {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; min-width: 0;
    }

    /* Shared body of the three auxiliary tabs */
    .tabbody {
      flex: 1 1 auto; overflow: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px; min-height: 0;
    }
    .caption { font-size: 11px; color: var(--openidea-fg-muted); margin-top: 2px; }
    .code {
      margin: 0; padding: 6px; border-radius: 3px;
      background: var(--openidea-bg-input); border: 1px solid var(--openidea-border);
      color: var(--openidea-fg); font-family: var(--openidea-font-mono, monospace);
      white-space: pre-wrap; word-break: break-word; font-size: 12px;
    }
    .codeinput {
      flex: 0 0 auto; min-height: 104px; resize: vertical;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 4px 6px; font-family: var(--openidea-font-mono, monospace); font-size: 12px;
    }
    .tabactions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tabactions .spacer { margin-left: auto; }
    .tabempty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      color: var(--openidea-fg-muted); padding: 16px 8px; text-align: center;
    }
    .btn[disabled] { opacity: 0.5; cursor: default; }
    .badge.warn { background: var(--openidea-bg-selected); color: var(--openidea-danger); }
    .entity { flex: 0 1 180px; }
    .histlist { flex: 1 1 auto; overflow: auto; min-height: 0; }
    .histrow {
      border-bottom: 1px solid var(--openidea-border); padding: 4px 8px;
      cursor: pointer;
    }
    .histrow:hover { background: var(--openidea-bg-hover); }
    .histrow .sql { margin-top: 2px; }

    /* Fifth tab: the preview workbench (L23). Everything is scoped to
       #panelPreview so the log list's own .meta / .badge / .status rules keep
       working untouched. */
    #panelPreview .pv-pane {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    #panelPreview .pv-pane.pv-top { flex: 0 0 40%; }
    #panelPreview .pv-pane.pv-preview { flex: 1 1 auto; }
    #panelPreview .pv-toolbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 8px;
    }
    #panelPreview .hint { padding: 0 8px 4px; color: var(--openidea-fg-muted); }
    #panelPreview #pvInput {
      flex: 1 1 auto; min-height: 0; margin: 0 8px 8px; padding: 6px 8px; resize: none;
      color: var(--openidea-fg); background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-mono, monospace);
    }
    #panelPreview .pv-splitter {
      flex: 0 0 6px; cursor: row-resize; background: var(--openidea-border); opacity: 0.6;
    }
    #panelPreview .pv-splitter:hover, #panelPreview .pv-splitter.dragging {
      background: var(--openidea-accent); opacity: 1;
    }
    #panelPreview .pv-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 8px;
    }
    #panelPreview .pv-chip {
      padding: 0 6px; border: 1px solid var(--openidea-border);
      border-radius: 3px; white-space: nowrap;
    }
    #panelPreview .pv-badge {
      padding: 0 6px; border-radius: 3px;
      background: var(--openidea-bg-selected); font-size: 11px;
    }
    #panelPreview .pv-badge.partial { color: var(--openidea-warning); }
    #panelPreview .pv-badge.unresolved { color: var(--openidea-danger); }
    #panelPreview .pv-advice { font-size: 11px; }
    #panelPreview .pv-cols {
      display: flex; flex: 1 1 auto; min-height: 0;
      border-top: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-params {
      flex: 0 0 30%; display: flex; flex-direction: column;
      min-width: 0; min-height: 0; border-right: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-pane-title { padding: 4px 8px 2px; font-weight: 600; }
    #panelPreview .pv-scroll { flex: 1 1 auto; overflow: auto; padding: 4px 8px 8px; }
    #panelPreview .pv-sqlside {
      flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }
    #panelPreview .pv-tabs {
      display: flex; gap: 2px; padding: 4px 8px 0;
      border-bottom: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-tab {
      padding: 3px 12px; background: transparent; border: 1px solid transparent;
      border-bottom: none; border-radius: 3px 3px 0 0; cursor: pointer;
      color: var(--openidea-fg-muted); font-size: 12px;
    }
    #panelPreview .pv-tab:hover { color: var(--openidea-fg); }
    #panelPreview .pv-tab[aria-selected="true"] {
      background: var(--openidea-bg-elevated); border-color: var(--openidea-border);
      color: var(--openidea-fg-strong);
    }
    #panelPreview .pv-tabbody {
      flex: 1 1 auto; min-height: 0; margin: 0; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      border: none; border-radius: 0; background: transparent;
    }
    #panelPreview .pv-footer {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-top: 1px solid var(--openidea-border);
    }
    #panelPreview #pvStatus {
      flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="tabstrip" id="tabStrip" role="tablist">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="logs" id="tab-logs"></button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="logToSql" id="tab-logToSql"></button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="sqlToJava" id="tab-sqlToJava"></button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="history" id="tab-history"></button>
    <!-- Fifth tab: the preview workbench, as the IntelliJ edition's "SQL 预览"
         tab (there a Registry key decides whether it exists; here it is
         permanent, see docs/registration/L23.md). -->
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="preview" id="tab-preview"></button>
  </div>

  <div class="panel" id="panelLogs">
  <div class="actionbar">
    <button id="pauseBtn" class="iconbtn" type="button">
      <svg id="pauseIcon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <rect x="3.5" y="2.5" width="3" height="11" rx="0.5" fill="none" stroke="currentColor"/>
        <rect x="9.5" y="2.5" width="3" height="11" rx="0.5" fill="none" stroke="currentColor"/>
      </svg>
      <svg id="resumeIcon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
        <path fill="currentColor" d="M14.3563 7.2593C14.8171 7.6581 14.8171 8.37279 14.3563 8.77158L9.15752 13.2709C8.50981 13.8315 7.50312 13.3714 7.50312 12.5148L7.50312 3.51611C7.50312 2.65951 8.50982 2.1994 9.15753 2.75997L14.3563 7.2593Z"/>
      </svg>
    </button>
    <button id="clearBtn" class="iconbtn" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M7 2H9C9.55228 2 10 2.44772 10 3H6C6 2.44772 6.44772 2 7 2ZM5 3C5 1.89543 5.89543 1 7 1H9C10.1046 1 11 1.89543 11 3H13C13.5523 3 14 3.44772 14 4V5V6H13V13C13 14.1046 12.1046 15 11 15H5C3.89543 15 3 14.1046 3 13V6H2V5V4C2 3.44772 2.44772 3 3 3H5ZM11 4H10H6H5H3V5H4H12H13V4H11ZM4 6H12V13C12 13.5523 11.5523 14 11 14H5C4.44772 14 4 13.5523 4 13V6ZM6.5 7C6.22386 7 6 7.22386 6 7.5V11.5C6 11.7761 6.22386 12 6.5 12C6.77614 12 7 11.7761 7 11.5V7.5C7 7.22386 6.77614 7 6.5 7ZM9 7.5C9 7.22386 9.22386 7 9.5 7C9.77614 7 10 7.22386 10 7.5V11.5C10 11.7761 9.77614 12 9.5 12C9.22386 12 9 11.7761 9 11.5V7.5Z"/>
      </svg>
    </button>
    <button id="copyAllBtn" class="iconbtn" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <rect x="2.5" y="3.5" width="9" height="10" rx="1.5" fill="none" stroke="currentColor"/>
        <rect x="5" y="6" width="4" height="1" rx="0.5" fill="currentColor"/>
        <rect x="5" y="8" width="4" height="1" rx="0.5" fill="currentColor"/>
        <rect x="5" y="10" width="4" height="1" rx="0.5" fill="currentColor"/>
        <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M11.0017 2H11.5998C12.373 2 12.9998 2.6268 12.9998 3.4V3.91081C13.0011 3.94038 13.0017 3.97011 13.0017 4V11.5482C13.6063 11.1124 13.9998 10.4021 13.9998 9.6V3.4C13.9998 2.07452 12.9253 1 11.5998 1H6.39978C5.59677 1 4.88587 1.39437 4.4502 2H6.39978H11.0017Z"/>
      </svg>
    </button>
  </div>

  <div class="filterbar">
    <div class="filterleft">
      <button id="typeBtn" class="chip" type="button" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M13.5 2.5H2.5L6.5 7.5V14L9.5 12V7.5L13.5 2.5Z" fill="none" stroke="currentColor" stroke-linejoin="round"/>
        </svg>
        <span id="typeBtnText"></span><span class="caret">&#9662;</span>
      </button>
      <div id="typeMenu" class="menu" hidden>
        <div id="typeList"></div>
        <div class="menu-sep"></div>
        <label class="menu-item"><input type="checkbox" id="slowOnly"><span id="slowOnlyLabel"></span></label>

    <button type="button" data-act="jump-java"></button>

    <button type="button" data-act="focus-method"></button>

    <button type="button" data-act="block-method"></button>
    <button type="button" data-act="delete-line"></button>
    <div class="sep"></div>

    <button type="button" data-act="copy-time"></button>

  <script>
    (function () {
      var TYPE_TOKENS = ['select', 'insert', 'update', 'delete', 'create', 'drop'];
      var TYPE_COLORS = {
        select: 'var(--openidea-link)',
        insert: 'var(--openidea-success)',
        update: 'var(--openidea-warning)',
        delete: 'var(--openidea-danger)',
        create: 'var(--openidea-info)',
        drop: 'var(--openidea-accent)',
        error: 'var(--openidea-danger)',
        other: 'var(--openidea-fg-muted)'
      };

      var L = {};
      var current = null;
      var selectedLine = null;
      var ctxLine = null;
      var ctxRow = null;
      var typeMenuBuilt = false;
      // Tab strip (L22). Selection is DOM-only: no state request on switch.
      // The fifth tab (L23) is the preview workbench; it is permanent, so the
      // strip never removes an entry.
      var TAB_IDS = ['logs', 'logToSql', 'sqlToJava', 'history', 'preview'];
      var PANELS = {
        logs: 'panelLogs', logToSql: 'panelLogToSql',
        sqlToJava: 'panelSqlToJava', history: 'panelHistory',
        preview: 'panelPreview'
      };
      var activeTab = 'logs';
      // Line the "Log → SQL" tab shows (null = nothing to restore yet).
      var logToSqlLine = null;
      // Signature of the rendered log rows: a state push that does not change
      // them must not rebuild the list (scroll and selection survive).
      var rowsSig = null;
      var ui = {
        types: { select: true, insert: true, update: true, delete: true, create: true, drop: true },
        slowOnly: false, dedupe: true, matchCase: false, regex: false, keyword: '',
        // The active focus chip ({kind, value}) or null. It rides the same
        // `filter` op as the other filters (lane L28).
        focus: null
      };
      var kwTimer = null;

      function $(id) { return document.getElementById(id); }
      function post(message) {
        if (window.openidea && window.openidea.postMessage) {
          window.openidea.postMessage(JSON.stringify(message));
        }
      }
      function setText(node, text) { if (node) { node.textContent = text == null ? '' : text; } }
      function selectedTokens() {
        var out = [];
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          if (ui.types[TYPE_TOKENS[i]]) { out.push(TYPE_TOKENS[i]); }
        }
        return out;
      }
      function typeLabel(token) {
        switch (token) {
          case 'select': return L.typeSelect;
          case 'insert': return L.typeInsert;
          case 'update': return L.typeUpdate;
          case 'delete': return L.typeDelete;
          case 'create': return L.typeCreate;
          case 'drop': return L.typeDrop;
          default: return token;
        }
      }

      function postFilter() {
        var toks = selectedTokens();
        var mode = toks.length === TYPE_TOKENS.length ? 'all' : (toks.length === 0 ? 'none' : 'only');
        post({
          op: 'filter', types: toks, types_mode: mode,
          slow_only: ui.slowOnly, keyword: ui.keyword,
          match_case: ui.matchCase, regex: ui.regex, dedupe: ui.dedupe,
          focus: ui.focus
        });
      }
      // One chip at a time: setting a different value replaces it, the same value
      // clears it (the reference panel's tab toggles the same way).
      function setFocus(kind, value) {
        if (!value) { return; }
        if (ui.focus && ui.focus.kind === kind && ui.focus.value === value) {
          ui.focus = null;
        } else {
          ui.focus = { kind: kind, value: value };
        }
        postFilter();
      }
      function clearFocus() {
        if (!ui.focus) { return; }
        ui.focus = null;
        postFilter();
      }
      function scheduleFilter() {
        if (kwTimer) { clearTimeout(kwTimer); }
        kwTimer = setTimeout(function () { kwTimer = null; postFilter(); }, 200);
      }

      function syncFromState(state) {
        var f = state.filter || {};
        if (f.types_mode === 'all') {
          for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = true; }
        } else if (f.types_mode === 'none') {
          for (var j = 0; j < TYPE_TOKENS.length; j++) { ui.types[TYPE_TOKENS[j]] = false; }
        } else if (f.types) {
          var set = {};
          for (var k = 0; k < f.types.length; k++) { set[f.types[k]] = true; }
          for (var m = 0; m < TYPE_TOKENS.length; m++) { ui.types[TYPE_TOKENS[m]] = !!set[TYPE_TOKENS[m]]; }
        }
        ui.slowOnly = !!f.slow_only;
        ui.dedupe = f.dedupe !== false;
        ui.matchCase = !!f.match_case;
        ui.regex = !!f.regex;
        ui.focus = (f.focus && f.focus.kind && f.focus.value)
          ? { kind: f.focus.kind, value: f.focus.value }
          : null;
        if (document.activeElement !== $('kw')) {
          ui.keyword = f.keyword || '';
          $('kw').value = ui.keyword;
        }
        $('slowOnly').checked = ui.slowOnly;
        $('dedupe').checked = ui.dedupe;
        $('caseBtn').classList.toggle('on', ui.matchCase);
        $('regexBtn').classList.toggle('on', ui.regex);
      }

      // Icon buttons carry no text: the label lives in title + aria-label so
      // screen readers and tooltips still get it.
      function labelIconButton(node, label) {
        if (!node) { return; }
        node.setAttribute('aria-label', label || '');
        node.title = label || '';
      }

      // Focus / muted chips (lane L28) --------------------------------
      function chipButton(label, title, onClose) {
        var chip = document.createElement('span');
        chip.className = 'fchip';
        var text = document.createElement('span');
        text.className = 'ftext';
        text.textContent = label;
        chip.appendChild(text);
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'fclose';
        close.textContent = '×';
        close.title = title || '';
        close.setAttribute('aria-label', title || '');
        close.addEventListener('click', function (event) {
          event.stopPropagation();
          onClose();
        });
        chip.appendChild(close);
        return chip;
      }

      // The filter row shows what is narrowing the list: one focus chip (with
      // an × that clears it) and the muted-method counter (same ×, clears all).
      function renderFocusChips(state) {
        var host = $('focusChips');
        while (host.firstChild) { host.removeChild(host.firstChild); }
        var focus = (state.filter || {}).focus;
        if (focus && focus.value) {
          var prefix = focus.kind === 'request'
            ? (L.focusRequestPrefix || 'Request')
            : (L.focusMethodPrefix || 'Method');
          var label = prefix + ' · ' + focus.value;
          var chip = chipButton(label, L.focusClear || 'Clear focus', clearFocus);
          chip.title = label;
          host.appendChild(chip);
        }
        var blocked = (state.counts || {}).blocked || 0;
        if (blocked > 0) {
          var muted = (L.blockedPrefix || 'Muted') + ' ' + blocked;
          var mutedChip = chipButton(muted, L.blockedClear || '', function () {
            post({ op: 'clear-blocked' });
          });
          mutedChip.title = muted;
          host.appendChild(mutedChip);
        }
      }

      function updateLabels() {
        var paused = !!(current && current.status && current.status.paused);
        var pauseText = paused ? (L.resume || 'Resume') : (L.pause || 'Pause');
        var pauseBtn = $('pauseBtn');
        labelIconButton(pauseBtn, pauseText);
        pauseBtn.classList.toggle('on', paused);
        pauseBtn.classList.toggle('run', paused);
        // Pause while live, resume (green play) while paused: both icons sit in
        // the button, the state decides which one is drawn.
        $('pauseIcon').hidden = paused;
        $('resumeIcon').hidden = !paused;
        labelIconButton($('clearBtn'), L.clear || 'Clear');
        labelIconButton($('copyAllBtn'), L.copyAll || 'Copy SQL');
        labelIconButton($('searchBtn'), L.search || 'Search');
        setText($('dedupeLabel'), L.dedupe);
        setText($('slowOnlyLabel'), L.slowOnly);
        setText($('selectAll'), L.selectAll);
        setText($('selectNone'), L.selectNone);
        setText($('caseBtn'), L.matchCase);
        setText($('regexBtn'), L.regex);
        $('caseBtn').title = L.matchCaseTitle || '';
        $('regexBtn').title = L.regexTitle || '';
        $('kw').placeholder = L.keywordPlaceholder || '';
        setText($('ctxMenu').querySelector('[data-act="copy-sql"]'), L.menuCopySql);
        setText($('ctxMenu').querySelector('[data-act="copy-time"]'), L.menuCopyTime);
        setText($('ctxMenu').querySelector('[data-act="export"]'), L.menuExport);
        setText($('ctxMenu').querySelector('[data-act="jump-java"]'), L.menuJumpJava);
        setText($('ctxMenu').querySelector('[data-act="jump-xml"]'), L.menuJumpXml);
        setText($('ctxMenu').querySelector('[data-act="focus-method"]'), L.menuFocusMethod);
        setText($('ctxMenu').querySelector('[data-act="focus-request"]'), L.menuFocusRequest);
        setText($('ctxMenu').querySelector('[data-act="delete-line"]'), L.menuDelete);
        setText($('ctxMenu').querySelector('[data-act="block-method"]'), L.menuBlockMethod);
        setText($('empty'), L.empty);
        updateTabLabels();
        updateTypeButton();
      }

      function updateTabLabels() {
        var titles = {
          logs: L.tabLogs || 'SQL Logs',
          logToSql: L.tabLogToSql || 'Log -> SQL',
          sqlToJava: L.tabSqlToJava || 'SQL -> Java',
          history: L.tabHistory || 'SQL History',
          preview: L.tabPreview || 'SQL Preview'
        };
        for (var i = 0; i < TAB_IDS.length; i++) {
          var btn = tabButton(TAB_IDS[i]);
          if (!btn) { continue; }
          setText(btn, titles[TAB_IDS[i]]);
          // A narrow strip ellipsises the label; the tooltip keeps the full
          // name one hover away (the IDE does the same for squeezed tabs).
          btn.title = titles[TAB_IDS[i]];
        }
        setText($('l2sRawCaption'), L.tabLogToSqlRaw);
        setText($('l2sParamsCaption'), L.tabLogToSqlParams);
        setText($('l2sRestoredCaption'), L.tabLogToSqlRestored);
        setText($('l2sCopyBtn'), L.tabLogToSqlCopy);
        setText($('l2sSendBtn'), L.tabLogToSqlSend);
        setText($('s2jInputCaption'), L.tabSqlToJavaInput);
        $('s2jInput').placeholder = L.tabSqlToJavaInput || '';
        $('s2jEntity').placeholder = L.tabSqlToJavaEntity || '';
        $('s2jEntity').title = L.tabSqlToJavaEntity || '';
        setText($('s2jRunBtn'), L.tabSqlToJavaRun);
        setText($('s2jCopyBtn'), L.tabSqlToJavaCopy);
        setText($('s2jOutputCaption'), L.tabSqlToJavaOutput);
        $('histKw').placeholder = L.tabHistoryKeyword || '';
        setText($('histSearchBtn'), L.tabHistorySearch);
      }

      function updateTypeButton() {
        var toks = selectedTokens();
        var text;
        if (toks.length === TYPE_TOKENS.length) { text = L.typesAll; }
        else if (toks.length === 0) { text = L.typesNone; }
        else { text = toks.length + ' ' + L.typesCountSuffix; }
        setText($('typeBtnText'), text);
        $('typeBtn').title = L.typesTitle || '';
      }

      function buildTypeMenu() {
        if (typeMenuBuilt) { return; }
        var host = $('typeList');
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          var token = TYPE_TOKENS[i];
          var label = document.createElement('label');
          label.className = 'menu-item';
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.setAttribute('data-token', token);
          box.checked = !!ui.types[token];
          box.addEventListener('change', function () {
            var t = this.getAttribute('data-token');
            ui.types[t] = this.checked;
            updateTypeButton();
            postFilter();
          });
          var sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = TYPE_COLORS[token] || 'var(--openidea-fg-muted)';
          var text = document.createElement('span');
          text.setAttribute('data-lbl', token);
          text.textContent = typeLabel(token);
          label.appendChild(box);
          label.appendChild(sw);
          label.appendChild(text);
          host.appendChild(label);
        }
        typeMenuBuilt = true;
      }

      function syncTypeCheckboxes() {
        var boxes = $('typeList').querySelectorAll('input[data-token]');
        for (var i = 0; i < boxes.length; i++) {
          var t = boxes[i].getAttribute('data-token');
          boxes[i].checked = !!ui.types[t];
        }
        var labels = $('typeList').querySelectorAll('[data-lbl]');
        for (var j = 0; j < labels.length; j++) {
          var tok = labels[j].getAttribute('data-lbl');
          labels[j].textContent = typeLabel(tok);
        }
      }

      function makePart(className, text) {
        var el = document.createElement('span');
        el.className = className;
        el.textContent = text;
        return el;
      }

      // Last path segment, for a `[UserMapper.java:42]` part.
      function baseName(path) {
        if (!path) { return ''; }
        var parts = String(path).split(/[\\/]/);
        return parts[parts.length - 1] || path;
      }

      function buildRow(row, slowThreshold) {
        var el = document.createElement('div');
        el.className = 'row';
        el.setAttribute('data-line', String(row.line));

        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.background = TYPE_COLORS[row.sql_type] || TYPE_COLORS.other;

        var content = document.createElement('div');
        content.className = 'content';

        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.appendChild(makePart('seq', '#' + row.seq));
        meta.appendChild(makePart('part time', row.time || ''));
        var dur = document.createElement('span');
        dur.className = 'dur';
        dur.textContent = row.duration_ms == null ? '-' : formatMs(row.duration_ms);
        if (row.duration_ms != null && slowThreshold != null && row.duration_ms >= slowThreshold) {
          dur.classList.add('hot');
        }
        meta.appendChild(dur);
        if (row.db) { meta.appendChild(makePart('part db', '[' + row.db + ']')); }
        if (row.rows_affected != null) { meta.appendChild(makePart('part rows', '(' + row.rows_affected + ')')); }
        if (row.dedupe_count > 1) {
          var db = makePart('badge dedupe', (L.dedupeBadgePrefix || '') + row.dedupe_count);
          meta.appendChild(db);
        }
        if (row.group_count > 1) {
          var gb = makePart('badge group', (L.groupBadgePrefix || '') + row.group_count);
          meta.appendChild(gb);
        }
        if (row.n_plus_one) {
          var n1 = makePart('badge n1', L.nPlusOne || 'N+1');
          meta.appendChild(n1);
        }
        // Provenance (lane L28), last in the left flow: [file:line] then
        // [Class#method], the reference panel's order. A row that stated no
        // source simply has neither part — no placeholder.
        if (row.jump_file && row.jump_line) {
          meta.appendChild(makePart('part src', '[' + baseName(row.jump_file) + ':' + row.jump_line + ']'));
        }
        if (row.class_simple && row.method) {
          var methodPart = makePart('part method focusable', '[' + row.class_simple + '#' + row.method + ']');
          if (ui.focus && ui.focus.kind === 'method' && ui.focus.value === row.focus_key) {
            methodPart.classList.add('on');
          }
          methodPart.title = row.focus_key || '';
          methodPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('method', row.focus_key);
          });
          meta.appendChild(methodPart);
        }
        if (row.request_id) {
          var reqPart = makePart('part req focusable', '[' + row.request_id + ']');
          if (ui.focus && ui.focus.kind === 'request' && ui.focus.value === row.request_id) {
            reqPart.classList.add('on');
          }
          reqPart.title = row.request_id;
          reqPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('request', row.request_id);
          });
          meta.appendChild(reqPart);
        }
        content.appendChild(meta);

        if (row.sql) {
          var sql = document.createElement('div');
          sql.className = 'sql';
          sql.textContent = row.sql;
          content.appendChild(sql);
        }
        if (row.error_text) {
          var err = document.createElement('div');
          err.className = 'err';
          err.textContent = row.error_text;
          content.appendChild(err);
        }

        content.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('dblclick', function () {
          selectLine(row.line);
          if (row.sql) { post({ op: 'open-line', line: row.line }); }
        });
        el.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          selectLine(row.line);
          openCtx(event.clientX, event.clientY, row);
        });

        el.appendChild(bar);
        el.appendChild(content);
        return el;
      }

      function formatMs(ms) {
        if (Math.abs(ms - Math.round(ms)) < 0.001) { return String(Math.round(ms)); }
        return ms.toFixed(1);
      }

      function selectLine(line) {
        var changed = selectedLine !== line;
        selectedLine = line;
        var rows = $('list').querySelectorAll('.row');
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].getAttribute('data-line') === String(line)) { rows[i].classList.add('sel'); }
          else { rows[i].classList.remove('sel'); }
        }
        // Only a real change asks the host for the "Log → SQL" payload; the
        // reply re-pushes state, but the row signature is unchanged so the list
        // (and its scroll position) is left alone.
        if (changed && line != null) { post({ op: 'log-to-sql', line: line }); }
      }

      function renderList(state) {
        var list = $('list');
        var rows = state.rows || [];
        var threshold = state.slow_threshold_ms;
        var wasAtBottom = (list.scrollHeight - list.scrollTop - list.clientHeight) < 40;

        while (list.firstChild) { list.removeChild(list.firstChild); }
        if (rows.length === 0) {
          list.hidden = true;
          $('empty').hidden = false;
          return;
        }
        list.hidden = false;
        $('empty').hidden = true;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < rows.length; i++) {
          frag.appendChild(buildRow(rows[i], threshold));
        }
        list.appendChild(frag);
        if (selectedLine != null) { selectLine(selectedLine); }
        var paused = state.status && state.status.paused;
        if (!paused && wasAtBottom) { list.scrollTop = list.scrollHeight; }
      }

      function updateCounts(state) {
        var c = state.counts || {};
        var slowBadge = $('slowBadge');
        if (c.slow > 0) {
          slowBadge.hidden = false;
          setText(slowBadge, (L.slowPrefix || '') + ' ' + c.slow);
        } else {
          slowBadge.hidden = true;
        }
        var hit = $('hitCount');
        var keyword = ui.keyword && ui.keyword.trim();
        setText(hit, keyword ? (c.total + ' ' + (L.hitsSuffix || '')) : '');
        var err = $('regexErr');
        var invalid = state.filter && state.filter.regex_error;
        err.hidden = !invalid;
        if (invalid) { setText(err, L.regexError); }
      }

      function updateStatus(state) {
        var s = state.status || {};
        var c = state.counts || {};
        setText($('statusLeft'), (L.statusConsolePrefix || '') + ' ' + (s.console_lines || 0) + ' ' + (L.statusConsoleSuffix || ''));
        var mid;
        if (c.truncated) {
          mid = (L.truncatedPrefix || '') + ' ' + c.cap;
        } else {
          mid = (L.totalPrefix || '') + ' ' + (c.total || 0) + ' ' + (L.totalSuffix || '');
        }
        setText($('statusMid'), mid.replace(/\s+/g, ' ').trim());
        if (s.agent_connected) {
          setText($('statusRight'), (L.statusAgentEventsPrefix || '') + ' ' + (s.agent_events || 0));
        } else {
          setText($('statusRight'), L.statusAgentOff || '');
        }
      }

      // Tabs ----------------------------------------------------------------
      function tabButton(tab) { return $('tab-' + tab); }
      function tabPanel(tab) { return $(PANELS[tab]); }

      function selectTab(tab, notify) {
        if (TAB_IDS.indexOf(tab) < 0) { return; }
        activeTab = tab;
        for (var i = 0; i < TAB_IDS.length; i++) {
          var id = TAB_IDS[i];
          var on = id === tab;
          var btn = tabButton(id);
          if (btn) {
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
            // A narrow panel scrolls the strip: the tab the host switched to
            // must be what the user sees, not an off-screen neighbour.
            if (on && btn.scrollIntoView) {
              btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
            }
          }
          var panel = tabPanel(id);
          if (panel) { panel.hidden = !on; }
        }
        // `tab` is a hint only: the host does not answer it, so switching
        // never re-requests state.
        if (notify) { post({ op: 'tab', tab: tab }); }
      }

      function cycleTab(delta) {
        var index = TAB_IDS.indexOf(activeTab);
        if (index < 0) { index = 0; }
        var next = (index + delta + TAB_IDS.length) % TAB_IDS.length;
        selectTab(TAB_IDS[next], true);
      }

      // A cheap identity for the pushed rows: same signature => same list, so
      // the DOM is not rebuilt and scroll/selection survive.
      function rowsSignature(rows) {
        var parts = [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          parts.push(r.line + '/' + r.seq + '/' + r.sql_type + '/' + r.category + '/' +
            r.dedupe_count + '/' + r.group_count + '/' + (r.n_plus_one ? 1 : 0) + '/' +
            (r.class_simple || '') + '#' + (r.method || '') + '/' +
            (r.jump_file || '') + ':' + (r.jump_line == null ? '' : r.jump_line) + '/' +
            (r.xml_file || '') + ':' + (r.xml_line == null ? '' : r.xml_line) + '/' +
            (r.request_id || '') + '/' + (r.thread || ''));
        }
        return parts.join('|');
      }

      function confidenceLabel(value) {
        if (value === 'exact') { return L.tabConfidenceExact || ''; }
        if (value === 'partial') { return L.tabConfidencePartial || ''; }
        if (value === 'unresolved') { return L.tabConfidenceUnresolved || ''; }
        return '';
      }

      function confidenceText(value) {
        var label = confidenceLabel(value);
        if (!label) { return ''; }
        return ((L.tabConfidencePrefix || '') + ' ' + label).replace(/\s+/g, ' ').trim();
      }

      function showConfidence(node, value) {
        var text = confidenceText(value);
        node.hidden = !text;
        setText(node, text);
        node.classList.toggle('warn', value === 'unresolved');
      }

      // "Log → SQL" ---------------------------------------------------------
      function applyLogToSql(tab) {
        tab = tab || {};
        var empty = !!tab.empty;
        logToSqlLine = (tab.line == null) ? null : tab.line;
        $('l2sRaw').hidden = empty;
        $('l2sParams').hidden = empty;
        $('l2sRestored').hidden = empty;
        $('l2sRawCaption').hidden = empty;
        $('l2sParamsCaption').hidden = empty;
        $('l2sRestoredCaption').hidden = empty;
        setText($('l2sRaw'), empty ? '' : (tab.rawSql || ''));
        var params = (!empty && tab.params) ? tab.params : [];
        setText($('l2sParams'), params.length ? params.join(', ') : '-');
        setText($('l2sRestored'), empty ? '' : (tab.restored || ''));
        $('l2sEmpty').hidden = !empty;
        setText($('l2sEmpty'), L.tabLogToSqlEmpty || '');
        $('l2sCopyBtn').disabled = empty;
        $('l2sSendBtn').disabled = empty;
        showConfidence($('l2sConfidence'), empty ? '' : (tab.confidence || ''));
      }

      // "SQL → Java" --------------------------------------------------------
      function applySqlToJava(tab) {
        tab = tab || {};
        var ran = !!tab.ran;
        var code = tab.code || '';
        var reason = tab.reason || '';
        $('s2jOutput').hidden = !code;
        $('s2jOutputCaption').hidden = !code;
        setText($('s2jOutput'), code);
        $('s2jReason').hidden = !(reason && !code);
        setText($('s2jReason'), (reason && !code) ?
          ((L.tabSqlToJavaReason || '') + ': ' + reason) : '');
        var params = tab.params || [];
        $('s2jParams').hidden = params.length === 0;
        setText($('s2jParams'), params.length ?
          ((L.tabSqlToJavaParams || '') + ': ' + params.join(', ')) : '');
        $('s2jEmpty').hidden = ran;
        setText($('s2jEmpty'), L.tabSqlToJavaEmpty || '');
        $('s2jCopyBtn').disabled = !code;
        showConfidence($('s2jConfidence'), tab.confidence || '');
      }

      // "SQL history" -------------------------------------------------------
      function buildHistoryRow(item) {
        var el = document.createElement('div');
        el.className = 'histrow';
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.appendChild(makePart('seq', '#' + item.line));
        meta.appendChild(makePart('part time', item.time || '-'));
        // This build captures no source file for a log line (see LIMITS.md).
        meta.appendChild(makePart('part src', '[' + (L.tabHistorySource || '') + ': -]'));
        el.appendChild(meta);
        var sql = document.createElement('div');
        sql.className = 'sql';
        sql.textContent = item.sql || item.text || '';
        el.appendChild(sql);
        el.title = item.text || '';
        el.addEventListener('click', function () {
          post({ op: 'history-open', line: item.line });
        });
        return el;
      }

      function applyHistory(tab) {
        tab = tab || {};
        var list = $('histList');
        while (list.firstChild) { list.removeChild(list.firstChild); }
        var matches = tab.matches || [];
        if (matches.length === 0) {
          list.hidden = true;
          $('histEmpty').hidden = false;
          setText($('histEmpty'), tab.ran ? (L.tabHistoryNoMatch || '') : (L.tabHistoryEmpty || ''));
        } else {
          list.hidden = false;
          $('histEmpty').hidden = true;
          var frag = document.createDocumentFragment();
          for (var i = 0; i < matches.length; i++) { frag.appendChild(buildHistoryRow(matches[i])); }
          list.appendChild(frag);
        }
        var count = '';
        if (tab.ran && tab.total > 0) {
          count = tab.total + ' ' + (L.tabHistoryCountSuffix || '');
        }
        if (tab.truncated) {
          count += (count ? ' · ' : '') + (L.tabHistoryTruncated || '');
        }
        setText($('histCount'), count.replace(/\s+/g, ' ').trim());
        if (document.activeElement !== $('histKw')) {
          $('histKw').value = tab.keyword || '';
        }
      }

      // "SQL 预览" (L23) ----------------------------------------------------
      // The workbench moved here from its own view. Same behaviour as before:
      // the host owns the model, the page only renders it and posts
      // `preview-*` ops.
      var PV_LABEL_KEYS = {
        pvResolve: 'resolve', pvFormat: 'format', pvLoadFile: 'loadFile',
        pvClear: 'clear', pvOpenDialog: 'openDialog', pvCopy: 'copySql',
        pvFormatPreview: 'format', pvExport: 'export', pvExecute: 'execute',
        pvCopySql: 'copySql'
      };
      var PV_TAB_KEYS = { sql: 'tabSql', raw: 'tabRaw', columns: 'tabColumns' };
      var PV_TAB_ORDER = ['sql', 'raw', 'columns'];
      var preview = { model: {}, labels: {}, dialect: {}, tab: 'sql', mode: 'normal' };
      // Signature of what the tab body shows: a state push that changes none
      // of it must not re-render (the reader keeps their scroll position).
      var pvSig = null;

      function pvNode(id) { return document.getElementById(id); }
      function pvTabs() { return preview.model.tabs || {}; }

      function pvSignature() {
        var m = preview.model || {};
        var t = pvTabs();
        var l = preview.labels || {};
        return [
          m.sql, m.reason, m.confidence, (m.params || []).join(','),
          t.formatted, t.raw, t.columns, preview.tab, preview.mode,
          l.empty, l.columnsEmpty, l.reasonTitle
        ].join('\u0001');
      }

      function pvInputText() {
        var editor = pvNode('pvInput');
        return editor ? editor.value : '';
      }

      function pvRenderTab() {
        var body = pvNode('pvTabBody');
        if (!body) { return; }
        var m = preview.model || {};
        var labels = preview.labels || {};
        var text = '';
        var placeholder = false;
        if (preview.tab === 'sql') {
          if (!m.sql && m.reason) {
            text = (labels.reasonTitle || '') + '\n' + m.reason;
          } else if (!m.sql) {
            text = labels.empty || '';
            placeholder = true;
          } else {
            var source = pvTabs();
            text = preview.mode === 'formatted'
              ? (source.formatted || source.sql || '')
              : (source.sql || '');
            if (m.reason) {
              // A partial render keeps its SQL and explains itself below it the
              // way `render-xml` prints reasons as comments.
              text += '\n\n-- ' + (labels.reasonTitle || '');
              var reasons = m.reason.split('\n');
              for (var line = 0; line < reasons.length; line++) {
                text += '\n-- ' + reasons[line];
              }
            }
          }
        } else if (preview.tab === 'raw') {
          text = pvTabs().raw || '';
          placeholder = !text;
        } else {
          text = pvTabs().columns || '';
          if (!text) {
            text = labels.columnsEmpty || '';
            placeholder = true;
          }
        }
        body.textContent = text;
        body.className = placeholder ? 'code pv-tabbody muted' : 'code pv-tabbody';
        body.scrollTop = 0;
        pvSig = pvSignature();
      }

      function pvSelectTab(key) {
        if (PV_TAB_ORDER.indexOf(key) < 0) { return; }
        preview.tab = key;
        var buttons = document.querySelectorAll('#panelPreview .pv-tab');
        for (var i = 0; i < buttons.length; i++) {
          var on = buttons[i].getAttribute('data-pvtab') === key;
          buttons[i].setAttribute('aria-selected', on ? 'true' : 'false');
        }
        pvRenderTab();
      }

      function pvSetMode(mode) {
        preview.mode = mode === 'formatted' ? 'formatted' : 'normal';
        var select = pvNode('pvMode');
        if (select && select.value !== preview.mode) { select.value = preview.mode; }
        pvRenderTab();
      }

      function pvApplyLabels() {
        var labels = preview.labels || {};
        var ids = Object.keys(PV_LABEL_KEYS);
        for (var index = 0; index < ids.length; index++) {
          setText(pvNode(ids[index]), labels[PV_LABEL_KEYS[ids[index]]]);
        }
        var openDialog = pvNode('pvOpenDialog');
        if (openDialog) { openDialog.title = labels.openDialogNote || ''; }
        var executeButton = pvNode('pvExecute');
        if (executeButton) { executeButton.title = labels.executeNote || ''; }
        setText(pvNode('pvInputHint'), labels.hintInput);
        setText(pvNode('pvParamsTitle'), labels.params);
        setText(pvNode('pvModeLabel'), labels.mode);
        var modeSelect = pvNode('pvMode');
        if (modeSelect && modeSelect.options.length >= 2) {
          modeSelect.options[0].textContent = labels.modeNormal || '';
          modeSelect.options[1].textContent = labels.modeFormatted || '';
        }
        var buttons = document.querySelectorAll('#panelPreview .pv-tab');
        for (var tabIndex = 0; tabIndex < buttons.length; tabIndex++) {
          var key = buttons[tabIndex].getAttribute('data-pvtab');
          buttons[tabIndex].textContent = labels[PV_TAB_KEYS[key]] || key;
        }
      }

      function pvApplyModel() {
        var m = preview.model || {};
        var dialect = preview.dialect || {};
        var labels = preview.labels || {};
        var name = dialect.name || m.dialect || '';
        var suffix = dialect.isDefault ? (labels.dialectDefault || '') : '';
        setText(pvNode('pvDialectChip'), (labels.dialect || '') + ': ' + name + suffix);
        var chip = pvNode('pvDialectChip');
        if (chip) { chip.title = dialect.capabilities || ''; }
        setText(pvNode('pvDialectHint'), labels.dialectHint);
        setText(pvNode('pvAdvice'), m.advice);

        var badge = pvNode('pvConfidence');
        if (badge) {
          var level = (m.confidence === 'partial' || m.confidence === 'unresolved')
            ? m.confidence : '';
          badge.className = level ? 'pv-badge ' + level : 'pv-badge';
          badge.textContent = labels.confidenceLabel || '';
          badge.hidden = !labels.confidenceLabel;
        }

        var params = m.params || [];
        setText(pvNode('pvParams'), params.length ? params.join('\n') : '—');

        var columns = pvTabs().columns || '';
        var buttons = document.querySelectorAll('#panelPreview .pv-tab');
        for (var tabIndex = 0; tabIndex < buttons.length; tabIndex++) {
          var key = buttons[tabIndex].getAttribute('data-pvtab');
          buttons[tabIndex].title = key === 'columns' && !columns
            ? (labels.columnsEmpty || '') : '';
        }
      }

      function applyPreview(tab) {
        if (!tab) { return; }
        preview.model = tab.model || {};
        preview.labels = tab.labels || {};
        preview.dialect = tab.dialect || {};
        pvApplyLabels();
        pvApplyModel();
        // Only an op that rewrote the model asks for the input box to be
        // overwritten; every other state push leaves what the user typed.
        if (tab.replaceInput) {
          var editor = pvNode('pvInput');
          if (editor) { editor.value = pvTabs().raw || ''; }
        }
        setText(pvNode('pvStatus'), tab.status ? tab.status.text : '');
        var sig = pvSignature();
        if (sig !== pvSig) { pvRenderTab(); }
      }

      function applyState(state) {
        current = state;
        L = state.labels || L;
        buildTypeMenu();
        updateLabels();
        syncFromState(state);
        syncTypeCheckboxes();
        updateTypeButton();
        renderFocusChips(state);
        var sig = rowsSignature(state.rows || []);
        if (sig !== rowsSig) {
          rowsSig = sig;
          renderList(state);
        }
        updateCounts(state);
        updateStatus(state);
        var tabs = state.tabs || {};
        applyLogToSql(tabs.logToSql);
        applySqlToJava(tabs.sqlToJava);
        applyHistory(tabs.history);
        applyPreview(tabs.preview);
        // `selectTab` is set by open-workbench / a double-clicked row and stays
        // in the state until the page reports the tab it shows (the `tab`
        // message below does exactly that).
        if (state.selectTab) { selectTab(state.selectTab, true); }
      }

      // Type popup ----------------------------------------------------------
      function openTypeMenu(open) {
        $('typeMenu').hidden = !open;
        $('typeBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      // Context menu --------------------------------------------------------
      // The menu acts on the row that opened it. An item whose dimension the
      // row does not state is disabled, so the host is never asked to guess a
      // jump target or a focus value.
      function ctxItem(act) { return $('ctxMenu').querySelector('[data-act="' + act + '"]'); }
      function enableItem(act, enabled) {
        var node = ctxItem(act);
        if (!node) { return; }
        node.disabled = !enabled;
        node.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      }
      function openCtx(x, y, row) {
        ctxRow = row;
        ctxLine = row ? row.line : null;
        enableItem('jump-java', !!(row && row.jump_file));
        enableItem('jump-xml', !!(row && row.xml_file));
        enableItem('focus-method', !!(row && row.focus_key));
        enableItem('focus-request', !!(row && row.request_id));
        enableItem('block-method', !!(row && row.focus_key));
        var menu = $('ctxMenu');
        menu.hidden = false;
        var width = menu.offsetWidth || 200;
        var height = menu.offsetHeight || 220;
        menu.style.left = Math.min(x, window.innerWidth - width - 4) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - height - 4) + 'px';
      }
      function closeCtx() { $('ctxMenu').hidden = true; ctxLine = null; ctxRow = null; }

      // Wiring --------------------------------------------------------------
      for (var tabIndex = 0; tabIndex < TAB_IDS.length; tabIndex++) {
        (function (tab) {
          var btn = tabButton(tab);
          if (btn) {
            btn.addEventListener('click', function () { selectTab(tab, true); });
          }
        })(TAB_IDS[tabIndex]);
      }
      $('l2sCopyBtn').addEventListener('click', function () {
        if (logToSqlLine != null) { post({ op: 'copy-line', line: logToSqlLine }); }
      });
      $('l2sSendBtn').addEventListener('click', function () {
        if (logToSqlLine != null) { post({ op: 'open-line', line: logToSqlLine }); }
      });
      $('s2jRunBtn').addEventListener('click', function () {
        post({ op: 'sql-to-java', text: $('s2jInput').value, entity: $('s2jEntity').value });
      });
      $('s2jCopyBtn').addEventListener('click', function () { post({ op: 'copy-code' }); });
      $('histSearchBtn').addEventListener('click', function () {
        post({ op: 'history', keyword: $('histKw').value });
      });
      $('histKw').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); $('histSearchBtn').click(); }
      });

      // "SQL 预览" (L23): splitter, actions, inner tabs, Ctrl+Enter.
      var pvPaneTop = pvNode('pvPaneTop');
      var pvSplitter = pvNode('pvSplitter');
      var pvDragging = false;

      function pvPanelRect() {
        var panel = pvNode('panelPreview');
        return panel ? panel.getBoundingClientRect() : null;
      }
      function pvSetTopFraction(fraction) {
        if (!pvPaneTop) { return; }
        var clamped = Math.min(0.8, Math.max(0.15, fraction));
        pvPaneTop.style.flexBasis = (clamped * 100) + '%';
      }
      function pvTopFraction() {
        var rect = pvPanelRect();
        if (!pvPaneTop || !rect || rect.height <= 0) { return 0.4; }
        return pvPaneTop.getBoundingClientRect().height / rect.height;
      }

      if (pvSplitter) {
        pvSplitter.addEventListener('pointerdown', function (event) {
          pvDragging = true;
          pvSplitter.classList.add('dragging');
          if (pvSplitter.setPointerCapture) {
            pvSplitter.setPointerCapture(event.pointerId);
          }
          event.preventDefault();
        });
        pvSplitter.addEventListener('pointermove', function (event) {
          if (!pvDragging) { return; }
          var rect = pvPanelRect();
          if (rect && rect.height > 0) {
            pvSetTopFraction((event.clientY - rect.top) / rect.height);
          }
        });
        var pvStopDrag = function (event) {
          if (!pvDragging) { return; }
          pvDragging = false;
          pvSplitter.classList.remove('dragging');
          if (pvSplitter.releasePointerCapture && event.pointerId !== undefined) {
            try {
              pvSplitter.releasePointerCapture(event.pointerId);
            } catch (error) {
              /* the capture was already released */
            }
          }
        };
        pvSplitter.addEventListener('pointerup', pvStopDrag);
        pvSplitter.addEventListener('pointercancel', pvStopDrag);
        pvSplitter.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') { return; }
          pvSetTopFraction(pvTopFraction() + (event.key === 'ArrowDown' ? 0.02 : -0.02));
          event.preventDefault();
        });
      }

      function pvOn(id, handler) {
        var target = pvNode(id);
        if (target) { target.addEventListener('click', handler); }
      }
      pvOn('pvResolve', function () {
        post({ op: 'preview-render', text: pvInputText(), kind: '' });
      });
      pvOn('pvFormat', function () {
        post({ op: 'preview-format', text: pvInputText() });
      });
      pvOn('pvLoadFile', function () { post({ op: 'preview-load-file' }); });
      pvOn('pvClear', function () { post({ op: 'preview-clear' }); });
      pvOn('pvCopy', function () { post({ op: 'preview-copy' }); });
      pvOn('pvCopySql', function () { post({ op: 'preview-copy' }); });
      pvOn('pvExport', function () { post({ op: 'preview-export' }); });
      pvOn('pvFormatPreview', function () { pvSetMode('formatted'); });

      var pvModeSelect = pvNode('pvMode');
      if (pvModeSelect) {
        pvModeSelect.addEventListener('change', function () {
          pvSetMode(pvModeSelect.value);
        });
      }

      var pvTabButtons = document.querySelectorAll('#panelPreview .pv-tab');
      for (var pvIndex = 0; pvIndex < pvTabButtons.length; pvIndex++) {
        (function (element) {
          element.addEventListener('click', function () {
            pvSelectTab(element.getAttribute('data-pvtab'));
          });
        })(pvTabButtons[pvIndex]);
      }

      var pvEditor = pvNode('pvInput');
      if (pvEditor) {
        pvEditor.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            event.preventDefault();
            post({ op: 'preview-render', text: pvEditor.value, kind: '' });
          }
        });
      }

      $('typeBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        openTypeMenu($('typeMenu').hidden);
      });
      $('typeMenu').addEventListener('click', function (event) { event.stopPropagation(); });
      $('slowOnly').addEventListener('change', function () { ui.slowOnly = this.checked; postFilter(); });
      $('selectAll').addEventListener('click', function () {
        for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = true; }
        syncTypeCheckboxes(); updateTypeButton(); postFilter();
      });
      $('selectNone').addEventListener('click', function () {
        for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = false; }
        syncTypeCheckboxes(); updateTypeButton(); postFilter();
      });

      $('searchBtn').addEventListener('click', function () {
        var row = $('searchRow');
        row.hidden = !row.hidden;
        $('searchBtn').classList.toggle('on', !row.hidden);
        if (!row.hidden) { $('kw').focus(); }
      });
      $('kw').addEventListener('input', function () { ui.keyword = this.value; scheduleFilter(); });
      $('kw').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); if (kwTimer) { clearTimeout(kwTimer); kwTimer = null; } postFilter(); }
      });
      $('caseBtn').addEventListener('click', function () { ui.matchCase = !ui.matchCase; this.classList.toggle('on', ui.matchCase); postFilter(); });
      $('regexBtn').addEventListener('click', function () { ui.regex = !ui.regex; this.classList.toggle('on', ui.regex); postFilter(); });
      $('pauseBtn').addEventListener('click', function () { post({ op: 'toggle-pause' }); });
      $('clearBtn').addEventListener('click', function () { post({ op: 'clear' }); });
      $('copyAllBtn').addEventListener('click', function () { post({ op: 'copy-all' }); });
      $('dedupe').addEventListener('change', function () { ui.dedupe = this.checked; postFilter(); });

      $('ctxMenu').addEventListener('click', function (event) {
        var target = event.target && event.target.closest ? event.target.closest('[data-act]') : null;
        var act = target && target.getAttribute('data-act');
        if (!act) { return; }
        if (target.disabled) { return; }
        var row = ctxRow;
        if (act === 'copy-sql') { post({ op: 'copy-line', line: ctxLine }); }
        else if (act === 'copy-time') { post({ op: 'copy-time', line: ctxLine }); }
        else if (act === 'export') { post({ op: 'export' }); }
        else if (act === 'jump-java') { post({ op: 'jump-java', line: ctxLine }); }
        else if (act === 'jump-xml') { post({ op: 'jump-xml', line: ctxLine }); }
        else if (act === 'focus-method' && row) { setFocus('method', row.focus_key); }
        else if (act === 'focus-request' && row) { setFocus('request', row.request_id); }
        else if (act === 'delete-line') { post({ op: 'delete-line', line: ctxLine }); }
        else if (act === 'block-method') { post({ op: 'block-method', line: ctxLine }); }
        closeCtx();
      });

      document.addEventListener('click', function () { openTypeMenu(false); closeCtx(); });
      document.addEventListener('keydown', function (event) {
        // Ctrl+Tab / Ctrl+Shift+Tab cycle the four tabs. The IDE may consume
        // this chord before the page sees it; the mouse always works.
        var isCycle = (event.ctrlKey || event.metaKey) && event.key === 'Tab';
        if (isCycle) {
          event.preventDefault();
          cycleTab(event.shiftKey ? -1 : 1);
          return;
        }
        var isFind = (event.ctrlKey || event.metaKey) && (event.key === 'f' || event.key === 'F');
        if (isFind) {
          event.preventDefault();
          $('searchRow').hidden = false;
          $('searchBtn').classList.add('on');
          $('kw').focus();
          $('kw').select();
          return;
        }
        if (event.key === 'Escape') {
          if (!$('ctxMenu').hidden) { closeCtx(); return; }
          if (!$('typeMenu').hidden) { openTypeMenu(false); return; }
          if (!$('searchRow').hidden) {
            $('searchRow').hidden = true;
            $('searchBtn').classList.remove('on');
          }
        }
      });

      if (window.openidea && window.openidea.onMessage) {
        window.openidea.onMessage(function (raw) {
          try {
            var message = JSON.parse(raw);
            if (message.op === 'state') { applyState(message); }
          } catch (error) { /* ignore malformed */ }
        });
      }
      selectTab('logs', false);
      post({ op: 'ready' });
    })();
  </script>
</body>
</html>
