       page mounts it on the fifth tab, `preview.html` is the standalone shell
       (the API 1.18 dialog). The stylesheet is the same file for both. -->
  <link rel="stylesheet" href="./preview.css">

  <script type="module">
    import { mountPreview } from './preview.js';
    // Shared lexer (L2 list lane): the list rows colour their statement with the
    // same token set the preview uses, so the two surfaces cannot drift. The
    // module writes spans with textContent only, which keeps Ctrl+C on a row
    // yielding the plain statement text.
    import { into as highlightInto, installStyles } from './sql-highlight.js';

    (function () {
      installStyles();
      var TYPE_TOKENS = ['select', 'insert', 'update', 'delete', 'create', 'drop'];
      // Lane L2: `logs.displayMode` arrives as `state.displayMode`. The host
      // prepares the display text (`single` summary / `keyword_wrap` clause
      // lines capped at three / `formatted` full formatter output) and sends
      // the muted `(+N)` tail next to it, so the page only colours and lays
      // out what it is given — there is no second folding implementation here.
      var showDuration = true;
      var TYPE_COLORS = {
        select: 'var(--openidea-link)',
        insert: 'var(--openidea-success)',
        update: 'var(--openidea-warning)',
        delete: 'var(--openidea-danger)',
        create: 'var(--openidea-info)',
        drop: 'var(--openidea-accent)',
        error: 'var(--openidea-danger)',
        other: 'var(--openidea-fg-muted)'
      };

      var L = {};
      var current = null;
      var selectedLine = null;
      var ctxLine = null;
      var ctxRow = null;
      var typeMenuBuilt = false;
      // Tab strip (L22). Selection is DOM-only: no state request on switch.
      // The fifth tab (L23) is the preview workbench; it is permanent, so the
      // strip never removes an entry.
      var TAB_IDS = ['logs', 'logToSql', 'sqlToJava', 'history', 'preview'];
      var PANELS = {
        logs: 'panelLogs', logToSql: 'panelLogToSql',
        sqlToJava: 'panelSqlToJava', history: 'panelHistory',
        preview: 'panelPreview'
      };
      var activeTab = 'logs';
      // Signature of the rendered log rows: a state push that does not change
      // them must not rebuild the list (scroll and selection survive).
      var rowsSig = null;
      var ui = {
        types: { select: true, insert: true, update: true, delete: true, create: true, drop: true },
        slowOnly: false, dedupe: true, matchCase: false, regex: false, keyword: '',
        // The active focus chip ({kind, value}) or null. It rides the same
        // `filter` op as the other filters (lane L28).
        focus: null
      };
      var kwTimer = null;
      // Follow (L26): whether the list auto-scrolls to the newest row. The
      // page owns the flag and reports flips; the host keeps a mirror for the
      // status line. `suppressScroll` swallows the scroll event a rebuild
      // produces so a re-render does not look like a user scroll.
      var follow = true;
      var suppressScroll = false;
      // Display order (lane A): one of the seven sort tokens the host lists in
      // `labels.sortOptions`; `time_asc` (capture order) is the default, like
      // the reference's `SortMode.TIME_ASC`.
      var sortMode = 'time_asc';
      // Capture retry (lane A): the interval that re-dials a capture start the
      // agent refused, or null when nothing is waiting.
      var captureRetryTimer = null;
      // Drain tick while the enhanced channel is on (see syncCapturePoll).
      var capturePollTimer = null;

      function $(id) { return document.getElementById(id); }
      function post(message) {
        if (window.openidea && window.openidea.postMessage) {
          window.openidea.postMessage(JSON.stringify(message));
        }
      }
      // Text buttons carry an inline icon; only the label span is replaced so
      // the icon survives every state push.
      function setText(node, text) {
        if (!node) { return; }
        var label = node.querySelector('[data-btnlabel]');
        if (label) {
          // Icon-only button: the text becomes the tooltip / accessible name.
          var value = text == null ? '' : text;
          label.textContent = value;
          node.title = value;
          node.setAttribute('aria-label', value);
        }
        else { node.textContent = text == null ? '' : text; }
      }
      function selectedTokens() {
        var out = [];
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          if (ui.types[TYPE_TOKENS[i]]) { out.push(TYPE_TOKENS[i]); }
        }
        return out;
      }
      function typeLabel(token) {
        switch (token) {
          case 'select': return L.typeSelect;
          case 'insert': return L.typeInsert;
          case 'update': return L.typeUpdate;
          case 'delete': return L.typeDelete;
          case 'create': return L.typeCreate;
          case 'drop': return L.typeDrop;
          default: return token;
        }
      }

      // Sort options (lane A) ----------------------------------------------
      // The seven modes and their labels come from the host
      // (`labels.sortOptions`), in the reference's `sortOptions()` order; the
      // page never hard-codes the list.
      function sortOptionLabel(token) {
        var options = L.sortOptions || [];
        for (var i = 0; i < options.length; i++) {
          if (options[i].token === token) { return options[i].label || token; }
        }
        return token;
      }
      // The radio popup the reference builds from `JRadioButtonMenuItem`s: the
      // current mode carries the check mark. Rebuilding in place keeps an open
      // popup open across state pushes.
      function renderSortMenu() {
        var menu = $('sortMenu');
        if (!menu) { return; }
        var wasOpen = !menu.hidden;
        while (menu.firstChild) { menu.removeChild(menu.firstChild); }
        var options = L.sortOptions || [];
        for (var i = 0; i < options.length; i++) {
          (function (option) {
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'menu-item' + (option.token === sortMode ? ' on' : '');
            item.setAttribute('role', 'menuitemradio');
            item.setAttribute('aria-checked', option.token === sortMode ? 'true' : 'false');
            item.setAttribute('data-sort', option.token);
            var check = document.createElement('span');
            check.className = 'check';
            check.textContent = option.token === sortMode ? '\u2713' : '';
            item.appendChild(check);
            var text = document.createElement('span');
            text.textContent = option.label || option.token;
            item.appendChild(text);
            menu.appendChild(item);
          })(options[i]);
        }
        menu.hidden = !wasOpen;
      }

      function postFilter() {
        var toks = selectedTokens();
        var mode = toks.length === TYPE_TOKENS.length ? 'all' : (toks.length === 0 ? 'none' : 'only');
        post({
          op: 'filter', types: toks, types_mode: mode,
          slow_only: ui.slowOnly, keyword: ui.keyword,
          match_case: ui.matchCase, regex: ui.regex, dedupe: ui.dedupe,
          focus: ui.focus
        });
      }
      // One chip at a time: setting a different value replaces it, the same value
      // clears it (the reference panel's tab toggles the same way).
      function setFocus(kind, value) {
        if (!value) { return; }
        if (ui.focus && ui.focus.kind === kind && ui.focus.value === value) {
          ui.focus = null;
        } else {
          ui.focus = { kind: kind, value: value };
        }
        postFilter();
      }
      function clearFocus() {
        if (!ui.focus) { return; }
        ui.focus = null;
        postFilter();
      }
      function scheduleFilter() {
        if (kwTimer) { clearTimeout(kwTimer); }
        kwTimer = setTimeout(function () { kwTimer = null; postFilter(); }, 200);
      }

      function syncFromState(state) {
        var f = state.filter || {};
        if (f.types_mode === 'all') {
          for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = true; }
        } else if (f.types_mode === 'none') {
          for (var j = 0; j < TYPE_TOKENS.length; j++) { ui.types[TYPE_TOKENS[j]] = false; }
        } else if (f.types) {
          var set = {};
          for (var k = 0; k < f.types.length; k++) { set[f.types[k]] = true; }
          for (var m = 0; m < TYPE_TOKENS.length; m++) { ui.types[TYPE_TOKENS[m]] = !!set[TYPE_TOKENS[m]]; }
        }
        ui.slowOnly = !!f.slow_only;
        ui.dedupe = f.dedupe !== false;
        ui.matchCase = !!f.match_case;
        ui.regex = !!f.regex;
        ui.focus = (f.focus && f.focus.kind && f.focus.value)
          ? { kind: f.focus.kind, value: f.focus.value }
          : null;
        if (document.activeElement !== $('kw')) {
          ui.keyword = f.keyword || '';
          $('kw').value = ui.keyword;
        }
        $('slowOnly').checked = ui.slowOnly;
        $('dedupe').checked = ui.dedupe;
        $('caseBtn').classList.toggle('on', ui.matchCase);
        $('regexBtn').classList.toggle('on', ui.regex);
        // Display preferences (lane A): the host mirrors the page's last report,
        // so a push never silently changes what the user picked. A different
        // mode re-renders the popup so its check mark follows the state (the
        // first push also settles the menu, which updateLabels drew before this
        // snapshot arrived).
        var mode = state.sort || 'time_asc';
        if (mode !== sortMode) {
          sortMode = mode;
          renderSortMenu();
        }
        if (state.status && typeof state.status.follow === 'boolean') {
          follow = state.status.follow;
        }
        // The scroll-to-bottom tooltip names the follow state; the aria-label
        // (set in updateLabels) stays the action name.
        $('scrollEndBtn').title = follow ? (L.followOn || '') : (L.scrollEnd || '');
        syncCaptureRetry(state);
        syncCapturePoll(state);
      }

      // Capture retry (lane A): the platform gives the plugin a WebSocket
      // client only, so the plugin dials the agent and the target application
      // has to be up first (the reference IDE side owns a listening socket).
      // A refused start is a waiting state; this ticks `capture-retry` every
      // 2 s until the host clears it. `on-schedule` cannot do this: the host's
      // shortest schedule is 60 s.
      function syncCaptureRetry(state) {
        var waiting = !!(state.status && state.status.capture_waiting);
        if (waiting && !captureRetryTimer) {
          captureRetryTimer = setInterval(function () {
            post({ op: 'capture-retry' });
          }, 2000);
        } else if (!waiting && captureRetryTimer) {
          clearInterval(captureRetryTimer);
          captureRetryTimer = null;
        }
      }

      // Drain while the enhanced channel is on. The host wakes the plugin with
      // `websocket-ready` per arriving frame, but that wake is one-shot: one lost
      // while the plugin was idle leaves the frames staged with nothing to wake
      // us again, and the panel then sits at zero rows with a healthy socket.
      // A tick is cheap (a drain over an empty queue), so it runs on a plain
      // interval instead of relying on the wake alone.
      function syncCapturePoll(state) {
        var connected = !!(state.status && state.status.agent_connected);
        if (connected && !capturePollTimer) {
          capturePollTimer = setInterval(function () {
            post({ op: 'capture-poll' });
          }, 500);
        } else if (!connected && capturePollTimer) {
          clearInterval(capturePollTimer);
          capturePollTimer = null;
        }
      }

      // Icon buttons carry no text: the label lives in title + aria-label so
      // screen readers and tooltips still get it.
      function labelIconButton(node, label) {
        if (!node) { return; }
        node.setAttribute('aria-label', label || '');
        node.title = label || '';
      }

      // `<svg>` is an `SVGElement`: it has no `hidden` IDL property, so
      // `node.hidden = true` only sets an expando on the JS object and leaves
      // the attribute alone — the glyph never hides. Toggle the attribute.
      function setHidden(node, hidden) {
        if (!node) { return; }
        if (hidden) { node.setAttribute('hidden', ''); } else { node.removeAttribute('hidden'); }
      }

      // Focus / muted chips (lane L28) --------------------------------
      function chipButton(label, title, onClose) {
        var chip = document.createElement('span');
        chip.className = 'fchip';
        var text = document.createElement('span');
        text.className = 'ftext';
        text.textContent = label;
        chip.appendChild(text);
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'fclose';
        close.textContent = '×';
        close.title = title || '';
        close.setAttribute('aria-label', title || '');
        close.addEventListener('click', function (event) {
          event.stopPropagation();
          onClose();
        });
        chip.appendChild(close);
        return chip;
      }

      // The filter row shows what is narrowing the list: one focus chip (with
      // an × that clears it) and the muted-method counter (same ×, clears all).
      function renderFocusChips(state) {
        var host = $('focusChips');
        while (host.firstChild) { host.removeChild(host.firstChild); }
        var focus = (state.filter || {}).focus;
        if (focus && focus.value) {
          var prefix = focus.kind === 'request'
            ? (L.focusRequestPrefix || 'Request')
            : (focus.kind === 'template'
              ? (L.focusTemplatePrefix || 'Template')
              : (L.focusMethodPrefix || 'Method'));
          var label = prefix + ' · ' + focus.value;
          var chip = chipButton(label, L.focusClear || 'Clear focus', clearFocus);
          chip.title = label;
          host.appendChild(chip);
        }
        var blocked = (state.counts || {}).blocked || 0;
        if (blocked > 0) {
          var muted = (L.blockedPrefix || 'Muted') + ' ' + blocked;
          var mutedChip = chipButton(muted, L.blockedClear || '', function () {
            post({ op: 'clear-blocked' });
          });
          mutedChip.title = muted;
          host.appendChild(mutedChip);
        }
      }

      function updateLabels() {
        labelIconButton($('clearBtn'), L.clear || 'Clear');
        // Capture (L26): the icon follows "capture is on", not the socket. A
        // start whose dial was refused stays waiting for the target application
        // (lane A) — capture is on from the user's point of view, so the entry
        // has to flip to the stop glyph right away instead of leaving a play
        // triangle that reads as "nothing happened".
        var status = (current && current.status) || {};
        var active = !!(status.agent_connected || status.capture_waiting);
        var captureBtn = $('captureBtn');
        labelIconButton(captureBtn, active
          ? (L.captureStop || 'Stop capture')
          : (L.captureStart || 'Start capture'));
        captureBtn.classList.toggle('run', !active);
        setHidden($('captureRunIcon'), active);
        setHidden($('captureStopIcon'), !active);
        // Sort (lane A): the button is a popup opener, so its tooltip states the
        // mode the list is in — the reference action's `Sort: <label>`
        // description. The popup itself is rebuilt from the host's label list.
        var sorted = (current && current.sort) || sortMode || 'time_asc';
        labelIconButton($('sortBtn'), (L.sortLabel || 'Sort:') + ' ' + sortOptionLabel(sorted));
        // The button also names the mode: the tooltip states the dimension, the
        // visible label states which option is active.
        setText($('sortBtnText'), sortOptionLabel(sorted));
        renderSortMenu();
        labelIconButton($('scrollEndBtn'), L.scrollEnd || 'Scroll to bottom');
        labelIconButton($('blockedBtn'), L.manageSuppress || 'Manage suppress rules…');
        labelIconButton($('settingsBtn'), L.settings || 'Settings');
        // Quick preview hands the selected row to the preview workbench.
        labelIconButton($('previewBtn'), L.preview || 'Quick preview');
        labelIconButton($('communityBtn'), L.community || 'Community');
        labelIconButton($('helpBtn'), L.help || 'Help');
        labelIconButton($('searchBtn'), L.search || 'Search');
        setText($('dedupeLabel'), L.dedupe);
        setText($('slowOnlyLabel'), L.slowOnly);
        setText($('selectAll'), L.selectAll);
        setText($('selectNone'), L.selectNone);
        setText($('caseBtn'), L.matchCase);
        setText($('regexBtn'), L.regex);
        $('caseBtn').title = L.matchCaseTitle || '';
        $('regexBtn').title = L.regexTitle || '';
        $('kw').placeholder = L.keywordPlaceholder || '';
        setText($('ctxMenu').querySelector('[data-act="copy-sql"]'), L.menuCopySql);
        setText($('ctxMenu').querySelector('[data-act="copy-time"]'), L.menuCopyTime);
        setText($('ctxMenu').querySelector('[data-act="export"]'), L.menuExport);
        setText($('ctxMenu').querySelector('[data-act="jump-java"]'), L.menuJumpJava);
        setText($('ctxMenu').querySelector('[data-act="jump-xml"]'), L.menuJumpXml);
        setText($('ctxMenu').querySelector('[data-act="focus-method"]'), L.menuFocusMethod);
        setText($('ctxMenu').querySelector('[data-act="focus-request"]'), L.menuFocusRequest);
        setText($('ctxMenu').querySelector('[data-act="focus-template"]'), L.menuFocusTemplate);
        setText($('ctxMenu').querySelector('[data-act="delete-line"]'), L.menuDelete);
        setText($('ctxMenu').querySelector('[data-act="block-method"]'), L.menuBlockMethod);
        setText($('ctxMenu').querySelector('[data-act="suppress-sql"]'), L.menuSuppress);
        setText($('ctxMenu').querySelector('[data-act="send-sql-to-java"]'), L.menuSendSqlToJava);
        setText($('ctxMenu').querySelector('[data-act="send-log-to-sql"]'), L.menuSendLogToSql);
        renderEmpty();
        updateTabLabels();
        updateTypeButton();
      }

      // Empty state (lane A): the reference's `log.panel.empty` is two lines of
      // guidance in the platform's muted `StatusText` ink — the short line, then
      // the longer hint. Both come from the host; nothing is hard-coded here.
      function renderEmpty() {
        var host = $('empty');
        if (!host) { return; }
        while (host.firstChild) { host.removeChild(host.firstChild); }
        var head = document.createElement('div');
        head.textContent = L.empty || '';
        host.appendChild(head);
        if (L.emptyHint) {
          var hint = document.createElement('div');
          hint.className = 'hint';
          hint.textContent = L.emptyHint;
          host.appendChild(hint);
        }
      }

      function updateTabLabels() {
        var titles = {
          logs: L.tabLogs || 'SQL Logs',
          logToSql: L.tabLogToSql || 'Log -> SQL',
          sqlToJava: L.tabSqlToJava || 'SQL -> Java',
          history: L.tabHistory || 'SQL History',
          preview: L.tabPreview || 'SQL Preview'
        };
        for (var i = 0; i < TAB_IDS.length; i++) {
          var btn = tabButton(TAB_IDS[i]);
          if (!btn) { continue; }
          setText(btn, titles[TAB_IDS[i]]);
          // A narrow strip ellipsises the label; the tooltip keeps the full
          // name one hover away (the IDE does the same for squeezed tabs).
          btn.title = titles[TAB_IDS[i]];
        }
        setText($('l2sConvert'), L.tabLogToSqlConvert);
        setText($('l2sReadClipboard'), L.tabLogToSqlReadClipboard);
        setText($('l2sClearInput'), L.tabLogToSqlClearInput);
        setText($('l2sInputHint'), L.tabLogToSqlHintInput);
        setText($('l2sResultHint'), L.tabLogToSqlHintResult);
        setText($('l2sCopy'), L.tabLogToSqlCopy);
        setText($('l2sToggleFormat'), L.tabLogToSqlToggleFormat);
        setText($('l2sClearResult'), L.tabLogToSqlClearResult);
        setText($('s2jConvert'), L.tabSqlToJavaConvert);
        setText($('s2jFormatSql'), L.tabSqlToJavaFormat);
        setText($('s2jClearInput'), L.tabSqlToJavaClearInput);
        setText($('s2jInputHint'), L.tabSqlToJavaHintInput);
        setText($('s2jResultHint'), L.tabSqlToJavaHintResult);
        setText($('s2jCopy'), L.tabSqlToJavaCopy);
        setText($('s2jClearResult'), L.tabSqlToJavaClearResult);
        setText($('s2jFormatLabel'), L.tabSqlToJavaFormatLabel);
        $('s2jFormatMode').options[0].textContent = L.tabSqlToJavaFormatLambda || '';
        $('s2jFormatMode').options[1].textContent = L.tabSqlToJavaFormatString || '';
        setText($('s2jEntityLabel'), L.tabSqlToJavaEntityLabel);
        $('s2jEntity').placeholder = L.tabSqlToJavaEntityHint || '';
        $('s2jEntity').title = L.tabSqlToJavaEntityHint || '';
        setText($('s2jCallerLabel'), L.tabSqlToJavaCallerLabel);
        $('s2jCaller').placeholder = L.tabSqlToJavaCallerHint || '';
        setText($('s2jReturnLabel'), L.tabSqlToJavaReturnLabel);
        $('s2jReturnType').placeholder = L.tabSqlToJavaReturnHint || '';
        setText($('histSearchBtn'), L.tabHistorySearch);
        setText($('histBackBtn'), L.tabHistoryBack);
        setText($('histRefreshBtn'), L.tabHistoryRefresh);
        setText($('histScrollBtn'), L.tabHistoryScrollEnd);
        setText($('histPreviewBtn'), L.tabHistoryPreviewToggle);
        var histActs = {
          'copy': L.tabHistoryCopy,
          'preview': L.tabHistoryOpenPreview,
          'jump-java': L.tabHistoryJumpJava,
          'jump-xml': L.tabHistoryJumpXml
        };
        var histItems = $('histMenu').querySelectorAll('[data-hact]');
        for (var hi = 0; hi < histItems.length; hi++) {
          setText(histItems[hi], histActs[histItems[hi].getAttribute('data-hact')] || '');
        }
        if (historyTab && historyTab.level) { applyHistory(historyTab); }
      }

      function updateTypeButton() {
        var toks = selectedTokens();
        var text;
        if (toks.length === TYPE_TOKENS.length) { text = L.typesAll; }
        else if (toks.length === 0) { text = L.typesNone; }
        else { text = toks.length + ' ' + L.typesCountSuffix; }
        setText($('typeBtnText'), text);
        $('typeBtn').title = L.typesTitle || '';
      }

      function buildTypeMenu() {
        if (typeMenuBuilt) { return; }
        var host = $('typeList');
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          var token = TYPE_TOKENS[i];
          var label = document.createElement('label');
          label.className = 'menu-item';
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.setAttribute('data-token', token);
          box.checked = !!ui.types[token];
          box.addEventListener('change', function () {
            var t = this.getAttribute('data-token');
            ui.types[t] = this.checked;
            updateTypeButton();
            postFilter();
          });
          var sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = TYPE_COLORS[token] || 'var(--openidea-fg-muted)';
          var text = document.createElement('span');
          text.setAttribute('data-lbl', token);
          text.textContent = typeLabel(token);
          label.appendChild(box);
          label.appendChild(sw);
          label.appendChild(text);
          host.appendChild(label);
        }
        typeMenuBuilt = true;
      }

      function syncTypeCheckboxes() {
        var boxes = $('typeList').querySelectorAll('input[data-token]');
        for (var i = 0; i < boxes.length; i++) {
          var t = boxes[i].getAttribute('data-token');
          boxes[i].checked = !!ui.types[t];
        }
        var labels = $('typeList').querySelectorAll('[data-lbl]');
        for (var j = 0; j < labels.length; j++) {
          var tok = labels[j].getAttribute('data-lbl');
          labels[j].textContent = typeLabel(tok);
        }
      }

      function makePart(className, text) {
        var el = document.createElement('span');
        el.className = className;
        el.textContent = text;
        return el;
      }

      // A clickable badge (lane L26): the ⨉N / ×N capsule is a button that
      // toggles its group's expansion; the host owns the expanded set.
      function badgeButton(text, cls, title, onClick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'badge ' + cls;
        button.textContent = text;
        button.title = title || '';
        button.setAttribute('aria-label', title || '');
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          onClick();
        });
        return button;
      }

      // Last path segment, for a `[UserMapper.java:42]` part.
      function baseName(path) {
        if (!path) { return ''; }
        var parts = String(path).split(/[\\/]/);
        return parts[parts.length - 1] || path;
      }

      function buildRow(row, slowThreshold, isMember, dialect) {
        var el = document.createElement('div');
        el.className = 'row';
        el.setAttribute('data-line', String(row.line));
        // The CRUD marker colour rides a custom property: the stylesheet picks
        // it up for the bar, the DDL dash pattern and the background tint, so
        // no colour literal is ever written into this page.
        el.style.setProperty('--row-type', TYPE_COLORS[row.sql_type] || TYPE_COLORS.other);

        var bar = document.createElement('div');
        bar.className = 'bar';
        // DDL is marked by the line's shape (dashed), not by a separate hue.
        if (row.sql_type === 'create' || row.sql_type === 'drop') {
          bar.classList.add('ddl');
        }

        var content = document.createElement('div');
        content.className = 'content';
        // A member of an expanded group (L26) is indented under its head.
        if (isMember) { content.classList.add('member'); }

        var meta = document.createElement('div');
        meta.className = 'meta';
        // The reference header is `#1 [time] 12ms [MySQL · conn] (rows) …`
        // (L32): the sequence bare, the timestamp bracketed, the duration with
        // its unit, and the database badge right after it.
        meta.appendChild(makePart('seq', '#' + row.seq));
        meta.appendChild(makePart('part time', '[' + (row.time || '-') + ']'));
        // Lane L34: `log.showDuration` off drops the whole segment, and with it
        // the slow tint that lives on it — the row still states its category,
        // so nothing else breaks.
        if (showDuration) {
          var dur = document.createElement('span');
          dur.className = 'dur';
          // `~` marks a duration the parser approximated from a neighbouring
          // line rather than read from the statement's own close line.
          var approx = row.duration_approx ? '~' : '';
          dur.textContent = row.duration_ms == null
            ? '—'
            : approx + formatMs(row.duration_ms) + (L.durationUnit || 'ms');
          dur.classList.add(durationTier(row.duration_ms, slowThreshold));
          meta.appendChild(dur);
        }
        var dbText = dbBadge(row.db, dialect);
        if (dbText) { meta.appendChild(makePart('part db', dbText)); }
        if (row.rows_affected != null) {
          meta.appendChild(makePart('part rows', '(' + row.rows_affected + ' ' + (L.rowsSuffix || 'rows') + ')'));
        }
        if (row.dedupe_count > 1) {
          var dedupeText = (L.dedupeBadgePrefix || '') + row.dedupe_count;
          var dedupeTitle = row.expanded ? (L.groupCollapse || '') : (L.groupExpand || '');
          if (row.dedupe_key) {
            meta.appendChild(badgeButton(dedupeText, 'dedupe', dedupeTitle, function () {
              post({ op: 'toggle-group', line: row.line, kind: 'dedupe' });
            }));
          } else {
            meta.appendChild(makePart('badge dedupe', dedupeText));
          }
        }
        if (row.group_count > 1) {
          // The reference's phrase form (`同结构 N 条`); the old `×N` prefix
          // stays as the fallback for a label set that predates the key.
          var groupText = L.groupBadge
            ? L.groupBadge.replace('{n}', String(row.group_count))
            : (L.groupBadgePrefix || '') + row.group_count;
          var groupTitle = row.expanded ? (L.groupCollapse || '') : (L.groupExpand || '');
          if (row.n_plus_one_key) {
            meta.appendChild(badgeButton(groupText, 'group', groupTitle, function () {
              post({ op: 'toggle-group', line: row.line, kind: 'group' });
            }));
          } else {
            meta.appendChild(makePart('badge group', groupText));
          }
        }
        if (row.n_plus_one) {
          var n1 = makePart('badge n1', L.nPlusOne || 'N+1');
          meta.appendChild(n1);
        }
        // Provenance (lane L28), last in the left flow: [file:line] then
        // [Class#method], the reference panel's order. A row that stated no
        // source simply has neither part — no placeholder.
        if (row.jump_file && row.jump_line) {
          meta.appendChild(makePart('part src', '[' + baseName(row.jump_file) + ':' + row.jump_line + ']'));
        }
        if (row.class_simple && row.method) {
          var methodPart = makePart('part method focusable', '[' + row.class_simple + '#' + row.method + ']');
          if (ui.focus && ui.focus.kind === 'method' && ui.focus.value === row.focus_key) {
            methodPart.classList.add('on');
          }
          methodPart.title = row.focus_key || '';
          methodPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('method', row.focus_key);
          });
          meta.appendChild(methodPart);
        }
        if (row.request_id) {
          var reqPart = makePart('part req focusable', '[' + row.request_id + ']');
          if (ui.focus && ui.focus.kind === 'request' && ui.focus.value === row.request_id) {
            reqPart.classList.add('on');
          }
          reqPart.title = row.request_id;
          reqPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('request', row.request_id);
          });
          meta.appendChild(reqPart);
        }
        content.appendChild(meta);

        if (row.sql) {
          var sql = document.createElement('div');
          sql.className = 'sql';
          // Only the statement fragment is tokenised; the metadata line keeps
          // its own hand-written colours. `into` writes text, never markup, and
          // the concatenation of its spans is the statement itself, so copying
          // a row still yields plain SQL.
          highlightInto(sql, row.sql);
          if (row.sqlTail) {
            // The dropped-line counter is muted, the way the reference draws
            // `… (+N)` at the end of the third line (L2).
            var tail = document.createElement('span');
            tail.className = 'sqlTail';
            tail.textContent = row.sqlTail;
            sql.appendChild(tail);
          }
          // The whole prepared statement stays one hover away.
          sql.title = row.sql;
          content.appendChild(sql);
        }
        if (row.error_text) {
          var err = document.createElement('div');
          err.className = 'err';
          // The reference prefixes a failed statement with a warning sign so it
          // reads as an error even before the red ink is noticed.
          err.textContent = '⛔ ' + row.error_text;
          content.appendChild(err);
        }

        content.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('dblclick', function () {
          selectLine(row.line);
          if (row.sql) { post({ op: 'open-line', line: row.line }); }
        });
        el.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          selectLine(row.line);
          openCtx(event.clientX, event.clientY, row);
        });

        el.appendChild(bar);
        el.appendChild(content);
        return el;
      }

      function formatMs(ms) {
        if (Math.abs(ms - Math.round(ms)) < 0.001) { return String(Math.round(ms)); }
        return ms.toFixed(1);
      }

      // Duration tiers against the slow threshold T (`log.slowThresholdMs`):
      // `≥T` red, `≥T/2` orange, `<T/2` green; an unknown duration is grey.
      // A threshold of zero makes every measured duration a slow one, which is
      // what `ms >= T` means — never a guess at another cut-off.
      function durationTier(ms, threshold) {
        if (ms == null) { return 'none'; }
        if (threshold == null || threshold <= 0) { return 'slow'; }
        if (ms >= threshold) { return 'slow'; }
        if (ms >= threshold / 2) { return 'warn'; }
        return 'ok';
      }

      // The database badge (L32). The reference draws `[MySQL · conn-3]`; this
      // build captures no connection name, so it states the engine configured
      // in the settings and appends the database only when the row carries one
      // — it never guesses a connection.
      function dbBadge(db, dialect) {
        var engine = dialect || '';
        var name = db || '';
        if (!engine && !name) { return ''; }
        if (!name) { return '[' + engine + ']'; }
        return '[' + (engine ? engine + ' · ' : '') + name + ']';
      }

      // `sql-lines-3`: the host caps the keyword-wrap text at three clause lines and
      // states how many it dropped in `row.sqlTail`, the way the reference row
      // ends with `… (+1)`. Single-line rows are already one line and formatted
      // rows are uncapped, so the page never folds anything itself.
      function selectLine(line) {
        selectedLine = line;
        var rows = $('list').querySelectorAll('.row');
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].getAttribute('data-line') === String(line)) { rows[i].classList.add('sel'); }
          else { rows[i].classList.remove('sel'); }
        }
        // The two input tabs are standalone panes (L33): selecting a row no
        // longer feeds them, so no state round-trip is asked for here.
      }

      // Lane L26: at the bottom means `scrollTop + clientHeight >= scrollHeight
      // - 4`; the tolerance covers sub-pixel and rounding differences.
      function atBottom() {
        var list = $('list');
        return list.scrollTop + list.clientHeight >= list.scrollHeight - 4;
      }

      function renderList(state) {
        var list = $('list');
        var rows = state.rows || [];
        var threshold = state.slow_threshold_ms;
        // The engine half of the row's database badge (L32): what the settings
        // page configured, so a row never claims a connection it does not know.
        var dialect = state.dialect || '';
        // Lane L34: `log.showDuration`; the hand-written folding that used to live
        // here moved to the host (`rows::list_display_sql`), so the page renders
        // the prepared text and the row's own tail.
        showDuration = state.showDuration !== false;
        // The cell padding follows the mode (single-line rows are 8px, not 12px);
        // CSS keys off this attribute so no per-row class has to be set.
        list.dataset.mode = state.displayMode || 'keyword_wrap';
        // `logs.crud.style` (bar / background / off) is a list-level switch: the
        // bars are always built, the stylesheet decides whether they draw.
        list.dataset.crud = state.crudStyle || 'bar';
        var wasAtBottom = atBottom();

        while (list.firstChild) { list.removeChild(list.firstChild); }
        if (rows.length === 0) {
          list.hidden = true;
          $('empty').hidden = false;
          suppressScroll = true;
          return;
        }
        list.hidden = false;
        $('empty').hidden = true;
        var frag = document.createDocumentFragment();
        // A row belongs to an expanded group when it is flagged expanded and
        // its group key repeats the previous row's key (the host emits the
        // occurrences contiguously); those rows render indented, each with its
        // own time and duration. The `expanded` guard keeps consecutive rows of
        // a *collapsed* N+1 group from being mistaken for members.
        var prevDedupe = '';
        var prevNPlusOne = '';
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var isMember = !!(row.expanded &&
            ((row.dedupe_key && row.dedupe_key === prevDedupe) ||
              (row.n_plus_one_key && row.n_plus_one_key === prevNPlusOne)));
          frag.appendChild(buildRow(row, threshold, isMember, dialect));
          prevDedupe = row.dedupe_key || '';
          prevNPlusOne = row.n_plus_one_key || '';
        }
        list.appendChild(frag);
        if (selectedLine != null) { selectLine(selectedLine); }
        var paused = state.status && state.status.paused;
        // Auto-scroll only while following (L26); the rebuild's own scroll
        // event is swallowed so it never looks like the user scrolled away.
        suppressScroll = true;
        if (!paused && follow && wasAtBottom) { list.scrollTop = list.scrollHeight; }
      }

      function updateCounts(state) {
        var c = state.counts || {};
        var slowBadge = $('slowBadge');
        if (c.slow > 0) {
          slowBadge.hidden = false;
          setText(slowBadge, (L.slowPrefix || '') + ' ' + c.slow);
        } else {
          slowBadge.hidden = true;
        }
        var hit = $('hitCount');
        var keyword = ui.keyword && ui.keyword.trim();
        setText(hit, keyword ? (c.total + ' ' + (L.hitsSuffix || '')) : '');
        var err = $('regexErr');
        var invalid = state.filter && state.filter.regex_error;
        err.hidden = !invalid;
        if (invalid) { setText(err, L.regexError); }
        updateFilterBar();
      }

      // The chips row only takes space while it states something (L32). The slow
      // count is not here: it sits at the right edge of the toolbar.
      function updateFilterBar() {
        var chips = $('focusChips');
        var hasChips = !!(chips && chips.childNodes.length);
        $('filterBar').hidden = !hasChips;
      }

      function updateStatus(state) {
        var s = state.status || {};
        var c = state.counts || {};
        setText($('statusLeft'), (L.statusConsolePrefix || '') + ' ' + (s.console_lines || 0) + ' ' + (L.statusConsoleSuffix || ''));
        var mid;
        if (c.truncated) {
          mid = (L.truncatedPrefix || '') + ' ' + c.cap;
        } else {
          mid = (L.totalPrefix || '') + ' ' + (c.total || 0) + ' ' + (L.totalSuffix || '');
        }
        setText($('statusMid'), mid.replace(/\s+/g, ' ').trim());
        // The right segment names the first mode that changes what the user
        // sees: refresh paused, follow paused, then the enhanced channel. That
        // channel keeps its own segment even while it is off — the reference
        // status bar always states both channels (`CaptureStatusBar`).
        var right;
        if (s.paused) {
          right = L.paused || '';
        } else if (s.capture_waiting) {
          // A refused capture start (lane A): the plugin is dialling, the target
          // application is not up yet. The port is the actionable detail.
          right = (L.statusCaptureWaiting || 'Waiting for the target application (port {port})')
            .replace('{port}', String(s.capture_waiting.port || ''));
        } else if (s.follow === false) {
          right = L.followOff || '';
        } else if (s.agent_connected) {
          right = (L.statusAgentEventsPrefix || '') + ' ' + (s.agent_events || 0);
          // Nothing captured while the socket is up: the agent's own heartbeat
          // counters say which of the three causes it is, so the empty list
          // stops being a mystery.
          var h = s.agent_health;
          if (!(s.agent_events > 0) && h) {
            if (h.gate) {
              right += ' · ' + (L.statusAgentGate || 'agent stopped itself (no CONFIG)');
            } else if (!h.woven) {
              right += ' · ' + (L.statusAgentNoHooks || 'no hooks woven');
            } else if (!h.matched) {
              right += ' · ' + (L.statusAgentIdle || 'hooks woven, nothing fired');
            }
          }
        } else {
          right = L.statusAgentOff || '';
        }
        setText($('statusRight'), right);
      }

      // Tabs ----------------------------------------------------------------
      function tabButton(tab) { return $('tab-' + tab); }
      function tabPanel(tab) { return $(PANELS[tab]); }

      function selectTab(tab, notify) {
        if (TAB_IDS.indexOf(tab) < 0) { return; }
        activeTab = tab;
        for (var i = 0; i < TAB_IDS.length; i++) {
          var id = TAB_IDS[i];
          var on = id === tab;
          var btn = tabButton(id);
          if (btn) {
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
            // A narrow panel scrolls the strip: the tab the host switched to
            // must be what the user sees, not an off-screen neighbour.
            if (on && btn.scrollIntoView) {
              btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
            }
          }
          var panel = tabPanel(id);
          if (panel) { panel.hidden = !on; }
        }
        // `tab` is a hint only: the host does not answer it, so switching
        // never re-requests state.
        if (notify) { post({ op: 'tab', tab: tab }); }
      }

      function cycleTab(delta) {
        var index = TAB_IDS.indexOf(activeTab);
        if (index < 0) { index = 0; }
        var next = (index + delta + TAB_IDS.length) % TAB_IDS.length;
        selectTab(TAB_IDS[next], true);
      }

      // A cheap identity for the pushed rows: same signature => same list, so
      // the DOM is not rebuilt and scroll/selection survive.
      function rowsSignature(rows) {
        var parts = [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          parts.push(r.line + '/' + r.seq + '/' + r.sql_type + '/' + r.category + '/' +
            r.dedupe_count + '/' + r.group_count + '/' + (r.n_plus_one ? 1 : 0) + '/' +
            (r.dedupe_key || '') + '/' + (r.n_plus_one_key || '') + '/' + (r.expanded ? 1 : 0) + '/' +
            (r.class_simple || '') + '#' + (r.method || '') + '/' +
            (r.jump_file || '') + ':' + (r.jump_line == null ? '' : r.jump_line) + '/' +
            (r.xml_file || '') + ':' + (r.xml_line == null ? '' : r.xml_line) + '/' +
            (r.request_id || '') + '/' + (r.thread || ''));
        }
        return parts.join('|');
      }

      // Lane L34: `logs.displayMode` / `log.showDuration` take part in the list
      // identity below, so changing either re-renders the rows even when the
      // captured rows themselves did not move.
      function displayKey(state) {
        return (state.displayMode || 'keyword_wrap') + '/' +
          (state.showDuration === false ? '0' : '1') + '/' +
          (state.crudStyle || 'bar');
      }

      // "Log → SQL" (L33) ---------------------------------------------------
      // The tab's own input pane converts whatever is pasted there; the host
      // keeps the converted output and the status line. `l2sMulti` is the
      // multi-line output the host pushed; the compact form is derived here,
      // because 压缩↔多行 is a display switch and never asks the host.
      var l2sOutputSig = null;
      var l2sMulti = '';
      var l2sCompact = false;

      // Collapse the formatter's line breaks, keeping `-- SQL #N` group
      // headers on their own lines. The host's output and the compact form
      // differ only in whitespace between tokens.
      function compactSql(text) {
        var out = [];
        var current = '';
        var lines = (text || '').split('\n');
        for (var i = 0; i < lines.length; i++) {
          var trimmed = lines[i].trim();
          if (trimmed === '') {
            if (current) { out.push(current); current = ''; }
            // Keep one blank line between groups (the host joins them with
            // two newlines, the reference keeps that gap in compact form too).
            if (out.length && out[out.length - 1] !== '') { out.push(''); }
            continue;
          }
          if (trimmed.indexOf('--') === 0) {
            if (current) { out.push(current); current = ''; }
            out.push(trimmed);
            continue;
          }
          current = current ? (current + ' ' + trimmed) : trimmed;
        }
        if (current) { out.push(current); }
        return out.join('\n');
      }

      function renderLogOutput() {
        $('l2sOutput').value = l2sCompact ? compactSql(l2sMulti) : l2sMulti;
        $('l2sCopy').disabled = !$('l2sOutput').value;
      }

      function applyLogToSql(tab) {
        tab = tab || {};
        var output = tab.output || '';
        // Only a new conversion rewrites the result pane: a state push from
        // the capture lane must not throw away edits the user made.
        if (output !== l2sOutputSig) {
          l2sOutputSig = output;
          l2sMulti = output;
          renderLogOutput();
        }
        if (tab.replaceInput) { $('l2sInput').value = tab.input || ''; }
        var status = tab.status || '';
        var node = $('l2sStatus');
        setText(node, status);
        node.hidden = !status;
        node.classList.toggle('error', tab.statusKind === 'error');
      }

      // "SQL → Java" (L33) --------------------------------------------------
      var s2jCodeSig = null;
      var s2jOptionsSig = null;

      function setOptionField(id, value) {
        var node = $(id);
        if (!node || document.activeElement === node) { return; }
        var next = value || '';
        if (node.value !== next) { node.value = next; }
      }

      // A non-default option cannot change the code this build generates, so
      // the row states that once, next to itself, instead of a dead control.
      function updateSqlToJavaOptionHint() {
        var custom = $('s2jFormatMode').value !== 'lambda' ||
          $('s2jCaller').value.trim() !== '' ||
          $('s2jReturnType').value.trim() !== '';
        var node = $('s2jOptionHint');
        node.hidden = !custom;
        setText(node, custom ? (L.tabSqlToJavaFixedLambda || '') : '');
      }

      function applySqlToJava(tab) {
        tab = tab || {};
        var code = tab.code || '';
        if (code !== s2jCodeSig) {
          s2jCodeSig = code;
          $('s2jOutput').value = code;
        }
        $('s2jCopy').disabled = !$('s2jOutput').value;
        if (tab.replaceInput) { $('s2jInput').value = tab.input || ''; }
        var options = tab.options || {};
        var sig = [options.format || '', options.entity || '', options.caller || '',
          options.returnType || ''].join('\u0000');
        if (sig !== s2jOptionsSig) {
          s2jOptionsSig = sig;
          if (document.activeElement !== $('s2jFormatMode')) {
            $('s2jFormatMode').value = options.format === 'stringColumns' ? 'stringColumns' : 'lambda';
          }
          setOptionField('s2jEntity', options.entity);
          setOptionField('s2jCaller', options.caller);
          setOptionField('s2jReturnType', options.returnType);
        }
        updateSqlToJavaOptionHint();
        var status = tab.status || '';
        var node = $('s2jStatus');
        setText(node, status);
        node.hidden = !status;
        node.classList.toggle('error', tab.statusKind === 'error');
      }

      // "SQL history": two levels, like the reference's HistorySqlLogPanel.
      // Level 1 lists saved log files; opening one shows its statements.
      var historyTab = {};
      var histSelected = null;

      function fmtBytes(bytes) {
        if (!bytes) { return '0 KB'; }
        if (bytes >= 1024 * 1024) { return (bytes / (1024 * 1024)).toFixed(1) + ' MB'; }
        return Math.max(1, Math.round(bytes / 1024)) + ' KB';
      }

      function historyFileRow(file) {
        var el = document.createElement('div');
        el.className = 'histfile';
        el.setAttribute('role', 'listitem');
        var name = document.createElement('span');
        name.className = 'hname';
        name.textContent = file.name || '';
        var size = document.createElement('span');
        size.className = 'hmeta';
        size.textContent = fmtBytes(file.bytes);
        var count = document.createElement('span');
        count.className = 'hmeta';
        count.textContent = (file.count || 0) + ' ' + (L.tabHistoryFileCountSuffix || '');
        el.appendChild(name);
        el.appendChild(size);
        el.appendChild(count);
        el.title = (file.saved || '') + ' · ' + (file.name || '');
        el.addEventListener('click', function () {
          if (histSelected) { histSelected.classList.remove('selected'); }
          histSelected = el;
          el.classList.add('selected');
        });
        el.addEventListener('dblclick', function () {
          post({ op: 'history-open-file', id: file.id });
        });
        return el;
      }

      function historyEntryRow(entry) {
        var el = document.createElement('div');
        el.className = 'histentry';
        el.dataset.line = String(entry.line);
        var head = document.createElement('div');
        head.className = 'hhead';
        head.appendChild(makePart('part time', entry.time || '-'));
        if (entry.duration_ms != null) {
          head.appendChild(makePart('part', entry.duration_ms + (L.durationUnit || 'ms')));
        }
        var loc = document.createElement('span');
        loc.className = 'part loc';
        loc.textContent = entry.source || '';
        loc.title = entry.method || '';
        head.appendChild(loc);
        var sql = document.createElement('div');
        sql.className = 'hsql';
        sql.textContent = entry.sql || '';
        el.appendChild(head);
        el.appendChild(sql);
        el.title = entry.method || '';
        el.addEventListener('click', function () {
          selectHistoryEntry(entry.line, el);
        });
        el.addEventListener('dblclick', function () {
          selectHistoryEntry(entry.line, el);
          post({ op: 'history-open', line: entry.line });
        });
        el.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          selectHistoryEntry(entry.line, el);
          openHistoryMenu(event, entry);
        });
        return el;
      }

      function selectHistoryEntry(line, el) {
        var rows = $('histEntries').children;
        for (var i = 0; i < rows.length; i++) { rows[i].classList.remove('selected'); }
        el.classList.add('selected');
        histSelected = el;
        if (historyTab.preview) {
          post({ op: 'history-preview', line: line });
        }
      }

      function openHistoryMenu(event, entry) {
        var menu = $('histMenu');
        var items = menu.querySelectorAll('[data-hact]');
        for (var i = 0; i < items.length; i++) {
          var act = items[i].getAttribute('data-hact');
          items[i].disabled = (act === 'jump-java' || act === 'jump-xml') && !entry.method;
        }
        menu.hidden = false;
        var rect = $('panelHistory').getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        x = Math.min(x, rect.width - menu.offsetWidth - 8);
        y = Math.min(y, rect.height - menu.offsetHeight - 8);
        menu.style.left = Math.max(4, x) + 'px';
        menu.style.top = Math.max(4, y) + 'px';
      }

      function closeHistoryMenu() { $('histMenu').hidden = true; }

      function historyEmptyText(tab) {
        if (tab.ran && tab.keyword) { return L.tabHistoryNoMatch || ''; }
        return tab.level === 'files'
          ? (L.tabHistoryFilesEmpty || '')
          : (L.tabHistoryEntriesEmpty || '');
      }

      function applyHistory(tab) {
        tab = tab || {};
        historyTab = tab;
        var level = tab.level === 'entries' ? 'entries' : 'files';
        $('histBackBtn').hidden = level !== 'entries';
        $('histPreviewBtn').classList.toggle('on', !!tab.preview);
        $('histFiles').hidden = level !== 'files';
        $('histEntries').hidden = level !== 'entries';
        $('histKw').placeholder = level === 'files'
          ? (L.tabHistorySearchFiles || '')
          : (L.tabHistorySearchEntries || '');

        var target = level === 'files' ? $('histFiles') : $('histEntries');
        var items = level === 'files' ? (tab.files || []) : (tab.entries || []);
        while (target.firstChild) { target.removeChild(target.firstChild); }
        var frag = document.createDocumentFragment();
        for (var i = 0; i < items.length; i++) {
          frag.appendChild(level === 'files'
            ? historyFileRow(items[i])
            : historyEntryRow(items[i]));
        }
        target.appendChild(frag);
        histSelected = null;

        var empty = items.length === 0;
        target.hidden = empty;
        $('histEmpty').hidden = !empty;
        if (empty) { setText($('histEmpty'), historyEmptyText(tab)); }

        var count = '';
        if (tab.total > 0) {
          var suffix = level === 'files'
            ? (L.tabHistoryFilesCountSuffix || '')
            : (L.tabHistoryCountSuffix || '');
          count = tab.total + ' ' + suffix;
        }
        if (tab.truncated) {
          count += (count ? ' · ' : '') + (L.tabHistoryTruncated || '');
        }
        setText($('histCount'), count.replace(/\s+/g, ' ').trim());

        var pane = $('histPreviewPane');
        pane.hidden = !tab.preview || level !== 'entries';
        if (!pane.hidden) {
          var line = tab.previewLine;
          var body = '';
          if (line != null) {
            for (var j = 0; j < items.length; j++) {
              if (items[j].line === line) { body = items[j].sql || ''; break; }
            }
          }
          $('histPreviewBody').textContent = body || (L.tabHistoryPreviewEmpty || '');
        }

        if (document.activeElement !== $('histKw')) {
          $('histKw').value = tab.keyword || '';
        }
      }


      function applyState(state) {
        current = state;
        L = state.labels || L;
        buildTypeMenu();
        updateLabels();
        syncFromState(state);
        syncTypeCheckboxes();
        updateTypeButton();
        renderFocusChips(state);
        var sig = rowsSignature(state.rows || []) + '#' + (state.dialect || '') + '#' + displayKey(state);
        if (sig !== rowsSig) {
          rowsSig = sig;
          renderList(state);
        }
        updateCounts(state);
        updateStatus(state);
        var tabs = state.tabs || {};
        // The preview tab is a module now (lane L42): it renders its own slice
        // of the same state push.
        if (tabs.preview && preview) { preview.applyTab(tabs.preview); }
        applyLogToSql(tabs.logToSql);
        applySqlToJava(tabs.sqlToJava);
        applyHistory(tabs.history);
        // `selectTab` is set by open-workbench / a double-clicked row and stays
        // in the state until the page reports the tab it shows (the `tab`
        // message below does exactly that).
        if (state.selectTab) { selectTab(state.selectTab, true); }
        // "发送到 …" (L32/L33): prefill the target tab's input pane, bring that tab
        // forward, and report the hand-off as consumed (`tab`). A hand-off
        // without `selectTab` still pre-fills and still reports, so it is
        // consumed exactly once (the host drops it on `tab`).
        if (state.sendToTab) {
          var send = state.sendToTab;
          var sendText = send.text || '';
          if (send.tab === 'logToSql') {
            if (sendText) { $('l2sInput').value = sendText; }
          } else if (send.tab === 'sqlToJava') {
            if (sendText) { $('s2jInput').value = sendText; }
          }
          if (send.selectTab) {
            selectTab(send.tab, true);
          } else {
            post({ op: 'tab', tab: send.tab });
          }
        }
      }

      // Type popup ----------------------------------------------------------
      function openTypeMenu(open) {
        $('typeMenu').hidden = !open;
        $('typeBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      // Sort popup (lane A): the reference's `sortModeAction` drops its radio
      // menu from the action's own component.
      function openSortMenu(open) {
        $('sortMenu').hidden = !open;
        $('sortBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      // In-panel sheets (L2) ----------------------------------------------
      // Settings, community and help render here instead of only writing to the
      // Output channel. Everything is built with textContent: the state push
      // carries the current values, and the sheet never turns them into markup.
      function sheetRow(label, value) {
        var row = document.createElement('div');
        row.className = 'sheet-row';
        row.appendChild(makePart('k', label || ''));
        row.appendChild(makePart('v', value == null ? '' : String(value)));
        return row;
      }

      function sheetLine(text) {
        var line = document.createElement('div');
        line.className = 'sheet-line';
        line.textContent = text || '';
        return line;
      }

      function displayModeLabel(token) {
        if (token === 'single') { return L.displayModeSingle || 'single'; }
        if (token === 'formatted') { return L.displayModeFormatted || 'formatted'; }
        return L.displayModeKeywordWrap || 'keyword_wrap';
      }

      function crudStyleLabel(token) {
        if (token === 'background') { return L.crudStyleBackground || 'background'; }
        if (token === 'off') { return L.crudStyleOff || 'off'; }
        return L.crudStyleBar || 'bar';
      }

      function renderSettingsSheet(body) {
        var state = current || {};
        body.appendChild(sheetRow(L.settingsDisplayMode,
          displayModeLabel(state.displayMode || 'keyword_wrap')));
        body.appendChild(sheetRow(L.settingsShowDuration,
          state.showDuration === false ? (L.settingsOff || 'Off') : (L.settingsOn || 'On')));
        var threshold = state.slow_threshold_ms;
        body.appendChild(sheetRow(L.settingsSlowThreshold,
          threshold == null ? '—' : threshold + ' ms'));
        body.appendChild(sheetRow(L.settingsCrudStyle,
          crudStyleLabel(state.crudStyle || 'bar')));
        var hint = document.createElement('div');
        hint.className = 'sheet-hint';
        hint.textContent = L.settingsPathHint || '';
        body.appendChild(hint);
      }

      function renderHelpSheet(body) {
        var lines = [L.helpSearch, L.helpTab, L.helpDblclick, L.helpMenu,
          L.helpScroll, L.helpSort, L.helpBlocked];
        for (var i = 0; i < lines.length; i++) {
          if (lines[i]) { body.appendChild(sheetLine(lines[i])); }
        }
      }

      function renderCommunitySheet(body) {
        body.appendChild(sheetLine(L.communityGuide || ''));
        var qr = document.createElement('div');
        qr.className = 'sheet-qr';
        qr.textContent = L.communityQrPlaceholder || '';
        body.appendChild(qr);
      }

      function openSheet(kind) {
        var title = '';
        var body = $('sheetBody');
        while (body.firstChild) { body.removeChild(body.firstChild); }
        if (kind === 'settings') {
          title = L.settings || 'Settings';
          renderSettingsSheet(body);
        } else if (kind === 'help') {
          title = L.helpTitle || L.help || 'Help';
          renderHelpSheet(body);
        } else {
          title = L.community || 'Community';
          renderCommunitySheet(body);
        }
        setText($('sheetTitle'), title);
        setText($('sheetClose'), '×');
        $('sheetClose').title = L.sheetClose || 'Close';
        $('sheetClose').setAttribute('aria-label', L.sheetClose || 'Close');
        $('sheet').hidden = false;
      }

      function closeSheet() { $('sheet').hidden = true; }

      // Context menu --------------------------------------------------------
      // The menu acts on the row that opened it. An item whose dimension the
      // row does not state is disabled, so the host is never asked to guess a
      // jump target or a focus value.
      function ctxItem(act) { return $('ctxMenu').querySelector('[data-act="' + act + '"]'); }
      function enableItem(act, enabled) {
        var node = ctxItem(act);
        if (!node) { return; }
        node.disabled = !enabled;
        node.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      }
      function openCtx(x, y, row) {
        ctxRow = row;
        ctxLine = row ? row.line : null;
        enableItem('jump-java', !!(row && row.jump_file));
        enableItem('jump-xml', !!(row && row.xml_file));
        enableItem('focus-method', !!(row && row.focus_key));
        enableItem('focus-request', !!(row && row.request_id));
        enableItem('block-method', !!(row && row.focus_key));
        // Suppression needs the row's own statement; an error row has none.
        enableItem('suppress-sql', !!(row && row.sql));
        // The template focus clusters by the structure key the `×N` badge
        // counts, so a row outside any such group has no template to focus on.
        enableItem('focus-template', !!(row && row.n_plus_one_key));
        // Both "发送到" entries need the row's own text: the SQL for SQL→Java,
        // the buffered log line for 日志→SQL (every listed row has one).
        enableItem('send-sql-to-java', !!(row && row.sql));
        enableItem('send-log-to-sql', !!row);
        var menu = $('ctxMenu');
        menu.hidden = false;
        var width = menu.offsetWidth || 200;
        var height = menu.offsetHeight || 220;
        menu.style.left = Math.min(x, window.innerWidth - width - 4) + 'px';
        menu.style.top = Math.min(y, window.innerHeight - height - 4) + 'px';
      }
      function closeCtx() { $('ctxMenu').hidden = true; ctxLine = null; ctxRow = null; }

      // Wiring --------------------------------------------------------------
      for (var tabIndex = 0; tabIndex < TAB_IDS.length; tabIndex++) {
        (function (tab) {
          var btn = tabButton(tab);
          if (btn) {
            btn.addEventListener('click', function () {
              selectTab(tab, true);
              if (tab === 'history') {
                post({ op: historyTab.level === 'entries' ? 'history-refresh' : 'history-list' });
              }
            });
          }
        })(TAB_IDS[tabIndex]);
      }
      // "日志 → SQL" (L33): each button is one op; the result pane's copy sends the
      // text the user sees (it is editable), not a host-side draft.
      $('l2sConvert').addEventListener('click', function () {
        post({ op: 'log-to-sql-convert', text: $('l2sInput').value });
      });
      $('l2sReadClipboard').addEventListener('click', function () {
        post({ op: 'log-to-sql-read-clipboard' });
      });
      $('l2sClearInput').addEventListener('click', function () {
        $('l2sInput').value = '';
      });
      $('l2sCopy').addEventListener('click', function () {
        var text = $('l2sOutput').value;
        if (text) { post({ op: 'copy-text', tab: 'logToSql', text: text }); }
      });
      // 压缩↔多行: a pure display switch, both forms come from the pushed
      // output — no host round-trip.
      $('l2sToggleFormat').addEventListener('click', function () {
        l2sCompact = !l2sCompact;
        renderLogOutput();
      });
      $('l2sClearResult').addEventListener('click', function () {
        post({ op: 'log-to-sql-clear' });
      });

      // "SQL → Java" (L33).
      function postSqlToJavaConvert() {
        post({
          op: 'sql-to-java-convert',
          text: $('s2jInput').value,
          format: $('s2jFormatMode').value,
          entity: $('s2jEntity').value,
          caller: $('s2jCaller').value,
          returnType: $('s2jReturnType').value
        });
      }
      $('s2jConvert').addEventListener('click', postSqlToJavaConvert);
      $('s2jFormatSql').addEventListener('click', function () {
        post({ op: 'sql-to-java-format', text: $('s2jInput').value });
      });
      $('s2jClearInput').addEventListener('click', function () {
        $('s2jInput').value = '';
      });
      $('s2jCopy').addEventListener('click', function () {
        var code = $('s2jOutput').value;
        if (code) { post({ op: 'copy-text', tab: 'sqlToJava', text: code }); }
      });
      $('s2jClearResult').addEventListener('click', function () {
        post({ op: 'sql-to-java-clear' });
      });
      $('s2jFormatMode').addEventListener('change', updateSqlToJavaOptionHint);
      $('s2jCaller').addEventListener('input', updateSqlToJavaOptionHint);
      $('s2jReturnType').addEventListener('input', updateSqlToJavaOptionHint);
      $('s2jInput').addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          postSqlToJavaConvert();
        }
      });

      // Vertical editor splitters (the reference uses a Splitter for both input
      // tabs; the preview tab's pointer-drag pattern is reused here).
      function bindEditorSplitter(splitterId, panelId, topSelector) {
        var splitter = $(splitterId);
        var panel = $(panelId);
        if (!splitter || !panel) { return; }
        var top = panel.querySelector(topSelector);
        var dragging = false;
        function fraction() {
          var rect = panel.getBoundingClientRect();
          if (!top || rect.height <= 0) { return 0.42; }
          return top.getBoundingClientRect().height / rect.height;
        }
        function setFraction(value) {
          if (!top) { return; }
          var clamped = Math.min(0.8, Math.max(0.15, value));
          top.style.flexBasis = (clamped * 100) + '%';
        }
        splitter.addEventListener('pointerdown', function (event) {
          dragging = true;
          splitter.classList.add('dragging');
          if (splitter.setPointerCapture) { splitter.setPointerCapture(event.pointerId); }
          event.preventDefault();
        });
        splitter.addEventListener('pointermove', function (event) {
          if (!dragging) { return; }
          var rect = panel.getBoundingClientRect();
          if (rect.height > 0) { setFraction((event.clientY - rect.top) / rect.height); }
        });
        function stop(event) {
          if (!dragging) { return; }
          dragging = false;
          splitter.classList.remove('dragging');
          if (splitter.releasePointerCapture && event.pointerId !== undefined) {
            try {
              splitter.releasePointerCapture(event.pointerId);
            } catch (error) {
              /* the capture was already released */
            }
          }
        }
        splitter.addEventListener('pointerup', stop);
        splitter.addEventListener('pointercancel', stop);
        splitter.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') { return; }
          setFraction(fraction() + (event.key === 'ArrowDown' ? 0.02 : -0.02));
          event.preventDefault();
        });
      }
      bindEditorSplitter('l2sSplitter', 'panelLogToSql', '.p-top');
      bindEditorSplitter('s2jSplitter', 'panelSqlToJava', '.p-top');
      $('histSearchBtn').addEventListener('click', function () {
        post({ op: 'history', keyword: $('histKw').value });
      });
      $('histKw').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); $('histSearchBtn').click(); }
      });
      $('histBackBtn').addEventListener('click', function () {
        post({ op: 'history-back' });
      });
      $('histRefreshBtn').addEventListener('click', function () {
        post({ op: 'history-refresh' });
      });
      $('histScrollBtn').addEventListener('click', function () {
        var list = historyTab.level === 'entries' ? $('histEntries') : $('histFiles');
        list.scrollTop = list.scrollHeight;
      });
      $('histPreviewBtn').addEventListener('click', function () {
        post({ op: 'history-preview-toggle', on: !historyTab.preview });
      });
      $('histMenu').addEventListener('click', function (event) {
        var item = event.target.closest('[data-hact]');
        if (!item || !histSelected) { return; }
        var line = parseInt(histSelected.dataset.line, 10);
        var act = item.getAttribute('data-hact');
        if (act === 'copy') { post({ op: 'history-copy', line: line }); }
        else if (act === 'preview') { post({ op: 'history-open', line: line }); }
        else if (act === 'jump-java') { post({ op: 'history-jump-java', line: line }); }
        else if (act === 'jump-xml') { post({ op: 'history-jump-xml', line: line }); }
        closeHistoryMenu();
      });
      document.addEventListener('click', function (event) {
        if (!$('histMenu').hidden && !event.target.closest('#histMenu')) {
          closeHistoryMenu();
        }
      });

      $('typeBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        openTypeMenu($('typeMenu').hidden);
      });
      $('typeMenu').addEventListener('click', function (event) { event.stopPropagation(); });
      $('slowOnly').addEventListener('change', function () { ui.slowOnly = this.checked; postFilter(); });
      $('selectAll').addEventListener('click', function () {
        for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = true; }
        syncTypeCheckboxes(); updateTypeButton(); postFilter();
      });
      $('selectNone').addEventListener('click', function () {
        for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = false; }
        syncTypeCheckboxes(); updateTypeButton(); postFilter();
      });

      $('searchBtn').addEventListener('click', function () {
        var row = $('searchRow');
        row.hidden = !row.hidden;
        $('searchBtn').classList.toggle('on', !row.hidden);
        if (!row.hidden) { $('kw').focus(); }
      });
      $('kw').addEventListener('input', function () { ui.keyword = this.value; scheduleFilter(); });
      $('kw').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); if (kwTimer) { clearTimeout(kwTimer); kwTimer = null; } postFilter(); }
      });
      $('caseBtn').addEventListener('click', function () { ui.matchCase = !ui.matchCase; this.classList.toggle('on', ui.matchCase); postFilter(); });
      $('regexBtn').addEventListener('click', function () { ui.regex = !ui.regex; this.classList.toggle('on', ui.regex); postFilter(); });
      $('clearBtn').addEventListener('click', function () { post({ op: 'clear' }); });

      // Toolbar actions (lane L26). "Capture is on" is connected *or* waiting
      // for the target application (lane A), so a second click while waiting
      // cancels the start instead of dialing again.
      $('captureBtn').addEventListener('click', function () {
        var s = (current && current.status) || {};
        var active = !!(s.agent_connected || s.capture_waiting);
        post({ op: active ? 'capture-stop' : 'capture-start' });
      });
      $('scrollEndBtn').addEventListener('click', function () {
        follow = true;
        $('list').scrollTop = $('list').scrollHeight;
        post({ op: 'scroll-end' });
      });
      $('sortBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        renderSortMenu();
        openSortMenu($('sortMenu').hidden);
      });
      // One radio item per mode: picking one applies it and closes the popup.
      $('sortMenu').addEventListener('click', function (event) {
        event.stopPropagation();
        var item = event.target.closest('[data-sort]');
        if (!item) { return; }
        var next = item.getAttribute('data-sort');
        openSortMenu(false);
        if (next && next !== sortMode) {
          sortMode = next;
          post({ op: 'sort', sort: sortMode });
        }
        renderSortMenu();
      });
      // The eye-off action opens the modal suppression-rule manager (lane E);
      // it has no popup of its own.
      $('blockedBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        post({ op: 'manage-suppress' });
      });
      // In-panel sheets (L2): the gear, the community entry and the help entry
      // open their overlay and keep posting the existing op, so the Output
      // channel still records the request for anyone reading it.
      $('sheetClose').addEventListener('click', closeSheet);
      $('sheetBackdrop').addEventListener('click', closeSheet);
      $('settingsBtn').addEventListener('click', function (event) {
        event.stopPropagation();
        openSheet('settings');
        post({ op: 'settings' });
      });
      $('helpBtn').addEventListener('click', function () {
        openSheet('help');
        post({ op: 'help' });
      });
      $('communityBtn').addEventListener('click', function () {
        openSheet('community');
        post({ op: 'community' });
      });
      // Quick preview (L32, L42): the selected row is handed to the preview
      // workbench as a cross-view message — the panel names the line, the host
      // resolves it and `preview_target()` decides where it lands, so neither
      // side hard-codes the channel. Sending the line (not the SQL) keeps the
      // parsed log rows the single source. With nothing selected only the tab
      // comes forward, over the same boundary.
      $('previewBtn').addEventListener('click', function () {
        if (selectedLine != null) {
          post({ op: 'preview-send', line: selectedLine, selectTab: true });
        } else {
          post({ op: 'preview-send', selectTab: true });
        }
      });

      // Follow (lane L26): scrolling away from the bottom pauses it, scrolling
      // back restores it; the host mirrors the flag for the status line.
      $('list').addEventListener('scroll', function () {
        if (suppressScroll) { suppressScroll = false; return; }
        var bottom = atBottom();
        if (bottom && !follow) {
          follow = true;
          post({ op: 'follow', follow: true });
        } else if (!bottom && follow) {
          follow = false;
          post({ op: 'follow', follow: false });
        }
      });

      $('dedupe').addEventListener('change', function () { ui.dedupe = this.checked; postFilter(); });

      $('ctxMenu').addEventListener('click', function (event) {
        var target = event.target && event.target.closest ? event.target.closest('[data-act]') : null;
        var act = target && target.getAttribute('data-act');
        if (!act) { return; }
        if (target.disabled) { return; }
        var row = ctxRow;
        if (act === 'copy-sql') { post({ op: 'copy-line', line: ctxLine }); }
        else if (act === 'copy-time') { post({ op: 'copy-time', line: ctxLine }); }
        else if (act === 'export') { post({ op: 'export' }); }
        else if (act === 'jump-java') { post({ op: 'jump-java', line: ctxLine }); }
        else if (act === 'jump-xml') { post({ op: 'jump-xml', line: ctxLine }); }
        else if (act === 'focus-method' && row) { setFocus('method', row.focus_key); }
        else if (act === 'focus-request' && row) { setFocus('request', row.request_id); }
        else if (act === 'focus-template' && row) { setFocus('template', row.n_plus_one_key); }
        else if (act === 'send-sql-to-java') { post({ op: 'send-to-tab', tab: 'sqlToJava', line: ctxLine }); }
        else if (act === 'send-log-to-sql') { post({ op: 'send-to-tab', tab: 'logToSql', line: ctxLine }); }
        else if (act === 'delete-line') { post({ op: 'delete-line', line: ctxLine }); }
        else if (act === 'block-method') { post({ op: 'block-method', line: ctxLine }); }
        else if (act === 'suppress-sql') { post({ op: 'suppress-sql', line: ctxLine }); }
        closeCtx();
      });

      document.addEventListener('click', function () { openTypeMenu(false); openSortMenu(false); closeCtx(); });
      document.addEventListener('keydown', function (event) {
        // Ctrl+Tab / Ctrl+Shift+Tab cycle the four tabs. The IDE may consume
        // this chord before the page sees it; the mouse always works.
        var isCycle = (event.ctrlKey || event.metaKey) && event.key === 'Tab';
        if (isCycle) {
          event.preventDefault();
          cycleTab(event.shiftKey ? -1 : 1);
          return;
        }
        var isFind = (event.ctrlKey || event.metaKey) && (event.key === 'f' || event.key === 'F');
        if (isFind) {
          event.preventDefault();
          $('searchRow').hidden = false;
          $('searchBtn').classList.add('on');
          $('kw').focus();
          $('kw').select();
          return;
        }
        if (event.key === 'Escape') {
          if (!$('sheet').hidden) { closeSheet(); return; }
          if (!$('ctxMenu').hidden) { closeCtx(); return; }
          if (!$('sortMenu').hidden) { openSortMenu(false); return; }
          if (!$('typeMenu').hidden) { openTypeMenu(false); return; }
          if (!$('searchRow').hidden) {
            $('searchRow').hidden = true;
            $('searchBtn').classList.remove('on');
          }
        }
      });

      if (window.openidea && window.openidea.onMessage) {
        window.openidea.onMessage(function (raw) {
          try {
            var message = JSON.parse(raw);
            if (message.op === 'state') { applyState(message); }
          } catch (error) { /* ignore malformed */ }
        });
      }
      // The fifth tab's workbench (lane L42): one module, mounted here. Its ops
      // go out through this page's own `post`, so a single `openidea` handle
      // serves both halves of the panel.
      var preview = mountPreview($('panelPreview'), { post: post });

      selectTab('logs', false);
      post({ op: 'ready' });
    })();
  </script>
</body>
</html>
