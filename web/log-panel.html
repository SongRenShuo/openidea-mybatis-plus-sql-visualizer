<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Visualizer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font: var(--openidea-font-size, 13px)/1.4 var(--openidea-font-ui, sans-serif);
      color: var(--openidea-fg);
      background: var(--openidea-bg);
    }

    /* Action row (the host draws no toolbar for a packaged page). Icon buttons
       the way an IDE toolbar draws them: a 24×24 hit area around a 16×16
       inline SVG, hover showing a 3px-radius plate. The SVG paths are the
       Apache-2.0 icons under icons/toolbar/, recoloured with currentColor so
       the host theme decides the ink. */
    .actionbar {
      display: flex; align-items: center; gap: 2px; flex: 0 0 auto;
      padding: 3px 6px; border-bottom: 1px solid var(--openidea-border);
      /* Anchors the blocked-methods popup (L26), which drops from a button. */
      position: relative;
    }
    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; flex: 0 0 auto;
      background: transparent; border: 1px solid transparent; border-radius: 3px;
      color: var(--openidea-fg-muted); cursor: pointer;
    }
    .iconbtn:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .iconbtn:focus-visible { border-color: var(--openidea-accent); outline: none; }
    .iconbtn.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); }
    .iconbtn.run { color: var(--openidea-success); }
    .iconbtn svg { width: 16px; height: 16px; display: block; fill: none; }
    /* Toolbar layout (L32): the icon actions on the left, then a spacer so the
       slow count, the SQL-type selector and the dedupe box keep their width at
       the right edge, the way the reference toolbar draws them. No `overflow`
       anywhere on this row: the popups drop out of it. */
    .actionbar .spacer { margin-left: auto; }
    .actionbar .rightgroup {
      display: flex; align-items: center; gap: 8px;
      position: relative; flex: 0 0 auto;
    }
    /* A popup drops from the button that opened it, not from the row's edge. */
    .menuanchor { position: relative; display: inline-flex; flex: 0 0 auto; }
    /* The type menu hangs off the right edge of the panel, so it never runs off
       a narrow window (the selector itself sits at the right edge). */
    #typeMenu { left: auto; right: 0; }
    /* Menu entries that are real buttons (the settings popup): a .menu-item
       reset onto a <button>. */
    button.menu-item {
      display: flex; width: 100%; align-items: center; gap: 6px;
      background: none; border: none; color: var(--openidea-fg);
      font: inherit; font-size: 12px; text-align: left; cursor: pointer;
    }
    button.menu-item svg {
      width: 14px; height: 14px; display: block; flex: 0 0 auto;
      color: var(--openidea-fg-muted);
    }
    button.menu-item.on { background: var(--openidea-bg-selected); }
    button.menu-item.on svg { color: var(--openidea-success); }

    /* Active-filter row (L32): the toolbar now owns the type selector and the
       dedupe box, so this row only carries what actually narrows the list —
       the focus chip and the muted-method counter. It hides itself when both
       are empty instead of leaving a bare 1px rule under the toolbar. */
    .filterbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
      flex: 0 0 auto;
    }
    /* Type selector: an IDE "chip" — small icon, current value, caret. */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px;
      background: transparent; color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 11px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .chip:hover { background: var(--openidea-bg-hover); }
    .chip[aria-expanded="true"] { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .chip svg { width: 12px; height: 12px; display: block; color: var(--openidea-fg-muted); fill: none; }
    /* Focus / muted chips in the filter row (lane L28). A focus chip is the
       active filter and carries an × that clears it; the muted counter does the
       same for the session's muted methods. Both stay in the left flow. */
    .chips { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
    .fchip {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; max-width: 260px; padding: 0 4px 0 8px;
      background: var(--openidea-bg-selected); color: var(--openidea-fg-strong);
      border: 1px solid var(--openidea-accent); border-radius: 11px;
      font-size: 12px; white-space: nowrap;
    }
    .fchip .ftext { overflow: hidden; text-overflow: ellipsis; }
    .fchip .fclose {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; padding: 0; flex: 0 0 auto;
      background: none; border: none; border-radius: 8px;
      color: var(--openidea-fg-muted); cursor: pointer; font-size: 12px; line-height: 1;
    }
    .fchip .fclose:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    /* Text buttons follow an IDE toolbar button: flat, icon + label, one line.
       They used to be bordered form buttons, which read as a settings page
       rather than the reference's action bar. */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; color: var(--openidea-fg);
      border: 1px solid transparent; border-radius: 3px;
      padding: 2px 7px; min-height: 24px; cursor: pointer;
      font-size: 12px; white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; fill: none; }
    /* Icon-only, like the reference's ActionToolbar. The label stays in the DOM
       for setText but is not drawn; title/aria-label carry it on hover. */
    .btn [data-btnlabel] { display: none; }
    select.btn {
      background: var(--openidea-bg-input); border-color: var(--openidea-border);
      padding: 2px 4px;
    }
    .btn:hover { background: var(--openidea-bg-hover); }
    .btn.on { background: var(--openidea-bg-selected); border-color: var(--openidea-accent); }
    .caret { color: var(--openidea-fg-muted); font-size: 9px; line-height: 1; }
    .chk {
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; user-select: none; white-space: nowrap; font-size: 12px;
    }

    /* Type popup */
    .menu {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 30;
      min-width: 210px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .menu-item {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .menu-item:hover { background: var(--openidea-bg-hover); }
    .menu-sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    .menu-footer { display: flex; justify-content: space-between; padding: 2px 4px; }
    .linkbtn {
      background: none; border: none; color: var(--openidea-link);
      cursor: pointer; padding: 2px 4px; font-size: 12px;
    }
    .linkbtn:hover { text-decoration: underline; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; flex: 0 0 auto; }

    /* Search row */
    .searchrow {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-bottom: 1px solid var(--openidea-border);
    }
    .kw {
      flex: 1 1 auto; min-width: 80px;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px; padding: 2px 6px;
    }
    .tog {
      background: var(--openidea-bg-input); color: var(--openidea-fg-muted);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 2px 6px; cursor: pointer; font-family: var(--openidea-font-mono, monospace);
    }
    .tog.on { background: var(--openidea-bg-selected); color: var(--openidea-fg-strong); border-color: var(--openidea-accent); }
    .muted { color: var(--openidea-fg-muted); }
    .danger { color: var(--openidea-danger); }
    /* Badge chips the way the IDE draws tags: a 8px-radius capsule at 10px
       whose fill is the semantic colour mixed 16% into the row background.
       color-mix keeps the host variable as the single colour source; the
       plain declaration above it is the fallback for engines without it. */
    .badge {
      display: inline-flex; align-items: center; height: 15px; padding: 0 6px;
      border-radius: 8px; font-size: 10px; line-height: 1;
      color: var(--openidea-fg); white-space: nowrap;
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-fg-muted) 16%, transparent);
    }
    .badge.group {
      color: var(--openidea-warning);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-warning) 16%, transparent);
    }
    .badge.n1 {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }
    /* The ⨉N / ×N badges are clickable buttons (lane L26): a button reset on
       the capsule, so the group expands / collapses on click. */
    button.badge {
      background: none; border: none; cursor: pointer; font: inherit;
    }
    button.badge:hover { filter: brightness(1.15); }
    /* A row that belongs to an expanded group (lane L26): indented under its
       head, each occurrence showing its own time and duration. */
    .row .content.member { padding-left: 22px; }
    .row .content.member .meta { color: var(--openidea-fg-muted); }
    /* Right-aligned counter capsule in the filter row. */
    .pill {
      display: inline-flex; align-items: center; height: 16px; padding: 0 8px;
      border-radius: 8px; font-size: 10px; line-height: 1; white-space: nowrap;
    }
    .pill.danger {
      color: var(--openidea-danger);
      background: var(--openidea-bg-selected);
      background: color-mix(in srgb, var(--openidea-danger) 16%, transparent);
    }

    /* List — one JBList-style row per statement: a 3px type bar, a muted
       metadata line and the statement itself, separated by 1px rules. */
    .list { flex: 1 1 auto; overflow: auto; }
    .row {
      display: flex; align-items: stretch; min-height: 40px;
      border-bottom: 1px solid var(--openidea-border); cursor: default;
    }
    .row:hover { background: var(--openidea-bg-hover); }
    .row.sel { background: var(--openidea-bg-selected); }
    .row .bar { width: 3px; flex: 0 0 3px; }
    .row .content { flex: 1 1 auto; min-width: 0; padding: 5px 8px; }
    /* The metadata line is a plain left-to-right flow, the way the reference
       panel draws it: #seq, time, duration, [db], (rows), ⨉N, ×N, N+1,
       [file:line], [Class#method]. Nothing is pushed to the right — the only
       right-aligned element of the panel is the "slow" capsule in the filter
       row (`#slowBadge { margin-left: auto }`). */
    .meta {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 8px; font-size: 11px; color: var(--openidea-fg-muted);
    }
    .meta .seq { color: var(--openidea-fg-strong); font-weight: 600; font-family: var(--openidea-font-mono, monospace); }
    .meta .time, .meta .dur { font-family: var(--openidea-font-mono, monospace); }
    .meta .dur.hot { color: var(--openidea-warning); font-weight: 600; }
    .meta .part { white-space: nowrap; }
    /* Provenance parts that filter on click (lane L28): the class#method and the
       request id behave like links without losing the row's own click. */
    .meta .focusable { cursor: pointer; }
    .meta .focusable:hover { color: var(--openidea-link); text-decoration: underline; }
    .meta .focusable.on { color: var(--openidea-link); font-weight: 600; }
    .sql {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; line-height: 1.4;
      white-space: pre-wrap; word-break: break-word; color: var(--openidea-fg);
    }
    /* The folded-lines counter (`… (+N)`) is muted so it never competes with the
       statement itself (L32). */
    .sql .sqlTail { color: var(--openidea-fg-muted); }
    .err {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--openidea-danger);
    }
    .empty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      color: var(--openidea-fg-muted); padding: 16px;
    }

    /* Bottom status: one muted 11px line, segments separated by a middot. */
    .status {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0;
      padding: 3px 8px; border-top: 1px solid var(--openidea-border);
      font-size: 11px; color: var(--openidea-fg-muted);
      background: var(--openidea-bg-elevated);
    }
    .status #statusMid::before, .status #statusRight::before {
      content: '\00b7'; margin: 0 8px; opacity: 0.7;
    }
    /* An empty segment draws no separator (L32): the enhanced-channel state is
       only named while that channel is on. */
    .status #statusMid:empty::before, .status #statusRight:empty::before {
      content: none; margin: 0;
    }

    /* Context menu */
    .ctxmenu {
      position: fixed; z-index: 50; min-width: 160px; padding: 4px;
      background: var(--openidea-bg-elevated); border: 1px solid var(--openidea-border);
      border-radius: 4px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .ctxmenu button {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--openidea-fg); padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    .ctxmenu button:hover { background: var(--openidea-bg-hover); }
    /* A row that does not state the dimension gets a disabled item, never a
       guessed target (lane L28). */
    .ctxmenu button[disabled] { color: var(--openidea-fg-muted); opacity: 0.55; cursor: default; }
    .ctxmenu button[disabled]:hover { background: none; }
    .ctxmenu .sep { height: 1px; background: var(--openidea-border); margin: 4px 2px; }
    /* Tab strip (L32): the new-UI **underline** tabs, not JBTabs cards. Every
       tab is a borderless label sitting on the strip's 1px rule; the selected
       one wears a 2px accent underline instead of a raised page. Tabs shrink
       until the labels stop being readable and only then overflow: a ~320px
       panel still shows all five, a narrower one scrolls and `selectTab`
       brings the active tab into view. */
    .tabstrip {
      display: flex; align-items: stretch; flex: 0 0 auto;
      min-height: 32px; padding: 0 4px;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      border-bottom: 1px solid var(--openidea-border);
      background: var(--openidea-bg);
    }
    .tab {
      flex: 0 1 auto; min-width: 60px; height: 32px; padding: 0 10px; margin-right: 2px;
      overflow: hidden; text-overflow: ellipsis;
      background: transparent; border: none; border-bottom: 2px solid transparent;
      font-size: 12px; color: var(--openidea-fg-muted); cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { background: var(--openidea-bg-hover); color: var(--openidea-fg); }
    .tab.active {
      background: transparent;
      border-bottom-color: var(--openidea-accent);
      color: var(--openidea-fg-strong);
    }

    /* One panel per tab; only the selected one is visible */
    .panel {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; min-width: 0;
    }

    /* Tab body of the history tab; the two input tabs (L33) use the split
       layout further down. */
    .tabbody {
      flex: 1 1 auto; overflow: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px; min-height: 0;
    }
    .code {
      margin: 0; padding: 6px; border-radius: 3px;
      background: var(--openidea-bg-input); border: 1px solid var(--openidea-border);
      color: var(--openidea-fg); font-family: var(--openidea-font-mono, monospace);
      white-space: pre-wrap; word-break: break-word; font-size: 12px;
    }
    .tabactions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .tabactions .spacer { margin-left: auto; }
    .tabempty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      color: var(--openidea-fg-muted); padding: 16px 8px; text-align: center;
    }
    .btn[disabled] { opacity: 0.5; cursor: default; }
    /* SQL history: the reference's two-level panel (file list, then the file's
       statements) with the toolbar above and the docked quick preview below. */
    #panelHistory { position: relative; }
    .histbody { overflow: hidden; }
    .histtoolbar { flex: 0 0 auto; flex-wrap: nowrap; gap: 2px; }
    .histtoolbar .kw { flex: 1 1 auto; min-width: 60px; }
    .histfiles, .histentries {
      flex: 1 1 auto; overflow: auto; min-height: 0;
      border-top: 1px solid var(--openidea-border);
    }
    .histfile {
      display: flex; align-items: baseline; gap: 8px;
      padding: 5px 8px; cursor: pointer;
      border-bottom: 1px solid var(--openidea-border);
    }
    .histfile:hover { background: var(--openidea-bg-hover); }
    .histfile.selected { background: var(--openidea-bg-selected); }
    .histfile .hname {
      flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .histfile .hmeta { flex: 0 0 auto; color: var(--openidea-fg-muted); font-size: 11px; }
    .histentry {
      padding: 5px 8px; cursor: pointer;
      border-bottom: 1px solid var(--openidea-border);
    }
    .histentry:hover { background: var(--openidea-bg-hover); }
    .histentry.selected { background: var(--openidea-bg-selected); }
    .histentry .hhead {
      display: flex; align-items: baseline; gap: 8px;
      color: var(--openidea-fg-muted); font-size: 11px;
      white-space: nowrap; overflow: hidden;
    }
    .histentry .hhead .loc {
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .histentry .hsql {
      margin-top: 2px; font-family: var(--openidea-font-mono, monospace);
      font-size: 12px; color: var(--openidea-fg);
      white-space: pre-wrap; word-break: break-word;
    }
    .histentry .hsql mark {
      background: color-mix(in srgb, var(--openidea-warning) 35%, transparent);
      color: inherit;
    }
    .histpreview {
      flex: 0 0 32%; min-height: 0; overflow: auto;
      margin: 6px 8px 8px; background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
    }
    .histpreview pre {
      margin: 0; padding: 6px 8px;
      font-family: var(--openidea-font-mono, monospace); font-size: 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    .histmenu { position: absolute; right: 8px; top: 38px; z-index: 40; }

    /* L33: the two input tabs — a vertical editor split (input on top, result
       below), a toolbar per pane and one status line under both. Everything is
       scoped to the two panels so the log list's own rules stay untouched. */
    #panelLogToSql, #panelSqlToJava {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; min-width: 0;
    }
    #panelLogToSql .editorpane, #panelSqlToJava .editorpane {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    #panelLogToSql .editorpane.p-top, #panelSqlToJava .editorpane.p-top { flex: 0 0 50%; }
    #panelLogToSql .editorpane.p-bottom, #panelSqlToJava .editorpane.p-bottom { flex: 1 1 auto; }
    #panelLogToSql .editorbar, #panelSqlToJava .editorbar {
      display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 4px 8px 2px;
    }
    #panelLogToSql .tabhint, #panelSqlToJava .tabhint {
      padding: 0 8px 4px; color: var(--openidea-fg-muted); font-size: 11px;
    }
    #panelLogToSql .editorarea, #panelSqlToJava .editorarea {
      flex: 1 1 auto; min-height: 0; margin: 0 8px 8px; padding: 6px 8px; resize: none;
      color: var(--openidea-fg); background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-mono, monospace);
      white-space: pre; overflow: auto;
    }
    #panelLogToSql .editorsplit, #panelSqlToJava .editorsplit {
      flex: 0 0 6px; cursor: row-resize; background: var(--openidea-border); opacity: 0.6;
    }
    #panelLogToSql .editorsplit:hover, #panelLogToSql .editorsplit.dragging,
    #panelSqlToJava .editorsplit:hover, #panelSqlToJava .editorsplit.dragging {
      background: var(--openidea-accent); opacity: 1;
    }
    #panelLogToSql .statusline, #panelSqlToJava .statusline {
      flex: 0 0 auto; padding: 4px 8px; border-top: 1px solid var(--openidea-border);
      color: var(--openidea-fg-muted); font-size: 11px; white-space: pre-wrap;
    }
    #panelLogToSql .statusline.error, #panelSqlToJava .statusline.error {
      color: var(--openidea-danger);
    }
    #panelSqlToJava .optionsrow {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 8px 6px;
    }
    #panelSqlToJava .optionsrow label {
      color: var(--openidea-fg-muted); font-size: 11px;
    }
    #panelSqlToJava .optselect, #panelSqlToJava .optinput {
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      padding: 2px 4px; font-size: 12px;
    }
    #panelSqlToJava .optselect { flex: 0 0 auto; }
    #panelSqlToJava .optinput { flex: 0 1 120px; min-width: 70px; }

    /* Fifth tab: the preview workbench (L23). Everything is scoped to
       #panelPreview so the log list's own .meta / .badge / .status rules keep
       working untouched. */
    #panelPreview .pv-pane {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    #panelPreview .pv-pane.pv-top { flex: 0 0 34%; }
    #panelPreview .pv-pane.pv-preview { flex: 1 1 auto; }
    /* The reference puts the meta line and the toolbar on one row (meta left,
       actions right). Grid keeps that without a wrapper element: meta and the
       result toolbar share row 1, the banner spans row 2, the columns fill 3. */
    #panelPreview .pv-preview {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    #panelPreview .pv-meta { grid-column: 1; grid-row: 1; min-width: 0; }
    /* One line, like the reference's meta row: the long settings hint shrinks
       with an ellipsis instead of wrapping into a tall column. */
    #panelPreview .pv-meta { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
    #panelPreview .pv-meta > * { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panelPreview .pv-meta .pv-chip { flex: 0 0 auto; }
    #panelPreview .pv-preview > .pv-toolbar {
      grid-column: 2; grid-row: 1; justify-content: flex-end; flex-wrap: nowrap;
    }
    #panelPreview .pv-banner { grid-column: 1 / -1; grid-row: 2; }
    #panelPreview .pv-cols { grid-column: 1 / -1; grid-row: 3; }
    #panelPreview .pv-toolbar {
      display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 4px 8px;
    }
    /* The reference's "更多" fold (L35b): the low-frequency actions the
       toolbar would otherwise duplicate — Export, Rollback — behind one
       button, the way `panel.more` folds them in the IntelliJ edition. */
    #panelPreview .pv-more-wrap { position: relative; display: inline-flex; }
    #panelPreview .pv-more-menu {
      position: absolute; top: 100%; right: 0; z-index: 20; margin-top: 2px;
      display: flex; flex-direction: column; min-width: 120px; padding: 2px;
      border: 1px solid var(--openidea-border); border-radius: 3px;
      background: var(--openidea-bg-elevated);
    }
    #panelPreview .pv-more-item,
    .histmenu .pv-more-item {
      padding: 3px 8px; background: transparent; border: none; border-radius: 2px;
      cursor: pointer; text-align: left; color: var(--openidea-fg); font-size: 12px;
      display: block; width: 100%;
    }
    #panelPreview .pv-more-item:hover,
    .histmenu .pv-more-item:hover { background: var(--openidea-bg-selected); }
    #panelPreview .pv-more-item:disabled,
    .histmenu .pv-more-item:disabled { color: var(--openidea-fg-muted); cursor: default; }
    #panelPreview .hint { padding: 0 8px 4px; color: var(--openidea-fg-muted); }
    #panelPreview #pvInput {
      flex: 1 1 auto; min-height: 0; margin: 0 8px 8px; padding: 6px 8px; resize: none;
      color: var(--openidea-fg); background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border); border-radius: 3px;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-mono, monospace);
    }
    #panelPreview .pv-splitter {
      flex: 0 0 6px; cursor: row-resize; background: var(--openidea-border); opacity: 0.6;
    }
    #panelPreview .pv-splitter:hover, #panelPreview .pv-splitter.dragging {
      background: var(--openidea-accent); opacity: 1;
    }
    #panelPreview .pv-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 8px;
    }
    #panelPreview .pv-chip {
      padding: 0 6px; border: 1px solid var(--openidea-border);
      border-radius: 3px; white-space: nowrap;
    }
    #panelPreview .pv-badge {
      padding: 0 6px; border-radius: 3px;
      background: var(--openidea-bg-selected); font-size: 11px;
    }
    #panelPreview .pv-badge.partial { color: var(--openidea-warning); }
    #panelPreview .pv-badge.unresolved { color: var(--openidea-danger); }
    #panelPreview .pv-advice { font-size: 11px; }
    /* Degradation banner (L35b): the reference's non-modal honesty strip, worn
       just under the toolbar while a render is `unresolved`. It sits outside
       `.pv-cols` so it never steals width from the two columns. */
    #panelPreview .pv-banner {
      display: flex; align-items: flex-start; gap: 6px; margin: 0 8px 4px;
      padding: 4px 6px; border-radius: 3px;
      border: 1px solid var(--openidea-border); background: var(--openidea-bg-elevated);
      color: var(--openidea-danger); font-size: 11px;
    }
    #panelPreview .pv-banner-text {
      flex: 1 1 auto; min-width: 0; white-space: pre-wrap; word-break: break-word;
    }
    #panelPreview .pv-banner-close {
      flex: 0 0 auto; padding: 0 4px; background: transparent; border: none;
      cursor: pointer; color: var(--openidea-fg-muted); font-size: 12px;
    }
    #panelPreview .pv-banner-close:hover { color: var(--openidea-fg); }
    #panelPreview .pv-cols {
      display: flex; flex: 1 1 auto; min-height: 0;
      border-top: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-params {
      flex: 0 0 34%; display: flex; flex-direction: column;
      min-width: 150px; min-height: 0; border-right: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-pane-title { padding: 4px 8px 2px; font-weight: 600; }
    /* Editable parameter values (lane L27, laid out as two columns in L35b):
       name on the left, value input on the right, top aligned like the
       reference's parameter pane; Rebind / Import sit under the list. */
    #panelPreview .pv-params-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 2px 0 4px; }
    #panelPreview .pv-params .hint { font-size: 10.5px; line-height: 1.45; }
    #panelPreview .pv-param-row {
      display: grid; grid-template-columns: minmax(48px, 38%) minmax(0, 1fr);
      align-items: start; gap: 6px; margin-bottom: 4px;
    }
    #panelPreview .pv-param-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--openidea-fg-muted); font-family: var(--openidea-font-mono, monospace);
      font-size: 11px;
    }
    #panelPreview .pv-param-input {
      flex: 1 1 auto; min-width: 0;
      background: var(--openidea-bg-input); color: var(--openidea-fg);
      border: 1px solid var(--openidea-border); border-radius: 3px; padding: 2px 4px;
      font-family: var(--openidea-font-mono, monospace); font-size: 12px;
    }
    #panelPreview .pv-params-empty { color: var(--openidea-fg-muted); font-size: 11px; }
    #panelPreview .pv-scroll { flex: 1 1 auto; overflow: auto; padding: 4px 8px 8px; }
    #panelPreview .pv-sqlside {
      flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }
    #panelPreview .pv-tabs {
      display: flex; gap: 2px; padding: 4px 8px 0;
      border-bottom: 1px solid var(--openidea-border);
    }
    #panelPreview .pv-tab {
      padding: 3px 12px; background: transparent; border: 1px solid transparent;
      border-bottom: none; border-radius: 3px 3px 0 0; cursor: pointer;
      color: var(--openidea-fg-muted); font-size: 12px;
    }
    #panelPreview .pv-tab:hover { color: var(--openidea-fg); }
    #panelPreview .pv-tab[aria-selected="true"] {
      background: var(--openidea-bg-elevated); border-color: var(--openidea-border);
      color: var(--openidea-fg-strong);
    }
    #panelPreview .pv-tabbody {
      flex: 1 1 auto; min-height: 0; margin: 0; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      border: none; border-radius: 0; background: transparent;
    }
    #panelPreview .pv-footer {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-top: 1px solid var(--openidea-border);
    }
    #panelPreview #pvStatus {
      flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    [hidden] { display: none !important; }
  </style>
</head>

  <script>
    (function () {
      var TYPE_TOKENS = ['select', 'insert', 'update', 'delete', 'create', 'drop'];

        insert: 'var(--openidea-success)',
        update: 'var(--openidea-warning)',
        delete: 'var(--openidea-danger)',
        create: 'var(--openidea-info)',
        drop: 'var(--openidea-accent)',

      var L = {};
      var current = null;
      var selectedLine = null;
      var ctxLine = null;
      var ctxRow = null;
      var typeMenuBuilt = false;
      // Tab strip (L22). Selection is DOM-only: no state request on switch.
      // The fifth tab (L23) is the preview workbench; it is permanent, so the
      // strip never removes an entry.
      var TAB_IDS = ['logs', 'logToSql', 'sqlToJava', 'history', 'preview'];
      var PANELS = {
        logs: 'panelLogs', logToSql: 'panelLogToSql',
        sqlToJava: 'panelSqlToJava', history: 'panelHistory',
        preview: 'panelPreview'
      };
      var activeTab = 'logs';
      // Signature of the rendered log rows: a state push that does not change
      // them must not rebuild the list (scroll and selection survive).
      var rowsSig = null;
      var ui = {
        types: { select: true, insert: true, update: true, delete: true, create: true, drop: true },
        slowOnly: false, dedupe: true, matchCase: false, regex: false, keyword: '',
        // The active focus chip ({kind, value}) or null. It rides the same
        // `filter` op as the other filters (lane L28).
        focus: null
      };
      var kwTimer = null;
      // Follow (L26): whether the list auto-scrolls to the newest row. The
      // page owns the flag and reports flips; the host keeps a mirror for the
      // status line. `suppressScroll` swallows the scroll event a rebuild
      // produces so a re-render does not look like a user scroll.
      var follow = true;
      var suppressScroll = false;
      // Display order (L26): 'time' (capture order) or 'duration'.
      var sortMode = 'time';

      function $(id) { return document.getElementById(id); }
      function post(message) {
        if (window.openidea && window.openidea.postMessage) {
          window.openidea.postMessage(JSON.stringify(message));
        }
      }
      // Text buttons carry an inline icon; only the label span is replaced so
      // the icon survives every state push.
      function setText(node, text) {
        if (!node) { return; }
        var label = node.querySelector('[data-btnlabel]');
        if (label) {
          // Icon-only button: the text becomes the tooltip / accessible name.
          var value = text == null ? '' : text;
          label.textContent = value;
          node.title = value;
          node.setAttribute('aria-label', value);
        }

      }
      function selectedTokens() {
        var out = [];
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          if (ui.types[TYPE_TOKENS[i]]) { out.push(TYPE_TOKENS[i]); }
        }
        return out;
      }
      function typeLabel(token) {
        switch (token) {
          case 'select': return L.typeSelect;
          case 'insert': return L.typeInsert;
          case 'update': return L.typeUpdate;
          case 'delete': return L.typeDelete;
          case 'create': return L.typeCreate;
          case 'drop': return L.typeDrop;
          default: return token;
        }
      }

      function postFilter() {
        var toks = selectedTokens();
        var mode = toks.length === TYPE_TOKENS.length ? 'all' : (toks.length === 0 ? 'none' : 'only');

          slow_only: ui.slowOnly, keyword: ui.keyword,
          match_case: ui.matchCase, regex: ui.regex, dedupe: ui.dedupe,
          focus: ui.focus
        });
      }
      // One chip at a time: setting a different value replaces it, the same value
      // clears it (the reference panel's tab toggles the same way).
      function setFocus(kind, value) {
        if (!value) { return; }
        if (ui.focus && ui.focus.kind === kind && ui.focus.value === value) {
          ui.focus = null;
        } else {

        }
        postFilter();
      }
      function clearFocus() {
        if (!ui.focus) { return; }
        ui.focus = null;
        postFilter();
      }

        if (kwTimer) { clearTimeout(kwTimer); }

      }

          for (var i = 0; i < TYPE_TOKENS.length; i++) { ui.types[TYPE_TOKENS[i]] = true; }
        } else if (f.types_mode === 'none') {
          for (var j = 0; j < TYPE_TOKENS.length; j++) { ui.types[TYPE_TOKENS[j]] = false; }
        } else if (f.types) {
          var set = {};
          for (var k = 0; k < f.types.length; k++) { set[f.types[k]] = true; }
          for (var m = 0; m < TYPE_TOKENS.length; m++) { ui.types[TYPE_TOKENS[m]] = !!set[TYPE_TOKENS[m]]; }
        }

        ui.dedupe = f.dedupe !== false;
        ui.matchCase = !!f.match_case;
        ui.regex = !!f.regex;
        ui.focus = (f.focus && f.focus.kind && f.focus.value)
          ? { kind: f.focus.kind, value: f.focus.value }
          : null;
        if (document.activeElement !== $('kw')) {
          ui.keyword = f.keyword || '';
          $('kw').value = ui.keyword;
        }
        $('slowOnly').checked = ui.slowOnly;
        $('dedupe').checked = ui.dedupe;
        $('caseBtn').classList.toggle('on', ui.matchCase);
        $('regexBtn').classList.toggle('on', ui.regex);
        // Display preferences (L26): the host mirrors the page's last report,
        // so a push never silently changes what the user picked.
        sortMode = (state.sort === 'duration') ? 'duration' : 'time';
        if (state.status && typeof state.status.follow === 'boolean') {
          follow = state.status.follow;
        }

        // (set in updateLabels) stays the action name.

      // screen readers and tooltips still get it.
      function labelIconButton(node, label) {
        if (!node) { return; }
        node.setAttribute('aria-label', label || '');
        node.title = label || '';

      // Focus / muted chips (lane L28) --------------------------------
      function chipButton(label, title, onClose) {
        var chip = document.createElement('span');
        chip.className = 'fchip';

        text.className = 'ftext';

      // The filter row shows what is narrowing the list: one focus chip (with
      // an × that clears it) and the muted-method counter (same ×, clears all).
      function renderFocusChips(state) {
        var host = $('focusChips');
        while (host.firstChild) { host.removeChild(host.firstChild); }
        var focus = (state.filter || {}).focus;
        if (focus && focus.value) {

            ? (L.focusRequestPrefix || 'Request')
            : (focus.kind === 'template'
              ? (L.focusTemplatePrefix || 'Template')
              : (L.focusMethodPrefix || 'Method'));

      function updateTypeButton() {

        else if (toks.length === 0) { text = L.typesNone; }
        else { text = toks.length + ' ' + L.typesCountSuffix; }
        setText($('typeBtnText'), text);
        $('typeBtn').title = L.typesTitle || '';
      }

      function buildTypeMenu() {
        if (typeMenuBuilt) { return; }
        var host = $('typeList');
        for (var i = 0; i < TYPE_TOKENS.length; i++) {
          var token = TYPE_TOKENS[i];
          var label = document.createElement('label');
          label.className = 'menu-item';
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.setAttribute('data-token', token);
          box.checked = !!ui.types[token];
          box.addEventListener('change', function () {
            var t = this.getAttribute('data-token');
            ui.types[t] = this.checked;
            updateTypeButton();
            postFilter();
          });
          var sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = TYPE_COLORS[token] || 'var(--openidea-fg-muted)';
          var text = document.createElement('span');
          text.setAttribute('data-lbl', token);
          text.textContent = typeLabel(token);
          label.appendChild(box);
          label.appendChild(sw);
          label.appendChild(text);

      function syncTypeCheckboxes() {
        var boxes = $('typeList').querySelectorAll('input[data-token]');
        for (var i = 0; i < boxes.length; i++) {
          var t = boxes[i].getAttribute('data-token');
          boxes[i].checked = !!ui.types[t];
        }
        var labels = $('typeList').querySelectorAll('[data-lbl]');
        for (var j = 0; j < labels.length; j++) {
          var tok = labels[j].getAttribute('data-lbl');
          labels[j].textContent = typeLabel(tok);
        }
      }

      function makePart(className, text) {
        var el = document.createElement('span');
        el.className = className;
        el.textContent = text;
        return el;
      }

      // A clickable badge (lane L26): the ⨉N / ×N capsule is a button that
      // toggles its group's expansion; the host owns the expanded set.
      function badgeButton(text, cls, title, onClick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'badge ' + cls;
        button.textContent = text;
        button.title = title || '';
        button.setAttribute('aria-label', title || '');
        button.addEventListener('click', function (event) {
          event.stopPropagation();
          onClick();
        });
        return button;
      }

      // Last path segment, for a `[UserMapper.java:42]` part.
      function baseName(path) {
        if (!path) { return ''; }
        var parts = String(path).split(/[\\/]/);
        return parts[parts.length - 1] || path;
      }

      function buildRow(row, slowThreshold, isMember, dialect) {
        var el = document.createElement('div');
        el.className = 'row';
        el.setAttribute('data-line', String(row.line));

        var bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.background = TYPE_COLORS[row.sql_type] || TYPE_COLORS.other;

        var content = document.createElement('div');
        content.className = 'content';
        // A member of an expanded group (L26) is indented under its head.
        if (isMember) { content.classList.add('member'); }

        var meta = document.createElement('div');
        meta.className = 'meta';
        // The reference header is `#1 [time] 12ms [MySQL · conn] (rows) …`
        // (L32): the sequence bare, the timestamp bracketed, the duration with
        // its unit, and the database badge right after it.
        meta.appendChild(makePart('seq', '#' + row.seq));
        meta.appendChild(makePart('part time', '[' + (row.time || '-') + ']'));
        // Lane L34: `log.showDuration` off drops the whole segment, and with it
        // the slow tint that lives on it — the row still states its category,
        // so nothing else breaks.
        if (showDuration) {
          var dur = document.createElement('span');
          dur.className = 'dur';
          dur.textContent = row.duration_ms == null
            ? '—'
            : formatMs(row.duration_ms) + (L.durationUnit || 'ms');
          if (row.duration_ms != null && slowThreshold != null && row.duration_ms >= slowThreshold) {
            dur.classList.add('hot');
          }
          meta.appendChild(dur);
        }
        var dbText = dbBadge(row.db, dialect);
        if (dbText) { meta.appendChild(makePart('part db', dbText)); }
        if (row.rows_affected != null) {
          meta.appendChild(makePart('part rows', '(' + row.rows_affected + ' ' + (L.rowsSuffix || 'rows') + ')'));
        }
        if (row.dedupe_count > 1) {
          var dedupeText = (L.dedupeBadgePrefix || '') + row.dedupe_count;
          var dedupeTitle = row.expanded ? (L.groupCollapse || '') : (L.groupExpand || '');
          if (row.dedupe_key) {
            meta.appendChild(badgeButton(dedupeText, 'dedupe', dedupeTitle, function () {
              post({ op: 'toggle-group', line: row.line, kind: 'dedupe' });
            }));
          } else {
            meta.appendChild(makePart('badge dedupe', dedupeText));
          }
        }
        if (row.group_count > 1) {
          var groupText = (L.groupBadgePrefix || '') + row.group_count;
          var groupTitle = row.expanded ? (L.groupCollapse || '') : (L.groupExpand || '');
          if (row.n_plus_one_key) {
            meta.appendChild(badgeButton(groupText, 'group', groupTitle, function () {
              post({ op: 'toggle-group', line: row.line, kind: 'group' });
            }));
          } else {
            meta.appendChild(makePart('badge group', groupText));
          }
        }
        if (row.n_plus_one) {
          var n1 = makePart('badge n1', L.nPlusOne || 'N+1');
          meta.appendChild(n1);
        }
        // Provenance (lane L28), last in the left flow: [file:line] then
        // [Class#method], the reference panel's order. A row that stated no
        // source simply has neither part — no placeholder.
        if (row.jump_file && row.jump_line) {
          meta.appendChild(makePart('part src', '[' + baseName(row.jump_file) + ':' + row.jump_line + ']'));
        }
        if (row.class_simple && row.method) {
          var methodPart = makePart('part method focusable', '[' + row.class_simple + '#' + row.method + ']');
          if (ui.focus && ui.focus.kind === 'method' && ui.focus.value === row.focus_key) {
            methodPart.classList.add('on');
          }
          methodPart.title = row.focus_key || '';
          methodPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('method', row.focus_key);
          });
          meta.appendChild(methodPart);
        }
        if (row.request_id) {
          var reqPart = makePart('part req focusable', '[' + row.request_id + ']');
          if (ui.focus && ui.focus.kind === 'request' && ui.focus.value === row.request_id) {
            reqPart.classList.add('on');
          }
          reqPart.title = row.request_id;
          reqPart.addEventListener('click', function (event) {
            event.stopPropagation();
            setFocus('request', row.request_id);
          });
          meta.appendChild(reqPart);
        }
        content.appendChild(meta);

        if (row.sql) {
          var sql = document.createElement('div');
          sql.className = 'sql';
          var fold = foldSql(row.sql);
          sql.appendChild(document.createTextNode(fold.text));
          if (fold.tail) {
            // The dropped-line counter is muted, the way the reference draws
            // `… (+N)` at the end of the third line (L32).
            var tail = document.createElement('span');
            tail.className = 'sqlTail';
            tail.textContent = fold.tail;
            sql.appendChild(tail);
          }
          // The list folds the statement (`sql-lines-3`); the whole of it stays
          // one hover away.
          sql.title = row.sql;
          content.appendChild(sql);
        }
        if (row.error_text) {
          var err = document.createElement('div');
          err.className = 'err';
          err.textContent = row.error_text;
          content.appendChild(err);
        }

        content.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('click', function () { selectLine(row.line); });
        el.addEventListener('dblclick', function () {
          selectLine(row.line);
          if (row.sql) { post({ op: 'open-line', line: row.line }); }
        });
        el.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          selectLine(row.line);
          openCtx(event.clientX, event.clientY, row);
        });

        el.appendChild(bar);
        el.appendChild(content);
        return el;
      }

      function formatMs(ms) {
        if (Math.abs(ms - Math.round(ms)) < 0.001) { return String(Math.round(ms)); }
        return ms.toFixed(1);
      }

      // The database badge (L32). The reference draws `[MySQL · conn-3]`; this
      // build captures no connection name, so it states the engine configured
      // in the settings and appends the database only when the row carries one
      // — it never guesses a connection.
      function dbBadge(db, dialect) {
        var engine = dialect || '';
        var name = db || '';
        if (!engine && !name) { return ''; }
        if (!name) { return '[' + engine + ']'; }
        return '[' + (engine ? engine + ' · ' : '') + name + ']';
      }

      // `sql-lines-3`: the list shows at most three statement lines and states
      // how many it dropped at the end of the third one, the way the reference
      // row ends with `… (+1)`.
      // Lane L34: `logs.displayMode` — one line, no fold, or the reference's
      // three-line cell (`SQL_MAX_LINES`).
      function modeLineLimit(mode) {
        if (mode === 'single') { return 1; }
        if (mode === 'multi') { return 0; }
        return SQL_MAX_LINES;
      }

      function foldSql(text) {
        var lines = String(text || '').split(/\r?\n/);
        // `0` is `multi`: the whole statement, no fold and no tail.
        var limit = sqlLineLimit;
        if (limit <= 0 || lines.length <= limit) {
          return { text: lines.join('\n'), tail: '' };
        }
        var rest = lines.length - limit;
        var shown = lines.slice(0, limit);
        return {
          text: shown.join('\n'),
          tail: ' … (+' + rest + ')'
        };
      }

      function selectLine(line) {
        selectedLine = line;
        var rows = $('list').querySelectorAll('.row');
        for (var i = 0; i < rows.length; i++) {
          if (rows[i].getAttribute('data-line') === String(line)) { rows[i].classList.add('sel'); }
          else { rows[i].classList.remove('sel'); }
        }
        // The two input tabs are standalone panes (L33): selecting a row no
        // longer feeds them, so no state round-trip is asked for here.
      }

      // Lane L26: at the bottom means `scrollTop + clientHeight >= scrollHeight
      // - 4`; the tolerance covers sub-pixel and rounding differences.
      function atBottom() {
        var list = $('list');
        return list.scrollTop + list.clientHeight >= list.scrollHeight - 4;
      }

      function renderList(state) {
        var list = $('list');
        var rows = state.rows || [];
        var threshold = state.slow_threshold_ms;
        // The engine half of the row's database badge (L32): what the settings
        // page configured, so a row never claims a connection it does not know.
        var dialect = state.dialect || '';
        // Lane L34: `logs.displayMode` picks the line limit and `log.showDuration`
        // the header flag; the page only applies what the host pushed.
        sqlLineLimit = modeLineLimit(state.displayMode);
        showDuration = state.showDuration !== false;
        var wasAtBottom = atBottom();

        while (list.firstChild) { list.removeChild(list.firstChild); }
        if (rows.length === 0) {
          list.hidden = true;
          $('empty').hidden = false;
          suppressScroll = true;
          return;
        }
        list.hidden = false;
        $('empty').hidden = true;
        var frag = document.createDocumentFragment();
        // A row belongs to an expanded group when it is flagged expanded and
        // its group key repeats the previous row's key (the host emits the
        // occurrences contiguously); those rows render indented, each with its
        // own time and duration. The `expanded` guard keeps consecutive rows of
        // a *collapsed* N+1 group from being mistaken for members.
        var prevDedupe = '';
        var prevNPlusOne = '';
        for (var i = 0; i < rows.length; i++) {
          var row = rows[i];
          var isMember = !!(row.expanded &&
            ((row.dedupe_key && row.dedupe_key === prevDedupe) ||
              (row.n_plus_one_key && row.n_plus_one_key === prevNPlusOne)));
          frag.appendChild(buildRow(row, threshold, isMember, dialect));
          prevDedupe = row.dedupe_key || '';
          prevNPlusOne = row.n_plus_one_key || '';
        }
        list.appendChild(frag);
        if (selectedLine != null) { selectLine(selectedLine); }
        var paused = state.status && state.status.paused;
        // Auto-scroll only while following (L26); the rebuild's own scroll
        // event is swallowed so it never looks like the user scrolled away.
        suppressScroll = true;
        if (!paused && follow && wasAtBottom) { list.scrollTop = list.scrollHeight; }
      }

      function updateCounts(state) {
        var c = state.counts || {};
        var slowBadge = $('slowBadge');
        if (c.slow > 0) {
          slowBadge.hidden = false;
          setText(slowBadge, (L.slowPrefix || '') + ' ' + c.slow);
        } else {
          slowBadge.hidden = true;
        }
        var hit = $('hitCount');
        var keyword = ui.keyword && ui.keyword.trim();
        setText(hit, keyword ? (c.total + ' ' + (L.hitsSuffix || '')) : '');
        var err = $('regexErr');
        var invalid = state.filter && state.filter.regex_error;
        err.hidden = !invalid;
        if (invalid) { setText(err, L.regexError); }
        updateFilterBar();
      }

      // The chips row only takes space while it states something (L32). The slow
      // count is not here: it sits at the right edge of the toolbar.
      function updateFilterBar() {
        var chips = $('focusChips');
        var hasChips = !!(chips && chips.childNodes.length);
        $('filterBar').hidden = !hasChips;
      }

      function updateStatus(state) {
        var s = state.status || {};
        var c = state.counts || {};
        setText($('statusLeft'), (L.statusConsolePrefix || '') + ' ' + (s.console_lines || 0) + ' ' + (L.statusConsoleSuffix || ''));
        var mid;
        if (c.truncated) {
          mid = (L.truncatedPrefix || '') + ' ' + c.cap;
        } else {
          mid = (L.totalPrefix || '') + ' ' + (c.total || 0) + ' ' + (L.totalSuffix || '');
        }
        setText($('statusMid'), mid.replace(/\s+/g, ' ').trim());
        // The right segment names the first mode that changes what the user
        // sees: refresh paused, follow paused, then the enhanced channel. That
        // channel keeps its own segment even while it is off — the reference
        // status bar always states both channels (`CaptureStatusBar`).
        var right;
        if (s.paused) {
          right = L.paused || '';
        } else if (s.follow === false) {
          right = L.followOff || '';
        } else if (s.agent_connected) {
          right = (L.statusAgentEventsPrefix || '') + ' ' + (s.agent_events || 0);
        } else {
          right = L.statusAgentOff || '';
        }
        setText($('statusRight'), right);
      }

      // Tabs ----------------------------------------------------------------
      function tabButton(tab) { return $('tab-' + tab); }
      function tabPanel(tab) { return $(PANELS[tab]); }

      function selectTab(tab, notify) {
        if (TAB_IDS.indexOf(tab) < 0) { return; }
        activeTab = tab;
        for (var i = 0; i < TAB_IDS.length; i++) {
          var id = TAB_IDS[i];
          var on = id === tab;
          var btn = tabButton(id);
          if (btn) {
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
            // A narrow panel scrolls the strip: the tab the host switched to
            // must be what the user sees, not an off-screen neighbour.
            if (on && btn.scrollIntoView) {
              btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
            }
          }
          var panel = tabPanel(id);

          if (!$('ctxMenu').hidden) { closeCtx(); return; }
          if (!$('settingsMenu').hidden) { openSettingsMenu(false); return; }
          if (!$('blockedMenu').hidden) { openBlockedMenu(false); return; }
          if (!$('typeMenu').hidden) { openTypeMenu(false); return; }
          if (!$('searchRow').hidden) {
            $('searchRow').hidden = true;
            $('searchBtn').classList.remove('on');
          }
        }
      });

      if (window.openidea && window.openidea.onMessage) {
        window.openidea.onMessage(function (raw) {
          try {
            var message = JSON.parse(raw);
            if (message.op === 'state') { applyState(message); }
          } catch (error) { /* ignore malformed */ }
        });
      }
      selectTab('logs', false);
      post({ op: 'ready' });
    })();
  </script>
</body>
</html>
