<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Workbench</title>
  <style>
    /* Only the IDE's own variables: the frame follows the theme without
       reloading, and there is no network or storage in this sandbox. */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-ui, sans-serif);
      color: var(--openidea-fg);
      background: var(--openidea-bg, transparent);
    }
    button, select {
      font: inherit;
      color: var(--openidea-fg);
      background: var(--openidea-bg-input, var(--openidea-bg-elevated));
      border: 1px solid var(--openidea-border);
      border-radius: 3px;
      padding: 2px 10px;
      cursor: pointer;
    }
    button:not(:disabled):hover { background: var(--openidea-bg-hover); }
    button:disabled {
      color: var(--openidea-fg-muted);
      border-style: dashed;
      cursor: default;
    }
    button:focus-visible, select:focus-visible, textarea:focus-visible,
    .tab:focus-visible, .splitter:focus-visible {
      outline: 2px solid var(--openidea-focus-ring);
      outline-offset: -1px;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px 8px;
    }
    .toolbar .muted { margin-left: 4px; }
    .pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .pane.top { flex: 0 0 40%; }
    .pane.preview { flex: 1 1 auto; }
    .hint { padding: 0 8px 4px; color: var(--openidea-fg-muted); }
    #input {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0 8px 8px;
      padding: 6px 8px;
      resize: none;
      color: var(--openidea-fg);
      background: var(--openidea-bg-input);
      border: 1px solid var(--openidea-border);
      border-radius: 3px;
      font: var(--openidea-font-size, 13px)/1.5 var(--openidea-font-mono, monospace);
    }
    .splitter {
      flex: 0 0 6px;
      cursor: row-resize;
      background: var(--openidea-border);
      opacity: 0.6;
    }
    .splitter:hover, .splitter.dragging {
      background: var(--openidea-accent);
      opacity: 1;
    }
    .meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 4px 8px;
    }
    .chip {
      padding: 0 6px;
      border: 1px solid var(--openidea-border);
      border-radius: 3px;
      white-space: nowrap;
    }
    .badge {
      padding: 0 6px;
      border-radius: 3px;
      background: var(--openidea-bg-selected);
      font-size: 11px;
    }
    .badge.partial { color: var(--openidea-warning); }
    .badge.unresolved { color: var(--openidea-danger); }
    .muted { color: var(--openidea-fg-muted); }
    .advice { font-size: 11px; }
    .cols {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      border-top: 1px solid var(--openidea-border);
    }
    .params {
      flex: 0 0 30%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--openidea-border);
    }
    .pane-title {
      padding: 4px 8px 2px;
      font-weight: 600;
    }
    .scroll { flex: 1 1 auto; overflow: auto; padding: 4px 8px 8px; }
    .sqlside {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .tabs {
      display: flex;
      gap: 2px;
      padding: 4px 8px 0;
      border-bottom: 1px solid var(--openidea-border);
    }
    .tab {
      padding: 3px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 3px 3px 0 0;
    }
    .tab[aria-selected="true"] {
      background: var(--openidea-bg-elevated);
      border-color: var(--openidea-border);
    }
    .tab-body {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 8px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--openidea-font-mono, monospace);
    }
    .footer {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-top: 1px solid var(--openidea-border);
    }
    .status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .grow { flex: 1 1 auto; min-width: 0; }
  </style>
</head>
<body>
  <!-- Input pane: the IntelliJ panel's top half. -->
  <section class="pane top" id="pane-top">
    <div class="toolbar">
      <button id="resolve" type="button"></button>
      <button id="format" type="button"></button>
      <button id="load-file" type="button"></button>
      <button id="clear" type="button"></button>
      <button id="open-dialog" type="button" disabled></button>
    </div>
    <div class="hint" id="input-hint"></div>
    <textarea id="input" spellcheck="false"></textarea>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal"
       tabindex="0"></div>

  <!-- Preview pane: meta line, toolbar, parameters beside the tabbed SQL. -->
  <section class="pane preview">
    <div class="meta">
      <span class="chip" id="dialect-chip"></span>
      <span class="muted" id="dialect-hint"></span>
      <span class="badge" id="confidence" hidden></span>
      <span class="advice muted" id="advice"></span>
    </div>
    <div class="toolbar">
      <button id="copy" type="button"></button>
      <button id="format-preview" type="button"></button>
      <label class="muted" id="mode-label" for="mode"></label>
      <select id="mode">
        <option value="normal"></option>
        <option value="formatted"></option>
      </select>
      <button id="export" type="button"></button>
    </div>
    <div class="cols">
      <div class="params">
        <div class="pane-title" id="params-title"></div>
        <div class="scroll"><pre id="params" class="muted"></pre></div>
      </div>
      <div class="sqlside">
        <div class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="sql" aria-selected="true"></button>
          <button class="tab" type="button" role="tab" data-tab="raw" aria-selected="false"></button>
          <button class="tab" type="button" role="tab" data-tab="columns" aria-selected="false"></button>
        </div>
        <pre class="tab-body" id="tab-body" role="tabpanel"></pre>
      </div>
    </div>
    <div class="footer">
      <button id="execute" type="button" disabled></button>
      <button id="copy-sql" type="button"></button>
      <span class="status grow" id="status"></span>
    </div>
  </section>

  <script>
    (function () {
      'use strict';

      var LABEL_KEYS = {
        resolve: 'resolve',
        format: 'format',
        'load-file': 'loadFile',
        clear: 'clear',
        'open-dialog': 'openDialog',
        copy: 'copySql',
        'format-preview': 'format',
        export: 'export',
        execute: 'execute',
        'copy-sql': 'copySql'
      };
      var TAB_KEYS = { sql: 'tabSql', raw: 'tabRaw', columns: 'tabColumns' };
      var TAB_ORDER = ['sql', 'raw', 'columns'];

      var model = {};
      var labels = {};
      var dialectInfo = {};
      var activeTab = 'sql';
      var displayMode = 'normal';

      function node(id) {
        return document.getElementById(id);
      }

      function setText(id, text) {
        var target = node(id);
        if (target) {
          target.textContent = text === null || text === undefined ? '' : String(text);
        }
      }

      function post(message) {
        if (window.openidea && window.openidea.postMessage) {
          window.openidea.postMessage(JSON.stringify(message));
        }
      }

      function inputText() {
        var editor = node('input');
        return editor ? editor.value : '';
      }

      // --- splitter -------------------------------------------------------
      var paneTop = node('pane-top');
      var splitter = node('splitter');
      var dragging = false;

      function setTopFraction(fraction) {
        if (!paneTop) {
          return;
        }
        var clamped = Math.min(0.8, Math.max(0.15, fraction));
        paneTop.style.flexBasis = (clamped * 100) + '%';
      }

      function topFraction() {
        var total = document.body.getBoundingClientRect().height;
        if (!paneTop || total <= 0) {
          return 0.4;
        }
        return paneTop.getBoundingClientRect().height / total;
      }

      if (splitter) {
        splitter.addEventListener('pointerdown', function (event) {
          dragging = true;
          splitter.classList.add('dragging');
          if (splitter.setPointerCapture) {
            splitter.setPointerCapture(event.pointerId);
          }
          event.preventDefault();
        });
        splitter.addEventListener('pointermove', function (event) {
          if (!dragging) {
            return;
          }
          var rect = document.body.getBoundingClientRect();
          if (rect.height > 0) {
            setTopFraction((event.clientY - rect.top) / rect.height);
          }
        });
        var stopDrag = function (event) {
          if (!dragging) {
            return;
          }
          dragging = false;
          splitter.classList.remove('dragging');
          if (splitter.releasePointerCapture && event.pointerId !== undefined) {
            try {
              splitter.releasePointerCapture(event.pointerId);
            } catch (error) {
              /* the capture was already released */
            }
          }
        };
        splitter.addEventListener('pointerup', stopDrag);
        splitter.addEventListener('pointercancel', stopDrag);
        splitter.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') {
            return;
          }
          setTopFraction(topFraction() + (event.key === 'ArrowDown' ? 0.02 : -0.02));
          event.preventDefault();
        });
      }

      // --- tabs and modes -------------------------------------------------
      function tabButtons() {
        return document.querySelectorAll('.tab');
      }

      function selectTab(key) {
        if (TAB_ORDER.indexOf(key) < 0) {
          return;
        }
        activeTab = key;
        var buttons = tabButtons();
        for (var index = 0; index < buttons.length; index++) {
          var selected = buttons[index].getAttribute('data-tab') === key;
          buttons[index].setAttribute('aria-selected', selected ? 'true' : 'false');
        }
        renderTab();
      }

      function setMode(mode) {
        displayMode = mode === 'formatted' ? 'formatted' : 'normal';
        var select = node('mode');
        if (select && select.value !== displayMode) {
          select.value = displayMode;
        }
        renderTab();
      }

      function tabs() {
        return model.tabs || {};
      }

      function renderTab() {
        var body = node('tab-body');
        if (!body) {
          return;
        }
        var text = '';
        var placeholder = false;
        if (activeTab === 'sql') {
          if (!model.sql && model.reason) {
            text = (labels.reasonTitle || '') + '\n' + model.reason;
          } else if (!model.sql) {
            text = labels.empty || '';
            placeholder = true;
          } else {
            var source = tabs();
            text = displayMode === 'formatted'
              ? (source.formatted || source.sql || '')
              : (source.sql || '');
            if (model.reason) {
              // A partial render keeps its SQL and explains itself below it,
              // the way `render-xml` prints reasons as comments.
              text += '\n\n-- ' + (labels.reasonTitle || '');
              var reasons = model.reason.split('\n');
              for (var line = 0; line < reasons.length; line++) {
                text += '\n-- ' + reasons[line];
              }
            }
          }
        } else if (activeTab === 'raw') {
          text = tabs().raw || '';
          placeholder = !text;
        } else {
          text = tabs().columns || '';
          if (!text) {
            text = labels.columnsEmpty || '';
            placeholder = true;
          }
        }
        body.textContent = text;
        if (placeholder) {
          body.className = 'tab-body muted';
        } else {
          body.className = 'tab-body';
        }
        body.scrollTop = 0;
      }

      // --- apply a state push ---------------------------------------------
      function applyState(payload) {
        if (!payload) {
          return;
        }
        model = payload.model || {};
        labels = payload.labels || {};
        dialectInfo = payload.dialect || {};

        var buttons = Object.keys(LABEL_KEYS);
        for (var index = 0; index < buttons.length; index++) {
          setText(buttons[index], labels[LABEL_KEYS[buttons[index]]]);
        }

        var dialogButton = node('open-dialog');
        if (dialogButton) {
          dialogButton.title = labels.openDialogNote || '';
        }
        var executeButton = node('execute');
        if (executeButton) {
          executeButton.title = labels.executeNote || '';
        }
        setText('input-hint', labels.hintInput);
        setText('params-title', labels.params);
        setText('mode-label', labels.mode);

        var modeSelect = node('mode');
        if (modeSelect && modeSelect.options.length >= 2) {
          modeSelect.options[0].textContent = labels.modeNormal || '';
          modeSelect.options[1].textContent = labels.modeFormatted || '';
        }

        var name = dialectInfo.name || model.dialect || '';
        var suffix = dialectInfo.isDefault ? (labels.dialectDefault || '') : '';
        setText('dialect-chip', (labels.dialect || '') + ': ' + name + suffix);
        var chip = node('dialect-chip');
        if (chip) {
          chip.title = dialectInfo.capabilities || '';
        }
        setText('dialect-hint', labels.dialectHint);
        setText('advice', model.advice);

        var badge = node('confidence');
        if (badge) {
          var level = model.confidence === 'partial' || model.confidence === 'unresolved'
            ? model.confidence
            : '';
          badge.className = level ? 'badge ' + level : 'badge';
          badge.textContent = labels.confidenceLabel || '';
          badge.hidden = !labels.confidenceLabel;
        }

        var params = model.params || [];
        setText('params', params.length ? params.join('\n') : '—');

        var columns = tabs().columns || '';
        var tabElements = tabButtons();
        for (var tabIndex = 0; tabIndex < tabElements.length; tabIndex++) {
          var key = tabElements[tabIndex].getAttribute('data-tab');
          tabElements[tabIndex].textContent = labels[TAB_KEYS[key]] || key;
          tabElements[tabIndex].title = key === 'columns' && !columns
            ? (labels.columnsEmpty || '')
            : '';
        }

        if (payload.replaceInput) {
          var editor = node('input');
          if (editor) {
            editor.value = tabs().raw || '';
          }
        }

        setText('status', payload.status ? payload.status.text : '');
        renderTab();
      }

      // --- wiring ---------------------------------------------------------
      function onButton(id, handler) {
        var target = node(id);
        if (target) {
          target.addEventListener('click', handler);
        }
      }

      onButton('resolve', function () {
        post({ op: 'render', text: inputText(), kind: '' });
      });
      onButton('format', function () {
        post({ op: 'format', text: inputText() });
      });
      onButton('load-file', function () {
        post({ op: 'load-file' });
      });
      onButton('clear', function () {
        post({ op: 'clear' });
      });
      onButton('copy', function () {
        post({ op: 'copy' });
      });
      onButton('copy-sql', function () {
        post({ op: 'copy' });
      });
      onButton('export', function () {
        post({ op: 'export' });
      });
      onButton('format-preview', function () {
        setMode('formatted');
      });

      var modeSelect = node('mode');
      if (modeSelect) {
        modeSelect.addEventListener('change', function () {
          setMode(modeSelect.value);
        });
      }

      var tabElements = tabButtons();
      for (var index = 0; index < tabElements.length; index++) {
        (function (element) {
          element.addEventListener('click', function () {
            selectTab(element.getAttribute('data-tab'));
          });
        })(tabElements[index]);
      }

      var editor = node('input');
      if (editor) {
        editor.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            event.preventDefault();
            post({ op: 'render', text: editor.value, kind: '' });
          }
        });
      }

      if (window.openidea && window.openidea.onMessage) {
        window.openidea.onMessage(function (raw) {
          var message;
          try {
            message = JSON.parse(raw);
          } catch (error) {
            return;
          }
          if (message && message.op === 'state') {
            applyState(message);
          }
        });
      }

      post({ op: 'ready' });
    })();
  </script>
</body>
</html>
